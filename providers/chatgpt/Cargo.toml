[package]
name = "codex-chatgpt-provider"
version = "0.1.0"
edition = "2021"
rust-version = "1.98.0"
publish = false

[workspace]

[dependencies]
axum = { version = "=0.8.9", default-features = false, features = ["http1", "json", "tokio", "ws"] }
base64 = "=0.22.1"
futures-util = { version = "=0.3.34", features = ["sink"] }
hmac = "=0.12.1"
libc = "=0.2.186"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.149"
sha2 = "=0.10.9"
tokio = { version = "=1.53.3", features = ["rt-multi-thread", "macros", "sync", "time", "net", "process", "signal", "io-util", "io-std", "fs"] }
tokio-tungstenite = "=0.29.0"
tokio-util = { version = "=0.7.20", features = ["rt"] }
toml = "=0.8.23"
zstd = { version = "=0.13.3", default-features = false }

[dev-dependencies]
tokio = { version = "=1.53.3", features = ["test-util"] }
