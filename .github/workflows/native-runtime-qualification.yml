name: Independent Native runtime execution proof
on:
  workflow_call:
    inputs:
      source_sha:
        required: true
        type: string
permissions:
  contents: read
jobs:
  native-proof:
    name: Core runtime Native completion and retained history
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 180
    env:
      CODEX_SOURCE_SHA: ${{ inputs.source_sha }}
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_DEV_INCREMENTAL: 'false'
      CARGO_PROFILE_DEV_OPT_LEVEL: '1'
      CARGO_PROFILE_TEST_OPT_LEVEL: '0'
      CARGO_PROFILE_RELEASE_OPT_LEVEL: 'z'
      CARGO_PROFILE_RELEASE_CODEGEN_UNITS: '1'
      CARGO_PROFILE_RELEASE_STRIP: 'symbols'
      CARGO_BUILD_JOBS: '3'
      CARGO_TARGET_DIR: ${{ github.workspace }}/upstream/codex-rs/target
      CODEX_PROFILE_CORE: ''
    steps:
      - name: Fetch exact runtime qualification authority
        shell: bash
        run: |
          set -euo pipefail
          [[ "$CODEX_SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          git init experiment
          git -C experiment remote add origin "https://github.com/$GITHUB_REPOSITORY.git"
          git -C experiment fetch --no-tags --depth=1 origin "$CODEX_SOURCE_SHA"
          git -C experiment checkout --detach FETCH_HEAD
          test "$(git -C experiment rev-parse HEAD)" = "$CODEX_SOURCE_SHA"
          test -z "$(git -C experiment status --porcelain)"
      - name: Load exact release input authority
        shell: bash
        run: |
          set -euo pipefail
          python3 experiment/.github/scripts/upstream_release.py experiment/release/upstream.json --component frontend >> "$GITHUB_ENV"
      - name: Fetch exact unmodified official source
        shell: bash
        run: |
          set -euo pipefail
          git init upstream
          git -C upstream remote add origin https://github.com/openai/codex.git
          git -C upstream fetch --no-tags --depth=1 origin "$UPSTREAM_SHA"
          git -C upstream checkout --detach FETCH_HEAD
          test "$(git -C upstream rev-parse HEAD)" = "$UPSTREAM_SHA"
          test -z "$(git -C upstream status --porcelain)"
      - name: Provision ephemeral source build tools
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install "$RUST_VERSION" --profile minimal --component rustfmt,clippy --target aarch64-unknown-linux-musl
          test "$(uname -m)" = aarch64
      - name: Install official release Zig toolchain
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/zig-linux-aarch64-0.14.0.tar.xz"
          curl --fail --silent --show-error https://ziglang.org/download/0.14.0/zig-linux-aarch64-0.14.0.tar.xz -o "$archive"
          echo "ab64e3ea277f6fc5f3d723dcd95d9ce1ab282c8ed0f431b4de880d30df891e4f  $archive" | sha256sum -c -
          tar -xJf "$archive" -C "$RUNNER_TEMP"
          tool="$RUNNER_TEMP/zig-linux-aarch64-0.14.0"
          test "$("$tool/zig" version)" = 0.14.0
          echo "$tool" >> "$GITHUB_PATH"
      - name: Use exact upstream musl native dependency tooling
        shell: bash
        env:
          TARGET: aarch64-unknown-linux-musl
          APT_UPDATE_ARGS: -qq
          APT_INSTALL_ARGS: --no-install-recommends
          OPENSSL_BUILD_JOBS: '3'
        run: |
          set -euo pipefail
          bash upstream/.github/scripts/install-musl-build-tools.sh
          echo 'AWS_LC_SYS_NO_JITTER_ENTROPY=1' >> "$GITHUB_ENV"
          echo 'AWS_LC_SYS_NO_JITTER_ENTROPY_aarch64_unknown_linux_musl=1' >> "$GITHUB_ENV"
      - name: Restore isolated Native runtime test cache
        id: compile-cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            upstream/codex-rs/target
          key: native-runtime-proof-aarch64-musl-${{ env.RUST_VERSION }}-${{ env.UPSTREAM_SHA }}-${{ inputs.source_sha }}
          restore-keys: |
            native-runtime-proof-aarch64-musl-${{ env.RUST_VERSION }}-${{ env.UPSTREAM_SHA }}-
            native-runtime-proof-aarch64-musl-${{ env.RUST_VERSION }}-
      - name: Prepare the exact basic runtime production source
        shell: bash
        run: |
          set -euo pipefail
          CARGO_TARGET_DIR="$RUNNER_TEMP/source-tools" cargo "+$RUST_VERSION" build \
            --manifest-path experiment/Cargo.toml --release --locked -p codex-release-builder
          builder="$RUNNER_TEMP/source-tools/release/codex-release-builder"
          for patch in experiment/crates/release-builder/src/native_route.patch; do
            patch_base="$("$builder" patch-base --patch "$GITHUB_WORKSPACE/$patch")"
            if ! git -C upstream cat-file -e "$patch_base^{commit}"; then
              git -C upstream fetch --no-tags --depth=1 origin "$patch_base"
            fi
          done
          "$builder" prepare-source --source "$GITHUB_WORKSPACE/upstream" \
            --version "$UPSTREAM_VERSION" --source-sha "$UPSTREAM_SHA" --frontend upstream \
            > "$RUNNER_TEMP/native-runtime-preparation.json"
          "$builder" normalize-lock --source "$GITHUB_WORKSPACE/upstream/codex-rs" \
            --openssl /usr/bin/openssl --audit "$RUNNER_TEMP/native-runtime-lock-audit.json"
          python3 - <<'PYTHON'
          import json, os
          from pathlib import Path
          recipe = json.loads(Path('experiment/release/upstream.json').read_text())
          audit = json.loads((Path(os.environ['RUNNER_TEMP']) / 'native-runtime-lock-audit.json').read_text())
          assert audit == recipe['qualification']['lock_audit'], 'runtime dependency audit differs from exact production input'
          PYTHON
      - name: Provision pinned upstream test and formatting tools
        shell: bash
        run: |
          set -euo pipefail
          tools="$RUNNER_TEMP/profile-test-tools"
          mkdir -p "$tools"
          acquire() {
            local url="$1" digest="$2" name="$3"
            curl --location --fail --silent --show-error "$url" -o "$tools/$name.tar.gz"
            echo "$digest  $tools/$name.tar.gz" | sha256sum -c -
            mkdir "$tools/$name"
            tar -xzf "$tools/$name.tar.gz" -C "$tools/$name"
            find "$tools/$name" -type f -name "$name" -exec cp {} "$tools/$name-bin" \;
            test -x "$tools/$name-bin"
            mkdir -p "$tools/bin"
            cp "$tools/$name-bin" "$tools/bin/$name"
          }
          acquire https://github.com/casey/just/releases/download/1.51.0/just-1.51.0-aarch64-unknown-linux-musl.tar.gz ed7ec466b77709198fd4afed253dba0270203ba5eb1c006bee2b0139090284f5 just
          acquire https://github.com/nextest-rs/nextest/releases/download/cargo-nextest-0.9.146/cargo-nextest-0.9.146-aarch64-unknown-linux-musl.tar.gz 62ae8b4ad034704f67417f8ed8b897566d82359ab44952729b925fb37eeb7622 cargo-nextest
          acquire https://github.com/facebook/dotslash/releases/download/v0.5.9/dotslash-linux-musl.aarch64.tar.gz 11323ef72fac5885d7c54bff70d666486bd800a8d908d0acd3bd838fd8a9b0db dotslash
          acquire https://github.com/astral-sh/uv/releases/download/0.12.23/uv-aarch64-unknown-linux-gnu.tar.gz 6524bd338177ed50d035d39354e12545e993bbeba2ecbddf0480c5b3a81d313f uv
          echo "$tools/bin" >> "$GITHUB_PATH"
      - name: Generate the exact runtime protocol contracts
        shell: bash
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/source-tools/release/codex-release-builder" generate-schema \
            --source "$GITHUB_WORKSPACE/upstream" --recipe "$GITHUB_WORKSPACE/experiment/release/upstream.json" \
            --target-dir "$CARGO_TARGET_DIR" --rustc "$(command -v rustc)" --cargo "$(command -v cargo)" \
            2>&1 | tee "$RUNNER_TEMP/native-runtime-schema.log"
          git -C upstream add -N codex-rs
          git -C upstream diff --check
          git -C upstream diff -- codex-rs > "$RUNNER_TEMP/native-runtime-prepared.patch"
      - name: Verify Native completion uses original OS wait evidence
        shell: bash
        run: |
          set -euo pipefail
          cd upstream
          just test --retries 0 --status-level pass --locked --target aarch64-unknown-linux-musl -p codex-utils-pty --lib 2>&1 | tee "$RUNNER_TEMP/native-provider-completion-pty.log"
          python3 "$GITHUB_WORKSPACE/experiment/.github/scripts/native_completion_results.py" pty "$RUNNER_TEMP/native-provider-completion-pty.log"
          just test --retries 0 --status-level pass --locked --target aarch64-unknown-linux-musl -p codex-core --lib -E 'test(native_completion_)' 2>&1 | tee "$RUNNER_TEMP/native-provider-completion-core.log"
          python3 "$GITHUB_WORKSPACE/experiment/.github/scripts/native_completion_results.py" core "$RUNNER_TEMP/native-provider-completion-core.log"
          just test --retries 0 --status-level pass --locked --target aarch64-unknown-linux-musl -p codex-guardian-v2 --lib -E 'test(native_completion_)' 2>&1 | tee "$RUNNER_TEMP/native-provider-completion-guardian.log"
          python3 "$GITHUB_WORKSPACE/experiment/.github/scripts/native_completion_results.py" guardian "$RUNNER_TEMP/native-provider-completion-guardian.log"
          just test --retries 0 --status-level pass --locked --target aarch64-unknown-linux-musl -p codex-protocol --lib -E 'test(native_completion_)' 2>&1 | tee "$RUNNER_TEMP/native-provider-completion-protocol.log"
          python3 "$GITHUB_WORKSPACE/experiment/.github/scripts/native_completion_results.py" protocol "$RUNNER_TEMP/native-provider-completion-protocol.log"
          just test --retries 0 --status-level pass --locked --target aarch64-unknown-linux-musl -p codex-rollout --lib 2>&1 | tee "$RUNNER_TEMP/native-provider-completion-rollout.log"
          python3 "$GITHUB_WORKSPACE/experiment/.github/scripts/native_completion_results.py" rollout "$RUNNER_TEMP/native-provider-completion-rollout.log"
          just test --retries 0 --status-level pass --locked --target aarch64-unknown-linux-musl -p codex-app-server-protocol --lib -E 'test(native_completion_)' 2>&1 | tee "$RUNNER_TEMP/native-provider-completion-app-server-protocol.log"
          python3 "$GITHUB_WORKSPACE/experiment/.github/scripts/native_completion_results.py" app-server-protocol "$RUNNER_TEMP/native-provider-completion-app-server-protocol.log"
          just test --retries 0 --status-level pass --locked --target aarch64-unknown-linux-musl -p codex-hooks --lib -E 'test(native_completion_)' 2>&1 | tee "$RUNNER_TEMP/native-provider-completion-hooks.log"
          python3 "$GITHUB_WORKSPACE/experiment/.github/scripts/native_completion_results.py" hooks "$RUNNER_TEMP/native-provider-completion-hooks.log"
      - name: Verify actual hook matching used by Native resource proof
        shell: bash
        run: |
          set -euo pipefail
          cd upstream/codex-rs
          cargo "+$RUST_VERSION" test --locked --target aarch64-unknown-linux-musl -p codex-hooks --lib native_resource_proof_ -- --nocapture 2>&1 | tee "$RUNNER_TEMP/native-provider-hooks.log"
          python3 - <<'PYTHON'
          import os, re
          from pathlib import Path
          text = (Path(os.environ['RUNNER_TEMP']) / 'native-provider-hooks.log').read_text()
          names = [
              'native_resource_proof_retains_unrelated_input_hook_and_its_dispatch',
              'native_resource_proof_rejects_each_matching_tool_event_and_permission_alias',
              'native_resource_proof_rejects_unknown_async_and_non_tool_hook_effects',
              'native_resource_proof_rejects_async_work_retained_after_reconfiguration',
          ]
          for name in names:
              assert re.search(r'(?m)^test [A-Za-z0-9_:]*' + name + r' \.\.\. ok$', text), name
          assert re.search(r'test result: ok\. [4-9][0-9]* passed; 0 failed; 0 ignored;', text), text[-6000:]
          PYTHON
      - name: Bind successful runtime proof to exact production inputs
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PYTHON'
          import hashlib, json, os, subprocess, sys
          from pathlib import Path
          source = Path('experiment').resolve()
          sys.path.insert(0, str(source / '.github/scripts'))
          from runtime_inputs import production_fingerprint, adapted_production_fingerprint
          root = Path(os.environ['RUNNER_TEMP'])
          names = ['native-runtime-preparation.json', 'native-runtime-lock-audit.json',
                   'native-runtime-schema.log', 'native-runtime-prepared.patch', 'native-provider-hooks.log']
          names += ['native-provider-completion-' + suite + '.log' for suite in
                    ['pty', 'core', 'guardian', 'protocol', 'rollout', 'app-server-protocol', 'hooks']]
          sha = subprocess.check_output(['git', '-C', str(source), 'rev-parse', 'HEAD'], text=True).strip()
          assert sha == os.environ['CODEX_SOURCE_SHA']
          proof = {'schema': 'codex-native-runtime-qualification-v1', 'source_sha': sha,
                   'frontend': 'upstream', 'production_fingerprint': production_fingerprint(source),
                   'adapted_production_fingerprint': adapted_production_fingerprint(source),
                   'run_id': os.environ['GITHUB_RUN_ID'], 'run_attempt': os.environ['GITHUB_RUN_ATTEMPT'],
                   'upstream': json.loads((source / 'release/upstream.json').read_text())['upstream'],
                   'logs': {name: hashlib.sha256((root / name).read_bytes()).hexdigest() for name in names}}
          (root / 'native-runtime-qualification.json').write_text(json.dumps(proof, sort_keys=True, indent=2) + '\n')
          PYTHON
      - name: Retain Native runtime proof and failure evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: native-runtime-proof
          if-no-files-found: error
          path: |
            ${{ runner.temp }}/native-runtime-*.json
            ${{ runner.temp }}/native-runtime-*.log
            ${{ runner.temp }}/native-runtime-prepared.patch
            ${{ runner.temp }}/native-provider-completion-*.log
            ${{ runner.temp }}/native-provider-hooks.log
      - name: Retain Native runtime compile cache
        if: ${{ !cancelled() && steps.compile-cache.outcome == 'success' && steps.compile-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            upstream/codex-rs/target
          key: native-runtime-proof-aarch64-musl-${{ env.RUST_VERSION }}-${{ env.UPSTREAM_SHA }}-${{ inputs.source_sha }}
