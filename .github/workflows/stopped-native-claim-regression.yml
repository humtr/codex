name: Stopped Native claim regression
on:
  push:
    branches: [fix/stopped-native-shared-claim-reconciliation]
permissions:
  contents: read
concurrency:
  group: stopped-native-claim-regression
  cancel-in-progress: false
jobs:
  regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Fetch exact temporary test source
        shell: bash
        run: |
          set -euo pipefail
          git init source
          git -C source remote add origin "https://github.com/$GITHUB_REPOSITORY.git"
          git -C source fetch --no-tags --depth=1 origin "$GITHUB_SHA"
          git -C source checkout --detach FETCH_HEAD
          test "$(git -C source rev-parse HEAD)" = "$GITHUB_SHA"
      - name: Install exact provider test runner
        shell: bash
        run: |
          set -euo pipefail
          tool="$RUNNER_TEMP/provider-bun"
          mkdir -m 0700 "$tool"
          curl --fail --silent --show-error --location --proto '=https' --tlsv1.2 --connect-timeout 15 --max-time 180 --max-filesize 67108864 https://github.com/oven-sh/bun/releases/download/bun-v1.4.0/bun-linux-x64-baseline.zip --output "$tool/bun.zip"
          echo "184fb4595f0d401a217cf7c78c1bc430ba83314dab7a8b94805babbf7fa7097f  $tool/bun.zip" | sha256sum -c -
          unzip -p "$tool/bun.zip" bun-linux-x64-baseline/bun > "$tool/bun"
          chmod 0700 "$tool/bun"
          test "$("$tool/bun" --version)" = 1.4.0
          echo "BUN=$tool/bun" >> "$GITHUB_ENV"
      - name: Run stopped-claim regression
        shell: bash
        run: |
          set -euo pipefail
          version=$(python3 -c 'import tomllib; print(tomllib.load(open("source/providers/chatgpt/Cargo.toml", "rb"))["package"]["rust-version"])')
          rustup toolchain install "$version" --profile minimal --component rustfmt
          cd source
          cargo "+$version" fmt --manifest-path providers/chatgpt/Cargo.toml --all -- --check
          set +e
          "$BUN" test providers/chatgpt/app_bridge.test.mjs
          js_status=$?
          cargo "+$version" test --manifest-path providers/chatgpt/Cargo.toml --locked --lib nc_confirmed_stop_releases_orphaned_physical_claim_after_mirror_settled
          claim_status=$?
          cargo "+$version" test --manifest-path providers/chatgpt/Cargo.toml --locked --test app_engine http_413_snapshot_preserves_native_submission_and_specific_status
          rust_status=$?
          set -e
          test "$js_status" -eq 0
          test "$claim_status" -eq 0
          test "$rust_status" -eq 0
