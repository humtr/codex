name: Independent Core/runtime qualification

on:
  push:
    branches: [rewrite/rust-core]
    paths:
      - '.github/workflows/core-runtime-qualification.yml'
      - '.github/workflows/qualify-termux-runtime.yml'
      - '.github/workflows/termux-runtime-source.yml'
      - '.github/scripts/runtime_inputs.py'
      - 'release/runtime-build-inputs-v1'
      - '.github/scripts/rald3_preflight.py'
      - '.github/scripts/release_decision.py'
      - '.github/scripts/release_heads.py'
      - '.github/scripts/upstream_release.py'
      - 'release/upstream.json'
      - 'crates/core/**'
      - 'crates/runtime-binding/**'
      - 'crates/release-builder/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
  workflow_dispatch:
    inputs:
      rebuild_current:
        description: Qualify authenticated current runtime; false discovers latest upstream
        type: boolean
        default: true

permissions:
  contents: read
  actions: read

jobs:
  qualify:
    uses: ./.github/workflows/qualify-termux-runtime.yml
    with:
      source_sha: ${{ github.sha }}
      base_only: true
      publish: false
      rebuild_current: ${{ github.event_name == 'push' || inputs.rebuild_current }}

  notify_acceptance:
    needs: qualify
    if: always()
    permissions:
      contents: read
      actions: write
    runs-on: ubuntu-24.04
    steps:
      - name: Continue accepted input processing
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh api 'repos/humtr/codex/contents/.github/workflows/accepted-release-inputs.yml?ref=main' --silent; then
            gh workflow run accepted-release-inputs.yml --repo humtr/codex --ref main -f completed_run="$GITHUB_RUN_ID"
          fi
