name: Independent Core/runtime qualification

on:
  push:
    branches: [rewrite/rust-core]
  workflow_dispatch:
    inputs:
      advance_release:
        description: Signal separately authorized exact-source release intent on main
        type: boolean
        default: false
      rebuild_current:
        description: Qualify authenticated current runtime; false discovers latest upstream
        type: boolean
        default: true

permissions:
  contents: read
  actions: read

jobs:
  qualify:
    uses: ./.github/workflows/qualify-termux-runtime.yml
    with:
      source_sha: ${{ github.sha }}
      base_only: true
      publish: false
      rebuild_current: ${{ github.event_name == 'push' || inputs.rebuild_current }}

  notify_acceptance:
    needs: qualify
    if: always() && needs.qualify.result == 'success' && github.ref == 'refs/heads/rewrite/rust-core' && github.event_name == 'workflow_dispatch' && inputs.advance_release
    permissions:
      contents: read
      actions: write
    runs-on: ubuntu-24.04
    steps:
      - name: Continue accepted input processing
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh api 'repos/humtr/codex/contents/.github/workflows/accepted-release-inputs.yml?ref=main' --silent; then
            gh workflow run accepted-release-inputs.yml --repo humtr/codex --ref main -f completed_run="$GITHUB_RUN_ID"
          fi
