name: Standalone upstream verification

on:
  workflow_dispatch:
    inputs:
      upstream_version:
        description: Optional exact stable version; empty checks official latest
        type: string
        default: ''

# Manual read-only compatibility canary over disposable artifacts.
# Local `codex update --upstream` works independently without this workflow.
# It cannot publish, sign, advance release inputs, activate a device, or access user accounts.
permissions:
  contents: read

concurrency:
  group: wrapper-upstream-readonly
  cancel-in-progress: false

jobs:
  verify:
    name: Qualify official upstream through standalone Wrapper
    permissions:
      contents: read
    uses: humtr/codex/.github/workflows/wrapper-verify.yml@0519fc5c18f7f330f1391775afd6442f5513094d
    with:
      source_sha: 0519fc5c18f7f330f1391775afd6442f5513094d
      check_upstream: true
      qualify_upstream: true
      upstream_version: ${{ inputs.upstream_version || '' }}
