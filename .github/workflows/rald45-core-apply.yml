name: RALD-4.5 core correction apply

on:
  push:
    branches:
      - rald45/activation-safe-probe

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply exact correction
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/rald45_apply_core.py
          cargo fmt --all
          git diff --check
          git diff -- crates/core/src/main.rs

      - name: Verify focused contracts
        shell: bash
        env:
          PREFIX: /usr
          TMPDIR: /tmp
        run: |
          set -euo pipefail
          cargo fmt --all -- --check
          cargo test -p codex test_m2_b4_activation_version_probe_failure_preserves_old_current_and_doctor_health_does_not_gate -- --nocapture
          cargo test -p codex test_doctor_is_bounded_read_only_and_preserves_upstream_report -- --nocapture

      - name: Commit verified correction
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add crates/core/src/main.rs
          git diff --cached --check
          git commit -m 'fix: separate activation integrity from upstream doctor health'
          git push origin HEAD:rald45/activation-safe-probe
