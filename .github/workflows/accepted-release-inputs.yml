name: Advance accepted release inputs
run-name: ${{ inputs.requested_upstream && format('Codex build request {0}', inputs.requested_upstream) || 'Advance accepted release inputs' }}
on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:
    inputs:
      discover_upstream:
        description: Resolve newly published official stable before qualification
        type: boolean
        default: false
      completed_run:
        description: Optional completion handshake; it grants no proof authority
        type: string
        default: ''
      requested_upstream:
        description: Manual update request label; official discovery remains authoritative
        type: string
        default: ''
permissions:
  contents: write
  actions: write
  issues: write
concurrency:
  group: accepted-termux-release-inputs
  cancel-in-progress: false
jobs:
  advance:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Fetch exact owned source for proof checking
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
          COMPLETED_RUN: ${{ inputs.completed_run }}
        run: |
          set -euo pipefail
          completed="${COMPLETED_RUN:-}"
          if test -n "$completed"; then
            [[ "$completed" =~ ^[1-9][0-9]{0,19}$ ]]
            for attempt in $(seq 1 60); do
              status="$(gh api "repos/humtr/codex/actions/runs/$completed" --jq '.status')"
              if test "$status" = completed; then break; fi
              sleep 2
            done
            test "$status" = completed
          fi
          sha="$(gh api repos/humtr/codex/git/ref/heads/rewrite/rust-core --jq '.object.sha')"
          [[ "$sha" =~ ^[0-9a-f]{40}$ ]]
          git init source
          git -C source remote add origin https://github.com/humtr/codex.git
          git -C source fetch --no-tags --depth=1 origin "$sha"
          git -C source checkout --detach FETCH_HEAD
          test "$(git -C source rev-parse HEAD)" = "$sha"
          # Do not execute a newly fetched privileged controller until that exact
          # repository-owned source has passed the full source acceptance gate.
          gh api "repos/humtr/codex/actions/workflows/rald7-full-acceptance.yml/runs?head_sha=$sha&per_page=100" > "$RUNNER_TEMP/source-runs.json"
          if jq -e --arg sha "$sha" '.workflow_runs | any(.head_sha==$sha and .path==".github/workflows/rald7-full-acceptance.yml" and .head_branch=="rewrite/rust-core" and .repository.full_name=="humtr/codex" and (.event=="push" or .event=="workflow_dispatch") and .status=="completed" and .conclusion=="success")' "$RUNNER_TEMP/source-runs.json"; then
            echo 'accepted=true' >> "$GITHUB_OUTPUT"
          fi
      - name: Fetch accepted controller for discovery and failure reporting
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          main="$(gh api repos/humtr/codex/git/ref/heads/main --jq '.object.sha')"
          accepted="$(gh api "repos/humtr/codex/contents/release-source-v1?ref=$main" --jq '.content' | base64 -d)"
          [[ "$accepted" =~ ^[0-9a-f]{40}$ ]]
          for workflow in rald7-full-acceptance.yml core-runtime-qualification.yml; do
            gh api "repos/humtr/codex/actions/workflows/$workflow/runs?head_sha=$accepted&per_page=100" \
              --jq '.workflow_runs | any(.conclusion=="success" and .status=="completed" and .repository.full_name=="humtr/codex" and .head_branch=="rewrite/rust-core" and (.event=="push" or .event=="workflow_dispatch"))' | grep -Fqx true
          done
          git init accepted-controller
          git -C accepted-controller remote add origin https://github.com/humtr/codex.git
          git -C accepted-controller fetch --no-tags --depth=1 origin "$accepted"
          git -C accepted-controller checkout --detach FETCH_HEAD
          test "$(git -C accepted-controller rev-parse HEAD)" = "$accepted"

      - name: Admit documentation-only source for official discovery
        id: discoverable
        env:
          REQUESTED_UPSTREAM: ${{ inputs.requested_upstream }}
          SOURCE_ACCEPTED: ${{ steps.source.outputs.accepted }}
        run: |
          set -euo pipefail
          if test -n "$REQUESTED_UPSTREAM"; then
            [[ "$REQUESTED_UPSTREAM" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          fi
          if test "$SOURCE_ACCEPTED" = true; then
            echo 'accepted=true' >> "$GITHUB_OUTPUT"
          else
            # Execute only the accepted controller. A docs-only head may request
            # discovery, but a new product tuple still needs both exact gates.
            python3 - <<'PYTHON' >> "$GITHUB_OUTPUT"
          import pathlib, subprocess, sys
          sys.path.insert(0, str(pathlib.Path('accepted-controller/.github/scripts').resolve()))
          from release_control import same_product_inputs
          head = subprocess.check_output(['git','-C','source','rev-parse','HEAD'],text=True).strip()
          accepted = subprocess.check_output(['git','-C','accepted-controller','rev-parse','HEAD'],text=True).strip()
          if same_product_inputs(pathlib.Path('source').resolve(), accepted, head):
              print('accepted=true')
          PYTHON
          fi

      - name: Notify owner of completed failure
        if: inputs.completed_run != ''
        env:
          GH_TOKEN: ${{ github.token }}
          COMPLETED_RUN: ${{ inputs.completed_run }}
        run: |
          set -euo pipefail
          python3 accepted-controller/.github/scripts/release_attention.py --run-id "$COMPLETED_RUN"

      - name: Reconcile missed completion signals
        if: github.event_name == 'schedule' || inputs.discover_upstream
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 accepted-controller/.github/scripts/release_attention.py --reconcile

      - name: Discover official stable and submit independent base inputs
        id: discovery
        if: steps.discoverable.outputs.accepted == 'true' && (github.event_name == 'schedule' || inputs.discover_upstream)
        env:
          GH_TOKEN: ${{ github.token }}
          TMPDIR: ${{ runner.temp }}
        run: |
          set -euo pipefail
          python3 accepted-controller/.github/scripts/upstream_discovery.py --source "$GITHUB_WORKSPACE/source" > "$RUNNER_TEMP/discovery.json"
          cat "$RUNNER_TEMP/discovery.json"
          if jq -e '.state=="new-upstream-awaiting-real-proof"' "$RUNNER_TEMP/discovery.json"; then
            echo 'updated=true' >> "$GITHUB_OUTPUT"
          fi

      - name: Require real proofs and advance exact non-forced inputs
        if: steps.source.outputs.accepted == 'true' && steps.discovery.outputs.updated != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TMPDIR: ${{ runner.temp }}
        run: |
          set -euo pipefail
          python3 source/.github/scripts/release_control.py --source "$GITHUB_WORKSPACE/source" > "$RUNNER_TEMP/advance.json"
          cat "$RUNNER_TEMP/advance.json"
          if jq -e '.state=="qualification-failed"' "$RUNNER_TEMP/advance.json"; then
            echo 'Required exact-source qualification failed; request acceptance is not a built release.' >&2
            exit 1
          fi
          if jq -e '.state=="awaiting-accepted-caller-repin"' "$RUNNER_TEMP/advance.json"; then
            echo 'Accepted workflow implementation requires an owner-authorized exact main caller repin before publication.' >&2
            exit 1
          fi
