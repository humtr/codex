name: Termux Hosted Release Preflight

on:
  workflow_dispatch:
    inputs:
      rald4_positive_gate:
        description: 'Run the bounded RALD-4 acceptance-only signing gate'
        required: false
        type: boolean
        default: false
  schedule:
    - cron: '0 */6 * * *'

permissions:
  contents: read

concurrency:
  group: termux-hosted-release-producer
  cancel-in-progress: false

env:
  CODEX_SOURCE_SHA: '1cdcb44d035ec5b1ce6339f2aa7b0e95831a6f0a'
  RUST_VERSION: '1.98.0'
  ANDROID_API: '24'
  ANDROID_NDK_VERSION: '27.3.13750724'
  PUBLIC_INDEX_URL: 'https://raw.githubusercontent.com/humtr/codex/main/update-index-v1'
  UPSTREAM_LATEST_URL: 'https://releases.openai.com/codex/channels/latest'
  RALD4_ACCEPTANCE_BASELINE_VERSION: '0.153.4'
  RALD4_ACCEPTANCE_TARGET_VERSION: '0.154.0'
  WRAPPER_PUBLIC_KEY_SHA256: '62ab1640b6b4e63afbd5952d11a0bd0a9f1cb78ddde2472e003a42c4db2b832c'

jobs:
  producer:
    name: Build unsigned Android/AArch64 candidate
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    outputs:
      candidate: ${{ steps.decision.outputs.candidate }}
      artifact_name: ${{ steps.decision.outputs.artifact_name }}
      qualified_artifact_name: ${{ steps.decision.outputs.qualified_artifact_name }}
      signed_artifact_name: ${{ steps.decision.outputs.signed_artifact_name }}
      generation_id: ${{ steps.decision.outputs.generation_id }}
      upstream_version: ${{ steps.decision.outputs.upstream_version }}
      acceptance_gate: ${{ steps.decision.outputs.acceptance_gate }}
      release_sequence: ${{ steps.stable.outputs.release_sequence }}
    steps:
      - name: Fetch exact accepted source
        shell: bash
        run: |
          set -euo pipefail
          rm -rf source
          git init source
          git -C source remote add origin https://github.com/humtr/codex.git
          git -C source fetch --no-tags --depth=1 origin "$CODEX_SOURCE_SHA"
          git -C source checkout --detach FETCH_HEAD
          test "$(git -C source rev-parse HEAD)" = "$CODEX_SOURCE_SHA"
          test -z "$(git -C source status --porcelain)"

      - name: Verify source preflight helpers
        shell: bash
        run: |
          set -euo pipefail
          python3 source/.github/scripts/test_rald3_preflight.py
          python3 -m py_compile \
            source/.github/scripts/rald3_preflight.py \
            source/.github/scripts/test_rald3_preflight.py

      - name: Authenticate current public stable
        id: stable
        shell: bash
        run: |
          set -euo pipefail
          state="$RUNNER_TEMP/rald3-stable"
          rm -rf "$state"
          mkdir -p "$state"

          curl --fail --silent --show-error --location --proto '=https' --tlsv1.2 \
            --connect-timeout 15 --max-time 60 --max-filesize 16384 \
            --output "$state/update-index-v1" "$PUBLIC_INDEX_URL"
          curl --fail --silent --show-error --location --proto '=https' --tlsv1.2 \
            --connect-timeout 15 --max-time 60 --max-filesize 1024 \
            --output "$state/update-index-v1.sig" "${PUBLIC_INDEX_URL}.sig"
          test "$(wc -c < "$state/update-index-v1.sig")" -eq 64

          python3 source/.github/scripts/rald3_preflight.py \
            index "$state/update-index-v1" > "$state/index.untrusted"
          current_id="$(sed -n 's/^generation_id=//p' "$state/index.untrusted")"
          current_base="$(sed -n 's/^release_base=//p' "$state/index.untrusted")"
          test -n "$current_id"
          test "$current_base" = "https://humtr.github.io/codex/${current_id}/"

          curl --fail --silent --show-error --location --proto '=https' --tlsv1.2 \
            --connect-timeout 15 --max-time 60 --max-filesize 16384 \
            --output "$state/update-public-key.pem" \
            "https://github.com/humtr/codex/releases/download/${current_id}/update-public-key.pem"
          test "$(sha256sum "$state/update-public-key.pem" | awk '{print $1}')" = \
            "$WRAPPER_PUBLIC_KEY_SHA256"
          openssl pkeyutl -verify -pubin -inkey "$state/update-public-key.pem" -rawin \
            -in "$state/update-index-v1" -sigfile "$state/update-index-v1.sig"
          python3 source/.github/scripts/rald3_preflight.py \
            index "$state/update-index-v1" > "$state/index.authenticated"
          cmp "$state/index.untrusted" "$state/index.authenticated"

          curl --fail --silent --show-error --location --proto '=https' --tlsv1.2 \
            --connect-timeout 15 --max-time 60 --max-filesize 131072 \
            --output "$state/release.manifest" "${current_base}release.manifest"
          curl --fail --silent --show-error --location --proto '=https' --tlsv1.2 \
            --connect-timeout 15 --max-time 60 --max-filesize 1024 \
            --output "$state/release.sig" "${current_base}release.sig"
          curl --fail --silent --show-error --location --proto '=https' --tlsv1.2 \
            --connect-timeout 15 --max-time 60 --max-filesize 65536 \
            --output "$state/generation.meta" "${current_base}generation.meta"
          test "$(wc -c < "$state/release.sig")" -eq 64
          openssl pkeyutl -verify -pubin -inkey "$state/update-public-key.pem" -rawin \
            -in "$state/release.manifest" -sigfile "$state/release.sig"

          python3 source/.github/scripts/rald3_preflight.py manifest-entry \
            "$state/release.manifest" generation.meta > "$state/manifest-entry"
          test "$(sed -n 's/^generation_id=//p' "$state/manifest-entry")" = "$current_id"
          test "$(sed -n 's/^mode=//p' "$state/manifest-entry")" = '0644'
          test "$(sha256sum "$state/generation.meta" | awk '{print $1}')" = \
            "$(sed -n 's/^sha256=//p' "$state/manifest-entry")"
          python3 source/.github/scripts/rald3_preflight.py descriptor \
            "$state/generation.meta" > "$state/descriptor"
          test "$(sed -n 's/^generation_id=//p' "$state/descriptor")" = "$current_id"
          current_version="$(sed -n 's/^version=//p' "$state/descriptor")"
          current_sequence="$(sed -n 's/^release_sequence=//p' "$state/manifest-entry")"
          test -n "$current_version"
          test -n "$current_sequence"
          python3 source/.github/scripts/rald3_preflight.py next-sequence \
            "$current_sequence" > "$state/next-sequence"
          release_sequence="$(sed -n 's/^release_sequence=//p' "$state/next-sequence")"
          test -n "$release_sequence"
          printf 'current_version=%s\n' "$current_version" >> "$GITHUB_OUTPUT"
          printf 'release_sequence=%s\n' "$release_sequence" >> "$GITHUB_OUTPUT"

      - name: Resolve official upstream stable
        id: decision
        shell: bash
        env:
          RALD4_POSITIVE_GATE: ${{ github.event_name == 'workflow_dispatch' && inputs.rald4_positive_gate }}
        run: |
          set -euo pipefail
          state="$RUNNER_TEMP/rald3-upstream"
          rm -rf "$state"
          mkdir -p "$state"
          curl --fail --silent --show-error --location --proto '=https' --tlsv1.2 \
            --connect-timeout 15 --max-time 60 --max-filesize 131072 \
            --output "$state/latest.json" "$UPSTREAM_LATEST_URL"
          python3 source/.github/scripts/rald3_preflight.py upstream \
            "$state/latest.json" > "$state/upstream"
          upstream_version="$(sed -n 's/^version=//p' "$state/upstream")"
          archive_sha256="$(sed -n 's/^archive_sha256=//p' "$state/upstream")"

          comparison_version='${{ steps.stable.outputs.current_version }}'
          acceptance_suffix=''
          if test "$RALD4_POSITIVE_GATE" = true; then
            test "$GITHUB_EVENT_NAME" = workflow_dispatch
            test "$GITHUB_REF" = refs/heads/rewrite/rust-core
            test '${{ steps.stable.outputs.current_version }}' = "$RALD4_ACCEPTANCE_TARGET_VERSION"
            test "$upstream_version" = "$RALD4_ACCEPTANCE_TARGET_VERSION"
            comparison_version="$RALD4_ACCEPTANCE_BASELINE_VERSION"
            acceptance_suffix='-acceptance'
            printf 'RALD-4 acceptance-only comparison baseline %s; authenticated public stable remains %s\n' \
              "$comparison_version" '${{ steps.stable.outputs.current_version }}'
          fi

          python3 source/.github/scripts/rald3_preflight.py compare \
            "$comparison_version" "$upstream_version" > "$state/decision"
          candidate="$(sed -n 's/^candidate=//p' "$state/decision")"
          test "$candidate" = true -o "$candidate" = false
          if test "$RALD4_POSITIVE_GATE" = true; then
            test "$candidate" = true
          fi
          suffix="${upstream_version//./-}-${CODEX_SOURCE_SHA:0:12}${acceptance_suffix}"
          printf 'candidate=%s\n' "$candidate" >> "$GITHUB_OUTPUT"
          printf 'acceptance_gate=%s\n' "$RALD4_POSITIVE_GATE" >> "$GITHUB_OUTPUT"
          printf 'artifact_name=rald3-candidate-%s\n' "$suffix" >> "$GITHUB_OUTPUT"
          printf 'qualified_artifact_name=rald4-qualified-%s\n' "$suffix" >> "$GITHUB_OUTPUT"
          printf 'signed_artifact_name=rald4-signed-%s\n' "$suffix" >> "$GITHUB_OUTPUT"
          printf 'generation_id=local-hosted-%s\n' "$suffix" >> "$GITHUB_OUTPUT"
          printf 'upstream_version=%s\n' "$upstream_version" >> "$GITHUB_OUTPUT"
          printf 'archive_sha256=%s\n' "$archive_sha256" >> "$GITHUB_OUTPUT"

      - name: Cross-build Core and Manager
        if: steps.decision.outputs.candidate == 'true'
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install "$RUST_VERSION" --profile minimal --target aarch64-linux-android
          ndk="$ANDROID_SDK_ROOT/ndk/$ANDROID_NDK_VERSION"
          toolchain="$ndk/toolchains/llvm/prebuilt/linux-x86_64/bin"
          linker="$toolchain/aarch64-linux-android${ANDROID_API}-clang"
          test -x "$linker"
          test -x "$toolchain/llvm-ar"
          cd source
          export CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER="$linker"
          export CC_aarch64_linux_android="$linker"
          export AR_aarch64_linux_android="$toolchain/llvm-ar"
          cargo "+$RUST_VERSION" build --release --locked --target aarch64-linux-android \
            -p codex -p codex-manager
          cargo "+$RUST_VERSION" build --release --locked -p codex-release-builder

      - name: Fetch, adapt, and qualify unsigned candidate
        if: steps.decision.outputs.candidate == 'true'
        shell: bash
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/rald3-candidate"
          rm -rf "$work"
          mkdir -p "$work"
          builder="$GITHUB_WORKSPACE/source/target/release/codex-release-builder"
          core="$GITHUB_WORKSPACE/source/target/aarch64-linux-android/release/codex"
          manager="$GITHUB_WORKSPACE/source/target/aarch64-linux-android/release/codex-manager"
          upstream_version='${{ steps.decision.outputs.upstream_version }}'
          archive_sha256='${{ steps.decision.outputs.archive_sha256 }}'
          generation_id='${{ steps.decision.outputs.generation_id }}'
          fetch_output="$($builder fetch \
            --version "$upstream_version" \
            --curl /usr/bin/curl \
            --openssl /usr/bin/openssl \
            --output "$work/upstream.tar.gz")"
          fetched_sha256="$(printf '%s\n' "$fetch_output" | awk -F '\t' '$1=="archive_sha256"{print $2}')"
          test "$fetched_sha256" = "$archive_sha256"

          "$builder" build \
            --version "$upstream_version" \
            --archive "$work/upstream.tar.gz" \
            --archive-sha256 "$archive_sha256" \
            --generation-id "$generation_id" \
            --core "$core" \
            --manager "$manager" \
            --defer-manager-probe \
            --creation-metadata r10-browser-helper-bridge-v1 \
            --gzip /usr/bin/gzip \
            --openssl /usr/bin/openssl \
            --output "$work/candidate"

          python3 source/.github/scripts/rald3_preflight.py candidate \
            "$work/candidate" "$upstream_version"
          find "$work/candidate" -type f -printf '%P\n' | LC_ALL=C sort > "$work/actual-files"
          cat > "$work/expected-files" <<'EOF'
          .manager-probe-deferred
          codex-code-mode-host
          core
          generation.meta
          helpers/0
          helpers/1
          manager
          runtime
          EOF
          diff -u "$work/expected-files" "$work/actual-files"
          for executable in codex-code-mode-host core helpers/0 helpers/1 manager runtime; do
            test -f "$work/candidate/$executable"
            test ! -L "$work/candidate/$executable"
            test "$(stat -c '%a' "$work/candidate/$executable")" = '755'
          done
          tar --sort=name --mtime='@0' --owner=0 --group=0 --numeric-owner \
            -cf "$work/candidate.tar" -C "$work" candidate
          test "$(stat -c '%s' "$work/candidate.tar")" -lt 1073741824

      - name: Upload unsigned candidate only
        if: steps.decision.outputs.candidate == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ${{ steps.decision.outputs.artifact_name }}
          path: ${{ runner.temp }}/rald3-candidate/candidate.tar
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

      - name: Record exact-current dry-run
        if: steps.decision.outputs.candidate == 'false'
        shell: bash
        run: |
          set -euo pipefail
          printf 'authenticated wrapper stable already matches official upstream %s\n' \
            '${{ steps.decision.outputs.upstream_version }}'

  smoke:
    name: Android/AArch64 executable smoke
    needs: producer
    if: needs.producer.outputs.candidate == 'true'
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - name: Fetch exact accepted source
        shell: bash
        run: |
          set -euo pipefail
          rm -rf source
          git init source
          git -C source remote add origin https://github.com/humtr/codex.git
          git -C source fetch --no-tags --depth=1 origin "$CODEX_SOURCE_SHA"
          git -C source checkout --detach FETCH_HEAD
          test "$(git -C source rev-parse HEAD)" = "$CODEX_SOURCE_SHA"

      - name: Download unsigned candidate
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: ${{ needs.producer.outputs.artifact_name }}
          path: ${{ runner.temp }}/rald3-download

      - name: Reverify candidate before execution
        shell: bash
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/rald3-smoke"
          rm -rf "$work"
          mkdir -p "$work"
          tar -xf "$RUNNER_TEMP/rald3-download/candidate.tar" -C "$work"
          python3 source/.github/scripts/rald3_preflight.py candidate \
            "$work/candidate" '${{ needs.producer.outputs.upstream_version }}'

      - name: Boot ARM64 Android runner
        shell: bash
        run: |
          set -euo pipefail
          image='system-images;android-35;google_apis;arm64-v8a'
          sdkmanager="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          avdmanager="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/avdmanager"
          adb="$ANDROID_SDK_ROOT/platform-tools/adb"
          emulator="$ANDROID_SDK_ROOT/emulator/emulator"
          for tool in "$sdkmanager" "$avdmanager" "$adb" "$emulator"; do
            test -x "$tool"
          done
          yes | "$sdkmanager" --licenses >/dev/null 2>&1 || true
          "$sdkmanager" "$image"
          echo no | "$avdmanager" create avd --force --name rald3 --package "$image"
          "$emulator" \
            -avd rald3 -no-window -no-audio -no-boot-anim -no-snapshot -wipe-data \
            > "$RUNNER_TEMP/rald3-emulator.log" 2>&1 &
          emulator_pid=$!
          cleanup_emulator() {
            kill "$emulator_pid" 2>/dev/null || true
            "$adb" kill-server >/dev/null 2>&1 || true
          }
          trap cleanup_emulator EXIT
          booted=0
          for _ in $(seq 1 120); do
            if ! kill -0 "$emulator_pid" 2>/dev/null; then
              cat "$RUNNER_TEMP/rald3-emulator.log" >&2
              exit 1
            fi
            if test "$("$adb" get-state 2>/dev/null || true)" = device && \
               test "$("$adb" shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" = 1; then
              booted=1
              break
            fi
            sleep 5
          done
          if test "$booted" != 1; then
            cat "$RUNNER_TEMP/rald3-emulator.log" >&2
            exit 1
          fi
          test "$("$adb" shell getprop ro.product.cpu.abi | tr -d '\r')" = arm64-v8a

      - name: Run exact Manager, Core, and runtime smoke
        shell: bash
        run: |
          set -euo pipefail
          candidate="$RUNNER_TEMP/rald3-smoke/candidate"
          remote=/data/local/tmp/rald3
          adb="$ANDROID_SDK_ROOT/platform-tools/adb"
          test -x "$adb"
          "$adb" shell "rm -rf $remote && mkdir -p $remote"
          "$adb" push "$candidate/manager" "$remote/manager" >/dev/null
          "$adb" push "$candidate/core" "$remote/core" >/dev/null
          "$adb" push "$candidate/runtime" "$remote/runtime" >/dev/null
          "$adb" shell "chmod 0755 $remote/manager $remote/core $remote/runtime"

          "$adb" shell "CODEX_MANAGER_ARTIFACT_PROBE=1 $remote/manager --artifact-probe > $remote/manager.out 2> $remote/manager.err"
          "$adb" exec-out cat "$remote/manager.out" > "$RUNNER_TEMP/manager.out"
          "$adb" exec-out cat "$remote/manager.err" > "$RUNNER_TEMP/manager.err"
          printf 'codex-manager-artifact-v1\ncore_api=codex-manager-core-v1\n' > "$RUNNER_TEMP/manager.expected"
          cmp "$RUNNER_TEMP/manager.expected" "$RUNNER_TEMP/manager.out"
          test ! -s "$RUNNER_TEMP/manager.err"

          "$adb" shell "$remote/core update --help > $remote/core.out 2> $remote/core.err"
          "$adb" exec-out cat "$remote/core.out" > "$RUNNER_TEMP/core.out"
          "$adb" exec-out cat "$remote/core.err" > "$RUNNER_TEMP/core.err"
          grep -Fqx 'usage: codex update [--help] | --force | --build-local | --local <DIRECTORY> | --remote <HTTPS_BASE_URL> | --rollback' \
            "$RUNNER_TEMP/core.out"
          test ! -s "$RUNNER_TEMP/core.err"

          "$adb" shell "$remote/runtime --version > $remote/runtime.out 2> $remote/runtime.err"
          "$adb" exec-out cat "$remote/runtime.out" > "$RUNNER_TEMP/runtime.out"
          "$adb" exec-out cat "$remote/runtime.err" > "$RUNNER_TEMP/runtime.err"
          test -s "$RUNNER_TEMP/runtime.out"
          test "$(wc -c < "$RUNNER_TEMP/runtime.out")" -le 512
          test ! -s "$RUNNER_TEMP/runtime.err"

          rm "$candidate/.manager-probe-deferred"
          test ! -e "$candidate/.manager-probe-deferred"
          printf 'unsigned candidate passed Android/AArch64 pre-sign smoke\n'


      - name: Package qualified unsigned candidate
        shell: bash
        run: |
          set -euo pipefail
          candidate="$RUNNER_TEMP/rald3-smoke/candidate"
          python3 source/.github/scripts/rald3_preflight.py qualified-candidate \
            "$candidate" '${{ needs.producer.outputs.upstream_version }}'
          tar -cf "$RUNNER_TEMP/rald4-qualified.tar" \
            -C "$RUNNER_TEMP/rald3-smoke" candidate
          test "$(stat -f '%z' "$RUNNER_TEMP/rald4-qualified.tar")" -lt 1073741824

      - name: Upload qualified unsigned candidate
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ${{ needs.producer.outputs.qualified_artifact_name }}
          path: ${{ runner.temp }}/rald4-qualified.tar
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  sign:
    name: Sign qualified candidate
    needs: [producer, smoke]
    if: needs.producer.outputs.candidate == 'true' && needs.smoke.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Fetch exact accepted signing source
        shell: bash
        run: |
          set -euo pipefail
          rm -rf source
          git init source
          git -C source remote add origin https://github.com/humtr/codex.git
          git -C source fetch --no-tags --depth=1 origin "$CODEX_SOURCE_SHA"
          git -C source checkout --detach FETCH_HEAD
          test "$(git -C source rev-parse HEAD)" = "$CODEX_SOURCE_SHA"
          test -z "$(git -C source status --porcelain)"

      - name: Download qualified unsigned candidate
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: ${{ needs.producer.outputs.qualified_artifact_name }}
          path: ${{ runner.temp }}/rald4-qualified-download

      - name: Reverify qualified candidate and accepted authority
        shell: bash
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/rald4-sign"
          rm -rf "$work"
          mkdir -p "$work"
          tar -xf "$RUNNER_TEMP/rald4-qualified-download/rald4-qualified.tar" -C "$work"
          python3 source/.github/scripts/rald3_preflight.py qualified-candidate \
            "$work/candidate" '${{ needs.producer.outputs.upstream_version }}'
          test "$(sed -n 's/^generation_id\t//p' "$work/candidate/generation.meta")" = \
            '${{ needs.producer.outputs.generation_id }}'

          authority="$work/update-public-key.pem"
          curl --fail --silent --show-error --location --proto '=https' --tlsv1.2 \
            --connect-timeout 15 --max-time 60 --max-filesize 16384 \
            --output "$authority" \
            'https://github.com/humtr/codex/releases/download/local-20260914-update-channel-bridge-1/update-public-key.pem'
          test "$(sha256sum "$authority" | awk '{print $1}')" = \
            "$WRAPPER_PUBLIC_KEY_SHA256"
          openssl pkey -pubin -in "$authority" -pubout -outform DER \
            > "$work/accepted-public.der"
          test "$(wc -c < "$work/accepted-public.der")" -eq 44

      - name: Build exact release signer
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install "$RUST_VERSION" --profile minimal
          cargo "+$RUST_VERSION" build --release --locked \
            --manifest-path source/Cargo.toml -p codex-release-builder
          test -x source/target/release/codex-release-builder
          python3 source/.github/scripts/test_rald4_signing.py
          python3 -m py_compile \
            source/.github/scripts/rald4_signing.py \
            source/.github/scripts/test_rald4_signing.py

      - name: Sign qualified candidate with accepted authority only
        shell: bash
        env:
          CODEX_RELEASE_SIGNING_KEY: ${{ secrets.CODEX_RELEASE_SIGNING_KEY }}
        run: |
          set -euo pipefail
          release_base='https://humtr.github.io/codex/${{ needs.producer.outputs.generation_id }}/'
          if test '${{ needs.producer.outputs.acceptance_gate }}' = true; then
            release_base='https://rald4-acceptance.invalid/${{ needs.producer.outputs.generation_id }}/'
          fi
          python3 source/.github/scripts/rald4_signing.py \
            --candidate "$RUNNER_TEMP/rald4-sign/candidate" \
            --accepted-public-key "$RUNNER_TEMP/rald4-sign/update-public-key.pem" \
            --release-sequence '${{ needs.producer.outputs.release_sequence }}' \
            --release-base "$release_base" \
            --builder "$GITHUB_WORKSPACE/source/target/release/codex-release-builder" \
            --openssl /usr/bin/openssl \
            --runner-temp "$RUNNER_TEMP" \
            --output "$RUNNER_TEMP/rald4-sign/signed-output"

      - name: Independently verify signed candidate
        shell: bash
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/rald4-sign"
          signed="$work/signed-output"
          generation='${{ needs.producer.outputs.generation_id }}'
          authority="$work/update-public-key.pem"
          manifest="$signed/releases/$generation/release.manifest"
          release_sig="$signed/releases/$generation/release.sig"
          index="$signed/update-index-v1"
          index_sig="$signed/update-index-v1.sig"
          test -f "$manifest" -a ! -L "$manifest"
          test -f "$release_sig" -a ! -L "$release_sig"
          test -f "$index" -a ! -L "$index"
          test -f "$index_sig" -a ! -L "$index_sig"
          test "$(wc -c < "$release_sig")" -eq 64
          test "$(wc -c < "$index_sig")" -eq 64
          openssl pkeyutl -verify -pubin -inkey "$authority" -rawin \
            -in "$manifest" -sigfile "$release_sig"
          openssl pkeyutl -verify -pubin -inkey "$authority" -rawin \
            -in "$index" -sigfile "$index_sig"
          test "$(sed -n 's/^release_sequence\t//p' "$manifest")" = \
            '${{ needs.producer.outputs.release_sequence }}'
          test "$(sed -n 's/^generation_id\t//p' "$manifest")" = "$generation"
          test "$(sed -n 's/^generation_id\t//p' "$index")" = "$generation"
          actual_release_base="$(sed -n 's/^release_base\t//p' "$index")"
          if test '${{ needs.producer.outputs.acceptance_gate }}' = true; then
            test "$actual_release_base" = "https://rald4-acceptance.invalid/$generation/"
          else
            test "$actual_release_base" = "https://humtr.github.io/codex/$generation/"
          fi
          test -z "$(find "$RUNNER_TEMP" -maxdepth 1 -name '.rald4-signing-*' -print -quit)"

          tar --sort=name --mtime='@0' --owner=0 --group=0 --numeric-owner \
            -cf "$work/signed-candidate.tar" -C "$work" signed-output
          test "$(stat -c '%s' "$work/signed-candidate.tar")" -lt 1073741824

      - name: Remove acceptance-only signed output
        if: needs.producer.outputs.acceptance_gate == 'true'
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$RUNNER_TEMP/rald4-sign/signed-output" \
            "$RUNNER_TEMP/rald4-sign/signed-candidate.tar"
          test ! -e "$RUNNER_TEMP/rald4-sign/signed-output"
          test ! -e "$RUNNER_TEMP/rald4-sign/signed-candidate.tar"

      - name: Upload signed candidate only
        if: needs.producer.outputs.acceptance_gate != 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ${{ needs.producer.outputs.signed_artifact_name }}
          path: ${{ runner.temp }}/rald4-sign/signed-candidate.tar
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
