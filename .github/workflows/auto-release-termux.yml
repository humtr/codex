name: Termux Hosted Release Preflight
run-name: ${{ inputs.upstream_version && format('Codex publication {0}', inputs.upstream_version) || 'Termux Hosted Release Preflight' }}
on:
  workflow_dispatch:
    inputs:
      upstream_version:
        description: Publication status label; accepted source remains authoritative
        type: string
        default: ''
      publish:
        description: Publish after all real execution/readback gates
        type: boolean
        default: false
      rebuild_current:
        description: Rebuild the authenticated selected backend at the next sequence
        type: boolean
        default: false
      variant:
        description: Independent publication lane (both runs base then full)
        type: choice
        options: [both, base, full]
        default: both
permissions:
  contents: read
  actions: read
jobs:
  source:
    runs-on: ubuntu-24.04
    outputs:
      sha: ${{ steps.source.outputs.sha }}
      frontend_binding: ${{ steps.source.outputs.frontend_binding }}
    steps:
      - name: Resolve exact accepted product source
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          sha="$(gh api repos/humtr/codex/contents/release-source-v1?ref=${{ github.sha }} --jq '.content' | base64 -d)"
          [[ "$sha" =~ ^[0-9a-f]{40}$ ]]
          for workflow in source-acceptance.yml core-runtime-qualification.yml; do
            gh api "repos/humtr/codex/actions/workflows/$workflow/runs?head_sha=$sha&per_page=100" > "$RUNNER_TEMP/runs.json"
            jq -e --arg sha "$sha" --arg path ".github/workflows/$workflow"               '.workflow_runs | any(.head_sha==$sha and .path==$path and .head_branch=="rewrite/rust-core" and (.event=="push" or .event=="workflow_dispatch") and .repository.full_name=="humtr/codex" and .status=="completed" and .conclusion=="success")' "$RUNNER_TEMP/runs.json"
          done
          printf 'sha=%s\n' "$sha" >> "$GITHUB_OUTPUT"
          gh api "repos/humtr/codex/contents/release-frontend-v1?ref=${{ github.sha }}" --jq '.content' | base64 -d > "$RUNNER_TEMP/frontend.json"
          SOURCE_SHA="$sha" python3 - <<'PYTHON' >> "$GITHUB_OUTPUT"
          import json, os
          with open(os.environ['RUNNER_TEMP']+'/frontend.json') as stream:
              binding=json.load(stream)
          if set(binding) != {'source','frontend'} or binding['source'] != os.environ['SOURCE_SHA']:
              raise ValueError('composition result differs from accepted product source')
          print('frontend_binding='+json.dumps(binding,separators=(',',':')))
          PYTHON
  base:
    needs: source
    if: ${{ !cancelled() && (github.event_name == 'schedule' || inputs.variant != 'full') && needs.source.result == 'success' }}
    permissions:
      contents: write
      actions: read
    uses: humtr/codex/.github/workflows/auto-release-termux.yml@df8a8c91bc013305b6b4f8bd0fb88ef4573d7421
    with:
      source_sha: ${{ needs.source.outputs.sha }}
      frontend_binding: ""
      release_variant: base
      publish: ${{ github.event_name == 'schedule' || inputs.publish }}
      rebuild_current: ${{ github.event_name == 'workflow_dispatch' && inputs.rebuild_current }}
    secrets:
      CODEX_RELEASE_SIGNING_KEY: ${{ secrets.CODEX_RELEASE_SIGNING_KEY }}
  release:
    needs: [source, base]
    if: ${{ !cancelled() && (github.event_name == 'schedule' || inputs.variant != 'base') && needs.source.result == 'success' }}
    permissions:
      contents: write
      actions: read
    uses: humtr/codex/.github/workflows/auto-release-termux.yml@df8a8c91bc013305b6b4f8bd0fb88ef4573d7421
    with:
      source_sha: ${{ needs.source.outputs.sha }}
      frontend_binding: "${{ needs.source.outputs.frontend_binding }}"
      release_variant: full
      publish: ${{ github.event_name == 'schedule' || inputs.publish }}
      rebuild_current: ${{ github.event_name == 'workflow_dispatch' && inputs.rebuild_current }}
    secrets:
      CODEX_RELEASE_SIGNING_KEY: ${{ secrets.CODEX_RELEASE_SIGNING_KEY }}
  notify_acceptance:
    needs: [source, base, release]
    if: always()
    permissions:
      contents: read
      actions: write
    runs-on: ubuntu-24.04
    steps:
      - name: Continue after publication reaches a terminal state
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh workflow run accepted-release-inputs.yml --repo humtr/codex --ref main -f completed_run="$GITHUB_RUN_ID"
