name: Termux Hosted Release Preflight
on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the qualified candidate after smoke; defaults to unsigned build only
        type: boolean
        default: false
      rebuild_current:
        description: Manually rebuild the authenticated qualified current backend at next sequence
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  release:
    permissions:
      contents: write
      actions: read
      pages: write
      id-token: write
    uses: humtr/codex/.github/workflows/auto-release-termux.yml@17e1b52b0d77484818049b9ff7111e74621c0690
    with:
      source_sha: 17e1b52b0d77484818049b9ff7111e74621c0690
      publish: ${{ github.event_name == 'schedule' || inputs.publish }}
      rebuild_current: ${{ github.event_name == 'workflow_dispatch' && inputs.rebuild_current }}
    secrets:
      CODEX_RELEASE_SIGNING_KEY: ${{ secrets.CODEX_RELEASE_SIGNING_KEY }}
