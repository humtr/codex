name: Termux Hosted Release Preflight

on:
  workflow_dispatch:
    inputs:
      rald4_positive_gate:
        description: 'Run the bounded RALD-4 acceptance-only signing gate'
        required: false
        type: boolean
        default: false
      rald5_publication_authorized:
        description: 'Explicitly authorize RALD-5 public Release/Pages/promotion mutation for this run'
        required: false
        type: boolean
        default: false
      rald5_same_version_acceptance:
        description: 'Bounded RALD-5 acceptance: republish exact official 0.154.0 through the full public path'
        required: false
        type: boolean
        default: false
      rald45_transition_stage:
        description: 'Stage/prove the backward-compatible RALD-4.5 transition generation without stable promotion'
        required: false
        type: boolean
        default: false
      rald5_negative_gate:
        description: 'For an authorized publication candidate, fail public readback before promotion'
        required: false
        type: boolean
        default: false
  schedule:
    - cron: '0 */6 * * *'

permissions:
  contents: read

concurrency:
  group: termux-hosted-release-producer
  cancel-in-progress: false

env:
  CODEX_SOURCE_SHA: '37fbbd8033b8cc2d508689ab1d6637b4c4f5d516'
  RALD5_SOURCE_SHA: 'fa1b887b7e726202e309a2eb731aad303a6c7e03'
  RUST_VERSION: '1.98.0'
  ANDROID_API: '24'
  ANDROID_NDK_VERSION: '27.3.13750724'
  PUBLIC_INDEX_URL: 'https://raw.githubusercontent.com/humtr/codex/main/update-index-v1'
  UPSTREAM_LATEST_URL: 'https://releases.openai.com/codex/channels/latest'
  RALD4_ACCEPTANCE_BASELINE_VERSION: '0.153.4'
  RALD4_ACCEPTANCE_TARGET_VERSION: '0.154.0'
  RALD5_SAME_VERSION_ACCEPTANCE_VERSION: '0.154.0'
  WRAPPER_PUBLIC_KEY_SHA256: '62ab1640b6b4e63afbd5952d11a0bd0a9f1cb78ddde2472e003a42c4db2b832c'
  ANDROID_RUNTIME_APEX_COMMIT: '8aeb37cca394ce39c1311744c60960cbd466aa77'
  ANDROID_RUNTIME_APEX_SHA256: '83bf0dce249728dae48149b80d28b48115c54adad95a352120d58a6ac669d1fc'

jobs:
  producer:
    name: Build unsigned Android/AArch64 candidate
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    outputs:
      candidate: ${{ steps.decision.outputs.candidate }}
      artifact_name: ${{ steps.decision.outputs.artifact_name }}
      qualified_artifact_name: ${{ steps.decision.outputs.qualified_artifact_name }}
      signed_artifact_name: ${{ steps.decision.outputs.signed_artifact_name }}
      generation_id: ${{ steps.decision.outputs.generation_id }}
      upstream_version: ${{ steps.decision.outputs.upstream_version }}
      acceptance_gate: ${{ steps.decision.outputs.acceptance_gate }}
      publication_authorized: ${{ steps.decision.outputs.publication_authorized }}
      same_version_acceptance: ${{ steps.decision.outputs.same_version_acceptance }}
      transition_stage: ${{ steps.decision.outputs.transition_stage }}
      negative_gate: ${{ steps.decision.outputs.negative_gate }}
      expected_main_sha: ${{ steps.stable.outputs.expected_main_sha }}
      current_generation: ${{ steps.stable.outputs.current_generation }}
      current_release_sequence: ${{ steps.stable.outputs.current_release_sequence }}
      release_sequence: ${{ steps.stable.outputs.release_sequence }}
    steps:
      - name: Fetch exact accepted source
        shell: bash
        run: |
          set -euo pipefail
          rm -rf source
          git init source
          git -C source remote add origin https://github.com/humtr/codex.git
          git -C source fetch --no-tags --depth=1 origin "$CODEX_SOURCE_SHA"
          git -C source checkout --detach FETCH_HEAD
          test "$(git -C source rev-parse HEAD)" = "$CODEX_SOURCE_SHA"
          test -z "$(git -C source status --porcelain)"

      - name: Verify source preflight helpers
        shell: bash
        run: |
          set -euo pipefail
          python3 source/.github/scripts/test_rald3_preflight.py
          python3 -m py_compile \
            source/.github/scripts/rald3_preflight.py \
            source/.github/scripts/test_rald3_preflight.py

      - name: Authenticate current public stable
        id: stable
        shell: bash
        run: |
          set -euo pipefail
          state="$RUNNER_TEMP/rald3-stable"
          rm -rf "$state"
          mkdir -p "$state"

          expected_main_sha="$(git ls-remote --exit-code https://github.com/humtr/codex.git refs/heads/main | awk '{print $1}')"
          test "${#expected_main_sha}" -eq 40
          case "$expected_main_sha" in (*[!0-9a-f]*) exit 1;; esac
          pinned_index_url="https://raw.githubusercontent.com/humtr/codex/${expected_main_sha}/update-index-v1"
          curl --fail --silent --show-error --location --proto '=https' --tlsv1.2 \
            --connect-timeout 15 --max-time 60 --max-filesize 16384 \
            --output "$state/update-index-v1" "$pinned_index_url"
          curl --fail --silent --show-error --location --proto '=https' --tlsv1.2 \
            --connect-timeout 15 --max-time 60 --max-filesize 1024 \
            --output "$state/update-index-v1.sig" "${pinned_index_url}.sig"
          test "$(wc -c < "$state/update-index-v1.sig")" -eq 64

          python3 source/.github/scripts/rald3_preflight.py \
            index "$state/update-index-v1" > "$state/index.untrusted"
          current_id="$(sed -n 's/^generation_id=//p' "$state/index.untrusted")"
          current_base="$(sed -n 's/^release_base=//p' "$state/index.untrusted")"
          test -n "$current_id"
          test "$current_base" = "https://humtr.github.io/codex/${current_id}/"

          curl --fail --silent --show-error --location --proto '=https' --tlsv1.2 \
            --connect-timeout 15 --max-time 60 --max-filesize 16384 \
            --output "$state/update-public-key.pem" \
            "https://github.com/humtr/codex/releases/download/${current_id}/update-public-key.pem"
          test "$(sha256sum "$state/update-public-key.pem" | awk '{print $1}')" = \
            "$WRAPPER_PUBLIC_KEY_SHA256"
          openssl pkeyutl -verify -pubin -inkey "$state/update-public-key.pem" -rawin \
            -in "$state/update-index-v1" -sigfile "$state/update-index-v1.sig"
          python3 source/.github/scripts/rald3_preflight.py \
            index "$state/update-index-v1" > "$state/index.authenticated"
          cmp "$state/index.untrusted" "$state/index.authenticated"

          curl --fail --silent --show-error --location --proto '=https' --tlsv1.2 \
            --connect-timeout 15 --max-time 60 --max-filesize 131072 \
            --output "$state/release.manifest" "${current_base}release.manifest"
          curl --fail --silent --show-error --location --proto '=https' --tlsv1.2 \
            --connect-timeout 15 --max-time 60 --max-filesize 1024 \
            --output "$state/release.sig" "${current_base}release.sig"
          curl --fail --silent --show-error --location --proto '=https' --tlsv1.2 \
            --connect-timeout 15 --max-time 60 --max-filesize 65536 \
            --output "$state/generation.meta" "${current_base}generation.meta"
          test "$(wc -c < "$state/release.sig")" -eq 64
          openssl pkeyutl -verify -pubin -inkey "$state/update-public-key.pem" -rawin \
            -in "$state/release.manifest" -sigfile "$state/release.sig"

          python3 source/.github/scripts/rald3_preflight.py manifest-entry \
            "$state/release.manifest" generation.meta > "$state/manifest-entry"
          test "$(sed -n 's/^generation_id=//p' "$state/manifest-entry")" = "$current_id"
          test "$(sed -n 's/^mode=//p' "$state/manifest-entry")" = '0644'
          test "$(sha256sum "$state/generation.meta" | awk '{print $1}')" = \
            "$(sed -n 's/^sha256=//p' "$state/manifest-entry")"
          python3 source/.github/scripts/rald3_preflight.py descriptor \
            "$state/generation.meta" > "$state/descriptor"
          test "$(sed -n 's/^generation_id=//p' "$state/descriptor")" = "$current_id"
          current_version="$(sed -n 's/^version=//p' "$state/descriptor")"
          current_sequence="$(sed -n 's/^release_sequence=//p' "$state/manifest-entry")"
          test -n "$current_version"
          test -n "$current_sequence"
          python3 source/.github/scripts/rald3_preflight.py next-sequence \
            "$current_sequence" > "$state/next-sequence"
          release_sequence="$(sed -n 's/^release_sequence=//p' "$state/next-sequence")"
          test -n "$release_sequence"
          printf 'current_version=%s\n' "$current_version" >> "$GITHUB_OUTPUT"
          printf 'expected_main_sha=%s\n' "$expected_main_sha" >> "$GITHUB_OUTPUT"
          printf 'current_generation=%s\n' "$current_id" >> "$GITHUB_OUTPUT"
          printf 'current_release_sequence=%s\n' "$current_sequence" >> "$GITHUB_OUTPUT"
          printf 'release_sequence=%s\n' "$release_sequence" >> "$GITHUB_OUTPUT"

      - name: Resolve official upstream stable
        id: decision
        shell: bash
        env:
          RALD4_POSITIVE_GATE: ${{ github.event_name == 'workflow_dispatch' && inputs.rald4_positive_gate }}
          RALD5_PUBLICATION_AUTHORIZED: ${{ github.event_name == 'workflow_dispatch' && inputs.rald5_publication_authorized }}
          RALD5_SAME_VERSION_ACCEPTANCE: ${{ github.event_name == 'workflow_dispatch' && inputs.rald5_same_version_acceptance }}
          RALD45_TRANSITION_STAGE: ${{ github.event_name == 'workflow_dispatch' && inputs.rald45_transition_stage }}
          RALD5_NEGATIVE_GATE: ${{ github.event_name == 'workflow_dispatch' && inputs.rald5_negative_gate }}
        run: |
          set -euo pipefail
          state="$RUNNER_TEMP/rald3-upstream"
          rm -rf "$state"
          mkdir -p "$state"
          curl --fail --silent --show-error --location --proto '=https' --tlsv1.2 \
            --connect-timeout 15 --max-time 60 --max-filesize 131072 \
            --output "$state/latest.json" "$UPSTREAM_LATEST_URL"
          python3 source/.github/scripts/rald3_preflight.py upstream \
            "$state/latest.json" > "$state/upstream"
          upstream_version="$(sed -n 's/^version=//p' "$state/upstream")"
          archive_sha256="$(sed -n 's/^archive_sha256=//p' "$state/upstream")"

          comparison_version='${{ steps.stable.outputs.current_version }}'
          acceptance_suffix=''
          if test "$RALD4_POSITIVE_GATE" = true; then
            test "$GITHUB_EVENT_NAME" = workflow_dispatch
            test "$GITHUB_REF" = refs/heads/rewrite/rust-core
            test '${{ steps.stable.outputs.current_version }}' = "$RALD4_ACCEPTANCE_TARGET_VERSION"
            test "$upstream_version" = "$RALD4_ACCEPTANCE_TARGET_VERSION"
            comparison_version="$RALD4_ACCEPTANCE_BASELINE_VERSION"
            acceptance_suffix='-acceptance'
            printf 'RALD-4 acceptance-only comparison baseline %s; authenticated public stable remains %s\n' \
              "$comparison_version" '${{ steps.stable.outputs.current_version }}'
          fi

          python3 source/.github/scripts/rald3_preflight.py compare \
            "$comparison_version" "$upstream_version" > "$state/decision"
          candidate="$(sed -n 's/^candidate=//p' "$state/decision")"
          test "$candidate" = true -o "$candidate" = false
          test "$RALD5_PUBLICATION_AUTHORIZED" = true -o "$RALD5_PUBLICATION_AUTHORIZED" = false
          test "$RALD5_SAME_VERSION_ACCEPTANCE" = true -o "$RALD5_SAME_VERSION_ACCEPTANCE" = false
          test "$RALD45_TRANSITION_STAGE" = true -o "$RALD45_TRANSITION_STAGE" = false
          if test "$RALD4_POSITIVE_GATE" = true; then
            test "$candidate" = true
            test "$RALD5_PUBLICATION_AUTHORIZED" != true
            test "$RALD5_SAME_VERSION_ACCEPTANCE" != true
            test "$RALD45_TRANSITION_STAGE" != true
            test "$RALD5_NEGATIVE_GATE" != true
          fi
          if test "$RALD5_PUBLICATION_AUTHORIZED" = true; then
            test "$GITHUB_EVENT_NAME" = workflow_dispatch
          fi
          if test "$RALD5_SAME_VERSION_ACCEPTANCE" = true; then
            test "$GITHUB_EVENT_NAME" = workflow_dispatch
            test "$GITHUB_REF" = refs/heads/rewrite/rust-core
            test "$RALD4_POSITIVE_GATE" != true
            test "$RALD5_PUBLICATION_AUTHORIZED" = true
            test '${{ steps.stable.outputs.current_version }}' = "$RALD5_SAME_VERSION_ACCEPTANCE_VERSION"
            test "$upstream_version" = "$RALD5_SAME_VERSION_ACCEPTANCE_VERSION"
            test '${{ steps.stable.outputs.current_version }}' = "$upstream_version"
            test "$candidate" = false
            candidate=true
            acceptance_suffix='-rald5-same-version-acceptance'
            printf 'RALD-5 same-version acceptance bridge selected for exact authenticated/official stable %s\n' \
              "$upstream_version"
          fi
          if test "$RALD45_TRANSITION_STAGE" = true; then
            test "$GITHUB_EVENT_NAME" = workflow_dispatch
            test "$GITHUB_REF" = refs/heads/rewrite/rust-core
            test "$RALD4_POSITIVE_GATE" != true
            test "$RALD5_PUBLICATION_AUTHORIZED" = true
            test "$RALD5_SAME_VERSION_ACCEPTANCE" = true
            test "$RALD5_NEGATIVE_GATE" != true
            test '${{ steps.stable.outputs.current_version }}' = "$RALD5_SAME_VERSION_ACCEPTANCE_VERSION"
            test "$upstream_version" = "$RALD5_SAME_VERSION_ACCEPTANCE_VERSION"
            test '${{ steps.stable.outputs.current_version }}' = "$upstream_version"
            test "$candidate" = true
            acceptance_suffix='-rald45-transition'
            printf 'RALD-4.5 transition stage selected from authenticated public stable %s to corrected Core source %s\n' \
              "$upstream_version" "$CODEX_SOURCE_SHA"
          fi
          if test "$RALD5_NEGATIVE_GATE" = true; then
            test "$GITHUB_EVENT_NAME" = workflow_dispatch
            test "$RALD4_POSITIVE_GATE" != true
            test "$RALD45_TRANSITION_STAGE" != true
            test "$RALD5_PUBLICATION_AUTHORIZED" = true
            test "$candidate" = true
          fi
          suffix="${upstream_version//./-}-${CODEX_SOURCE_SHA:0:12}${acceptance_suffix}"
          printf 'candidate=%s\n' "$candidate" >> "$GITHUB_OUTPUT"
          printf 'acceptance_gate=%s\n' "$RALD4_POSITIVE_GATE" >> "$GITHUB_OUTPUT"
          printf 'publication_authorized=%s\n' "$RALD5_PUBLICATION_AUTHORIZED" >> "$GITHUB_OUTPUT"
          printf 'same_version_acceptance=%s\n' "$RALD5_SAME_VERSION_ACCEPTANCE" >> "$GITHUB_OUTPUT"
          printf 'transition_stage=%s\n' "$RALD45_TRANSITION_STAGE" >> "$GITHUB_OUTPUT"
          printf 'negative_gate=%s\n' "$RALD5_NEGATIVE_GATE" >> "$GITHUB_OUTPUT"
          printf 'artifact_name=rald3-candidate-%s\n' "$suffix" >> "$GITHUB_OUTPUT"
          printf 'qualified_artifact_name=rald4-qualified-%s\n' "$suffix" >> "$GITHUB_OUTPUT"
          printf 'signed_artifact_name=rald4-signed-%s\n' "$suffix" >> "$GITHUB_OUTPUT"
          printf 'generation_id=local-hosted-%s\n' "$suffix" >> "$GITHUB_OUTPUT"
          printf 'upstream_version=%s\n' "$upstream_version" >> "$GITHUB_OUTPUT"
          printf 'archive_sha256=%s\n' "$archive_sha256" >> "$GITHUB_OUTPUT"

      - name: Cross-build Core and Manager
        if: steps.decision.outputs.candidate == 'true'
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install "$RUST_VERSION" --profile minimal --target aarch64-linux-android
          ndk="$ANDROID_SDK_ROOT/ndk/$ANDROID_NDK_VERSION"
          toolchain="$ndk/toolchains/llvm/prebuilt/linux-x86_64/bin"
          linker="$toolchain/aarch64-linux-android${ANDROID_API}-clang"
          test -x "$linker"
          test -x "$toolchain/llvm-ar"
          cd source
          export CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER="$linker"
          export CC_aarch64_linux_android="$linker"
          export AR_aarch64_linux_android="$toolchain/llvm-ar"
          cargo "+$RUST_VERSION" build --release --locked --target aarch64-linux-android \
            -p codex -p codex-manager
          cargo "+$RUST_VERSION" build --release --locked -p codex-release-builder

      - name: Fetch, adapt, and qualify unsigned candidate
        if: steps.decision.outputs.candidate == 'true'
        shell: bash
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/rald3-candidate"
          rm -rf "$work"
          mkdir -p "$work"
          builder="$GITHUB_WORKSPACE/source/target/release/codex-release-builder"
          core="$GITHUB_WORKSPACE/source/target/aarch64-linux-android/release/codex"
          manager="$GITHUB_WORKSPACE/source/target/aarch64-linux-android/release/codex-manager"
          upstream_version='${{ steps.decision.outputs.upstream_version }}'
          archive_sha256='${{ steps.decision.outputs.archive_sha256 }}'
          generation_id='${{ steps.decision.outputs.generation_id }}'
          transition_args=()
          if test '${{ steps.decision.outputs.transition_stage }}' = true; then
            transition_args+=(--legacy-activation-doctor-unsupported)
          fi
          fetch_output="$($builder fetch \
            --version "$upstream_version" \
            --curl /usr/bin/curl \
            --openssl /usr/bin/openssl \
            --output "$work/upstream.tar.gz")"
          fetched_sha256="$(printf '%s\n' "$fetch_output" | awk -F '\t' '$1=="archive_sha256"{print $2}')"
          test "$fetched_sha256" = "$archive_sha256"

          "$builder" build \
            --version "$upstream_version" \
            --archive "$work/upstream.tar.gz" \
            --archive-sha256 "$archive_sha256" \
            --generation-id "$generation_id" \
            --core "$core" \
            --manager "$manager" \
            --defer-manager-probe \
            "${transition_args[@]}" \
            --creation-metadata r10-browser-helper-bridge-v1 \
            --gzip /usr/bin/gzip \
            --openssl /usr/bin/openssl \
            --output "$work/candidate"

          python3 source/.github/scripts/rald3_preflight.py candidate \
            "$work/candidate" "$upstream_version"
          test "$(awk -F '\t' '$1=="creation_metadata"{print $2}' "$work/candidate/generation.meta")" = r10-browser-helper-bridge-v1
          doctor_capability="$(awk -F '\t' '$1=="upstream_doctor"{print $2}' "$work/candidate/generation.meta")"
          if test '${{ steps.decision.outputs.transition_stage }}' = true; then
            test "$doctor_capability" = unsupported
          else
            test "$doctor_capability" = supported
          fi
          find "$work/candidate" -type f -printf '%P\n' | LC_ALL=C sort > "$work/actual-files"
          cat > "$work/expected-files" <<'EOF'
          .manager-probe-deferred
          codex-code-mode-host
          core
          generation.meta
          helpers/0
          helpers/1
          manager
          runtime
          EOF
          diff -u "$work/expected-files" "$work/actual-files"
          for executable in codex-code-mode-host core helpers/0 helpers/1 manager runtime; do
            test -f "$work/candidate/$executable"
            test ! -L "$work/candidate/$executable"
            test "$(stat -c '%a' "$work/candidate/$executable")" = '755'
          done
          tar --sort=name --mtime='@0' --owner=0 --group=0 --numeric-owner \
            -cf "$work/candidate.tar" -C "$work" candidate
          test "$(stat -c '%s' "$work/candidate.tar")" -lt 1073741824

      - name: Upload unsigned candidate only
        if: steps.decision.outputs.candidate == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ${{ steps.decision.outputs.artifact_name }}
          path: ${{ runner.temp }}/rald3-candidate/candidate.tar
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

      - name: Record exact-current dry-run
        if: steps.decision.outputs.candidate == 'false'
        shell: bash
        run: |
          set -euo pipefail
          printf 'authenticated wrapper stable already matches official upstream %s\n' \
            '${{ steps.decision.outputs.upstream_version }}'

  smoke:
    name: Android/AArch64 executable smoke
    needs: producer
    if: needs.producer.outputs.candidate == 'true'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    steps:
      - name: Fetch exact accepted source
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -m)" = aarch64
          rm -rf source
          git init source
          git -C source remote add origin https://github.com/humtr/codex.git
          git -C source fetch --no-tags --depth=1 origin "$CODEX_SOURCE_SHA"
          git -C source checkout --detach FETCH_HEAD
          test "$(git -C source rev-parse HEAD)" = "$CODEX_SOURCE_SHA"

      - name: Download unsigned candidate
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: ${{ needs.producer.outputs.artifact_name }}
          path: ${{ runner.temp }}/rald3-download

      - name: Reverify candidate before execution
        shell: bash
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/rald3-smoke"
          rm -rf "$work"
          mkdir -p "$work"
          tar -xf "$RUNNER_TEMP/rald3-download/candidate.tar" -C "$work"
          python3 source/.github/scripts/rald3_preflight.py candidate \
            "$work/candidate" '${{ needs.producer.outputs.upstream_version }}'

      - name: Provision pinned Android ARM64 bionic userspace
        shell: bash
        run: |
          set -euo pipefail
          for tool in curl base64 unzip debugfs file readelf sha256sum; do
            command -v "$tool" >/dev/null
          done
          test "$(uname -m)" = aarch64
          root="$RUNNER_TEMP/rald4-bionic"
          rm -rf "$root"
          mkdir -p "$root/bin" "$root/lib64/bionic"
          apex_url="https://android.googlesource.com/platform/prebuilts/runtime/+/${ANDROID_RUNTIME_APEX_COMMIT}/mainline/runtime/apex/com.android.runtime-arm64.apex?format=TEXT"
          curl --fail --silent --show-error --location --proto '=https' --tlsv1.2 \
            --connect-timeout 15 --max-time 120 --max-filesize 20971520 \
            --output "$root/runtime.apex.b64" "$apex_url"
          base64 --decode "$root/runtime.apex.b64" > "$root/runtime.apex"
          rm "$root/runtime.apex.b64"
          test "$(wc -c < "$root/runtime.apex")" -eq 13881344
          test "$(sha256sum "$root/runtime.apex" | awk '{print $1}')" = \
            "$ANDROID_RUNTIME_APEX_SHA256"
          unzip -p "$root/runtime.apex" apex_payload.img > "$root/apex_payload.img"
          test "$(wc -c < "$root/apex_payload.img")" -eq 13783040
          debugfs -R "dump -p /bin/linker64 $root/bin/linker64" "$root/apex_payload.img" >/dev/null 2>&1
          for library in libc.so libdl.so libm.so; do
            debugfs -R "dump -p /lib64/bionic/$library $root/lib64/bionic/$library" \
              "$root/apex_payload.img" >/dev/null 2>&1
          done
          for path in \
            "$root/bin/linker64" \
            "$root/lib64/bionic/libc.so" \
            "$root/lib64/bionic/libdl.so" \
            "$root/lib64/bionic/libm.so"; do
            test -f "$path"
            test ! -L "$path"
          done
          chmod 0755 "$root/bin/linker64"
          file "$root/bin/linker64" | grep -F 'ARM aarch64'
          readelf -h "$root/bin/linker64" | grep -Eq 'Machine:[[:space:]]+AArch64'
          rm "$root/runtime.apex" "$root/apex_payload.img"

      - name: Run exact Manager, Core, and runtime smoke natively
        shell: bash
        run: |
          set -euo pipefail
          candidate="$RUNNER_TEMP/rald3-smoke/candidate"
          linker="$RUNNER_TEMP/rald4-bionic/bin/linker64"
          libdir="$RUNNER_TEMP/rald4-bionic/lib64/bionic"
          test -x "$linker"
          test "$(uname -m)" = aarch64

          set +e
          env -i CODEX_MANAGER_ARTIFACT_PROBE=1 LD_LIBRARY_PATH="$libdir" \
            "$linker" "$candidate/manager" --artifact-probe \
            > "$RUNNER_TEMP/manager.out" 2> "$RUNNER_TEMP/manager.err"
          manager_rc=$?
          env -i LD_LIBRARY_PATH="$libdir" \
            "$linker" "$candidate/core" update --help \
            > "$RUNNER_TEMP/core.out" 2> "$RUNNER_TEMP/core.err"
          core_rc=$?
          env -i "$candidate/runtime" --version \
            > "$RUNNER_TEMP/runtime.out" 2> "$RUNNER_TEMP/runtime.err"
          runtime_rc=$?
          set -e

          printf 'manager_rc=%s core_rc=%s runtime_rc=%s\n' \
            "$manager_rc" "$core_rc" "$runtime_rc" >&2
          if test "$manager_rc" -ne 0 || test "$core_rc" -ne 0 || test "$runtime_rc" -ne 0; then
            for name in manager core runtime; do
              printf '%s stderr:\n' "$name" >&2
              cat "$RUNNER_TEMP/$name.err" >&2
            done
            exit 1
          fi

          verify_failed=0
          printf 'codex-manager-artifact-v1\ncore_api=codex-manager-core-v1\n' > "$RUNNER_TEMP/manager.expected"
          cat > "$RUNNER_TEMP/linker.stderr.expected" <<'EOF'
          linker: Warning: failed to find generated linker configuration from "/linkerconfig/ld.config.txt"
          WARNING: linker: Warning: failed to find generated linker configuration from "/linkerconfig/ld.config.txt"
          EOF
          if ! cmp "$RUNNER_TEMP/manager.expected" "$RUNNER_TEMP/manager.out"; then
            verify_failed=1
          fi
          if ! cmp "$RUNNER_TEMP/linker.stderr.expected" "$RUNNER_TEMP/manager.err"; then
            verify_failed=1
          fi
          if ! grep -Fqx 'usage: codex update [--help] | --force | --build-local | --local <DIRECTORY> | --remote <HTTPS_BASE_URL> | --rollback' \
            "$RUNNER_TEMP/core.out"; then
            verify_failed=1
          fi
          if ! cmp "$RUNNER_TEMP/linker.stderr.expected" "$RUNNER_TEMP/core.err"; then
            verify_failed=1
          fi
          if test ! -s "$RUNNER_TEMP/runtime.out" || \
             test "$(wc -c < "$RUNNER_TEMP/runtime.out")" -gt 512; then
            verify_failed=1
          fi
          if test -s "$RUNNER_TEMP/runtime.err"; then
            verify_failed=1
          fi
          if test "$verify_failed" != 0; then
            for name in manager core runtime; do
              printf '%s stdout (first 4096 bytes):\n' "$name" >&2
              head -c 4096 "$RUNNER_TEMP/$name.out" >&2 || true
              printf '\n%s stderr (first 4096 bytes):\n' "$name" >&2
              head -c 4096 "$RUNNER_TEMP/$name.err" >&2 || true
              printf '\n' >&2
            done
            exit 1
          fi

          rm "$candidate/.manager-probe-deferred"
          test ! -e "$candidate/.manager-probe-deferred"
          printf 'unsigned candidate passed native Android/AArch64 pre-sign smoke\n'

      - name: Package qualified unsigned candidate
        shell: bash
        run: |
          set -euo pipefail
          candidate="$RUNNER_TEMP/rald3-smoke/candidate"
          python3 source/.github/scripts/rald3_preflight.py qualified-candidate \
            "$candidate" '${{ needs.producer.outputs.upstream_version }}'
          tar -cf "$RUNNER_TEMP/rald4-qualified.tar" \
            -C "$RUNNER_TEMP/rald3-smoke" candidate
          test "$(stat -c '%s' "$RUNNER_TEMP/rald4-qualified.tar")" -lt 1073741824

      - name: Upload qualified unsigned candidate
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ${{ needs.producer.outputs.qualified_artifact_name }}
          path: ${{ runner.temp }}/rald4-qualified.tar
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  sign:
    name: Sign qualified candidate
    needs: [producer, smoke]
    if: needs.producer.outputs.candidate == 'true' && needs.smoke.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Fetch exact accepted signing source
        shell: bash
        run: |
          set -euo pipefail
          rm -rf source
          git init source
          git -C source remote add origin https://github.com/humtr/codex.git
          git -C source fetch --no-tags --depth=1 origin "$CODEX_SOURCE_SHA"
          git -C source checkout --detach FETCH_HEAD
          test "$(git -C source rev-parse HEAD)" = "$CODEX_SOURCE_SHA"
          test -z "$(git -C source status --porcelain)"

      - name: Download qualified unsigned candidate
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: ${{ needs.producer.outputs.qualified_artifact_name }}
          path: ${{ runner.temp }}/rald4-qualified-download

      - name: Reverify qualified candidate and accepted authority
        shell: bash
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/rald4-sign"
          rm -rf "$work"
          mkdir -p "$work"
          tar -xf "$RUNNER_TEMP/rald4-qualified-download/rald4-qualified.tar" -C "$work"
          python3 source/.github/scripts/rald3_preflight.py qualified-candidate \
            "$work/candidate" '${{ needs.producer.outputs.upstream_version }}'
          test "$(sed -n 's/^generation_id\t//p' "$work/candidate/generation.meta")" = \
            '${{ needs.producer.outputs.generation_id }}'

          authority="$work/update-public-key.pem"
          curl --fail --silent --show-error --location --proto '=https' --tlsv1.2 \
            --connect-timeout 15 --max-time 60 --max-filesize 16384 \
            --output "$authority" \
            'https://github.com/humtr/codex/releases/download/local-20260914-update-channel-bridge-1/update-public-key.pem'
          test "$(sha256sum "$authority" | awk '{print $1}')" = \
            "$WRAPPER_PUBLIC_KEY_SHA256"
          openssl pkey -pubin -in "$authority" -pubout -outform DER \
            > "$work/accepted-public.der"
          test "$(wc -c < "$work/accepted-public.der")" -eq 44

      - name: Build exact release signer
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install "$RUST_VERSION" --profile minimal
          cargo "+$RUST_VERSION" build --release --locked \
            --manifest-path source/Cargo.toml -p codex-release-builder
          test -x source/target/release/codex-release-builder
          python3 source/.github/scripts/test_rald4_signing.py
          python3 -m py_compile \
            source/.github/scripts/rald4_signing.py \
            source/.github/scripts/test_rald4_signing.py

      - name: Sign qualified candidate with accepted authority only
        shell: bash
        env:
          CODEX_RELEASE_SIGNING_KEY: ${{ secrets.CODEX_RELEASE_SIGNING_KEY }}
        run: |
          set -euo pipefail
          release_base='https://humtr.github.io/codex/${{ needs.producer.outputs.generation_id }}/'
          if test '${{ needs.producer.outputs.acceptance_gate }}' = true; then
            release_base='https://rald4-acceptance.invalid/${{ needs.producer.outputs.generation_id }}/'
          fi
          python3 source/.github/scripts/rald4_signing.py \
            --candidate "$RUNNER_TEMP/rald4-sign/candidate" \
            --accepted-public-key "$RUNNER_TEMP/rald4-sign/update-public-key.pem" \
            --release-sequence '${{ needs.producer.outputs.release_sequence }}' \
            --release-base "$release_base" \
            --builder "$GITHUB_WORKSPACE/source/target/release/codex-release-builder" \
            --openssl /usr/bin/openssl \
            --runner-temp "$RUNNER_TEMP" \
            --output "$RUNNER_TEMP/rald4-sign/signed-output"

      - name: Independently verify signed candidate
        shell: bash
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/rald4-sign"
          signed="$work/signed-output"
          generation='${{ needs.producer.outputs.generation_id }}'
          authority="$work/update-public-key.pem"
          manifest="$signed/releases/$generation/release.manifest"
          release_sig="$signed/releases/$generation/release.sig"
          index="$signed/update-index-v1"
          index_sig="$signed/update-index-v1.sig"
          test -f "$manifest" -a ! -L "$manifest"
          test -f "$release_sig" -a ! -L "$release_sig"
          test -f "$index" -a ! -L "$index"
          test -f "$index_sig" -a ! -L "$index_sig"
          test "$(wc -c < "$release_sig")" -eq 64
          test "$(wc -c < "$index_sig")" -eq 64
          openssl pkeyutl -verify -pubin -inkey "$authority" -rawin \
            -in "$manifest" -sigfile "$release_sig"
          openssl pkeyutl -verify -pubin -inkey "$authority" -rawin \
            -in "$index" -sigfile "$index_sig"
          test "$(sed -n 's/^release_sequence\t//p' "$manifest")" = \
            '${{ needs.producer.outputs.release_sequence }}'
          test "$(sed -n 's/^generation_id\t//p' "$manifest")" = "$generation"
          test "$(sed -n 's/^generation_id\t//p' "$index")" = "$generation"
          actual_release_base="$(sed -n 's/^release_base\t//p' "$index")"
          if test '${{ needs.producer.outputs.acceptance_gate }}' = true; then
            test "$actual_release_base" = "https://rald4-acceptance.invalid/$generation/"
          else
            test "$actual_release_base" = "https://humtr.github.io/codex/$generation/"
          fi
          test -z "$(find "$RUNNER_TEMP" -maxdepth 1 -name '.rald4-signing-*' -print -quit)"

          tar --sort=name --mtime='@0' --owner=0 --group=0 --numeric-owner \
            -cf "$work/signed-candidate.tar" -C "$work" signed-output
          test "$(stat -c '%s' "$work/signed-candidate.tar")" -lt 1073741824

      - name: Remove acceptance-only signed output
        if: needs.producer.outputs.acceptance_gate == 'true'
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$RUNNER_TEMP/rald4-sign/signed-output" \
            "$RUNNER_TEMP/rald4-sign/signed-candidate.tar"
          test ! -e "$RUNNER_TEMP/rald4-sign/signed-output"
          test ! -e "$RUNNER_TEMP/rald4-sign/signed-candidate.tar"

      - name: Upload signed candidate only
        if: needs.producer.outputs.acceptance_gate != 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ${{ needs.producer.outputs.signed_artifact_name }}
          path: ${{ runner.temp }}/rald4-sign/signed-candidate.tar
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  stage_release:
    name: Stage immutable candidate Release
    needs: [producer, sign]
    if: needs.producer.outputs.candidate == 'true' && needs.sign.result == 'success' && needs.producer.outputs.acceptance_gate != 'true' && needs.producer.outputs.publication_authorized == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
    outputs:
      release_id: ${{ steps.stage.outputs.release_id }}
    steps:
      - name: Fetch exact RALD-5 publication verifier
        shell: bash
        run: |
          set -euo pipefail
          rm -rf publication-source
          git init publication-source
          git -C publication-source remote add origin https://github.com/humtr/codex.git
          git -C publication-source fetch --no-tags --depth=1 origin "$RALD5_SOURCE_SHA"
          git -C publication-source checkout --detach FETCH_HEAD
          test "$(git -C publication-source rev-parse HEAD)" = "$RALD5_SOURCE_SHA"
          python3 publication-source/.github/scripts/test_rald5_publication.py
          python3 publication-source/.github/scripts/test_rald5_publication_contract.py
          python3 publication-source/.github/scripts/test_rald5_promotion.py
          python3 -m py_compile \
            publication-source/.github/scripts/rald5_publication.py \
            publication-source/.github/scripts/rald5_promotion.py

      - name: Download signed candidate
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: ${{ needs.producer.outputs.signed_artifact_name }}
          path: ${{ runner.temp }}/rald5-signed-download

      - name: Verify and stage immutable Release assets
        id: stage
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          expected_main='${{ needs.producer.outputs.expected_main_sha }}'
          test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')" = "$expected_main"
          work="$RUNNER_TEMP/rald5-stage"
          rm -rf "$work"
          mkdir -p "$work"
          tar -xf "$RUNNER_TEMP/rald5-signed-download/signed-candidate.tar" -C "$work"
          generation='${{ needs.producer.outputs.generation_id }}'
          sequence='${{ needs.producer.outputs.release_sequence }}'
          current='${{ needs.producer.outputs.current_generation }}'
          release_base="https://humtr.github.io/codex/$generation/"
          authority="$work/update-public-key.pem"
          assets="$work/release-assets"
          curl --fail --silent --show-error --location --proto '=https' --tlsv1.2 \
            --connect-timeout 15 --max-time 60 --max-filesize 16384 \
            --output "$authority" \
            "https://github.com/humtr/codex/releases/download/$current/update-public-key.pem"
          test "$(sha256sum "$authority" | awk '{print $1}')" = "$WRAPPER_PUBLIC_KEY_SHA256"
          python3 publication-source/.github/scripts/rald5_publication.py prepare-assets \
            --signed-root "$work/signed-output" \
            --public-key "$authority" \
            --output "$assets" \
            --generation "$generation" \
            --release-sequence "$sequence" \
            --release-base "$release_base"

          cat > "$work/expected-assets" <<'EOF'
          candidate-update-index-v1
          candidate-update-index-v1.sig
          codex-code-mode-host
          core
          generation.meta
          helper-0
          helper-1
          manager
          release.manifest
          release.sig
          runtime
          update-public-key.pem
          EOF
          LC_ALL=C sort -o "$work/expected-assets" "$work/expected-assets"

          gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" --paginate \
            --jq ".[] | select(.tag_name == \"$generation\") | .id" \
            > "$work/release-ids"
          test "$(wc -l < "$work/release-ids")" -le 1
          release_id="$(cat "$work/release-ids")"
          if test -z "$release_id"; then
            test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')" = "$expected_main"
            release_id="$(gh api --method POST "repos/$GITHUB_REPOSITORY/releases" \
              -f tag_name="$generation" -f target_commitish=main -f name="$generation" \
              -F draft=true -F prerelease=true --jq '.id')"
          fi
          draft="$(gh api "repos/$GITHUB_REPOSITORY/releases/$release_id" --jq '.draft')"
          prerelease="$(gh api "repos/$GITHUB_REPOSITORY/releases/$release_id" --jq '.prerelease')"
          target_commitish="$(gh api "repos/$GITHUB_REPOSITORY/releases/$release_id" --jq '.target_commitish')"
          test "$prerelease" = true
          if test "$draft" = true; then
            test "$target_commitish" = main -o "$target_commitish" = "$expected_main"
          fi

          verify_assets() {
            local destination="$1"
            rm -rf "$destination"
            mkdir -p "$destination"
            gh release download "$generation" --repo "$GITHUB_REPOSITORY" --dir "$destination"
            find "$destination" -maxdepth 1 -type f -printf '%f\n' | LC_ALL=C sort > "$work/actual-assets"
            diff -u "$work/expected-assets" "$work/actual-assets"
            while IFS= read -r name; do
              cmp "$assets/$name" "$destination/$name"
            done < "$work/expected-assets"
          }

          if test "$draft" = true; then
            test "$(gh api "repos/$GITHUB_REPOSITORY/releases/$release_id/assets?per_page=100" --jq 'length')" -eq 0
            gh release upload "$generation" "$assets"/* --repo "$GITHUB_REPOSITORY"
            verify_assets "$work/api-readback"
            gh api --method PATCH "repos/$GITHUB_REPOSITORY/releases/$release_id" \
              -F draft=false -F prerelease=true >/dev/null
          else
            verify_assets "$work/api-readback"
          fi
          test "$(gh api "repos/$GITHUB_REPOSITORY/releases/$release_id" --jq '.draft')" = false
          test "$(gh api "repos/$GITHUB_REPOSITORY/releases/$release_id" --jq '.prerelease')" = true
          tag_sha="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$generation" --jq '.object.sha')"
          test "$tag_sha" = "$expected_main"

          gh api "repos/$GITHUB_REPOSITORY/releases/$release_id/assets?per_page=100" --paginate \
            --jq '.[] | [.name,.browser_download_url] | @tsv' | LC_ALL=C sort > "$work/public-assets"
          cut -f1 "$work/public-assets" > "$work/public-names"
          diff -u "$work/expected-assets" "$work/public-names"
          while IFS=$'\t' read -r name url; do
            readback="$work/public-$name"
            ok=false
            for attempt in $(seq 1 12); do
              if curl --fail --silent --show-error --location --proto '=https' --tlsv1.2 \
                --connect-timeout 15 --max-time 120 --output "$readback" "$url" && \
                cmp "$assets/$name" "$readback"; then
                ok=true
                break
              fi
              sleep 5
            done
            test "$ok" = true
          done < "$work/public-assets"
          printf 'release_id=%s\n' "$release_id" >> "$GITHUB_OUTPUT"

  pages:
    name: Deploy candidate Pages while retaining LKG
    needs: [producer, stage_release]
    if: needs.producer.outputs.candidate == 'true' && needs.stage_release.result == 'success' && needs.producer.outputs.acceptance_gate != 'true' && needs.producer.outputs.publication_authorized == 'true'
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/publish-termux-update-pages.yml
    with:
      generation_id: ${{ needs.producer.outputs.generation_id }}
      release_sequence: ${{ needs.producer.outputs.release_sequence }}
      current_generation: ${{ needs.producer.outputs.current_generation }}
      expected_main_sha: ${{ needs.producer.outputs.expected_main_sha }}

  verify_public:
    name: Public readback and disposable update proof
    needs: [producer, stage_release, pages]
    if: needs.producer.outputs.candidate == 'true' && needs.stage_release.result == 'success' && needs.pages.result == 'success' && needs.producer.outputs.acceptance_gate != 'true' && needs.producer.outputs.publication_authorized == 'true'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Fetch exact RALD-5 publication verifier
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -m)" = aarch64
          rm -rf publication-source
          git init publication-source
          git -C publication-source remote add origin https://github.com/humtr/codex.git
          git -C publication-source fetch --no-tags --depth=1 origin "$RALD5_SOURCE_SHA"
          git -C publication-source checkout --detach FETCH_HEAD
          test "$(git -C publication-source rev-parse HEAD)" = "$RALD5_SOURCE_SHA"
          python3 publication-source/.github/scripts/test_rald5_publication.py
          python3 publication-source/.github/scripts/test_rald5_publication_contract.py
          python3 publication-source/.github/scripts/test_rald5_promotion.py

      - name: Read back every signed candidate byte from public HTTPS
        shell: bash
        run: |
          set -euo pipefail
          test "$(git ls-remote --exit-code https://github.com/humtr/codex.git refs/heads/main | awk '{print $1}')" = \
            '${{ needs.producer.outputs.expected_main_sha }}'
          root="$RUNNER_TEMP/rald5-public"
          rm -rf "$root"
          mkdir -p "$root"
          authority="$root/update-public-key.pem"
          current='${{ needs.producer.outputs.current_generation }}'
          candidate='${{ needs.producer.outputs.generation_id }}'
          curl --fail --silent --show-error --location --proto '=https' --tlsv1.2 \
            --connect-timeout 15 --max-time 60 --max-filesize 16384 \
            --output "$authority" \
            "https://github.com/humtr/codex/releases/download/$current/update-public-key.pem"
          test "$(sha256sum "$authority" | awk '{print $1}')" = "$WRAPPER_PUBLIC_KEY_SHA256"

          fetch_generation() {
            local generation="$1"
            local index_url="$2"
            local release_base="https://humtr.github.io/codex/$generation/"
            local destination="$root/$generation"
            mkdir -p "$destination/helpers"
            for rel in release.manifest release.sig codex-code-mode-host core generation.meta helpers/0 helpers/1 manager runtime; do
              mkdir -p "$(dirname "$destination/$rel")"
              curl --fail --silent --show-error --location --proto '=https' --tlsv1.2 \
                --connect-timeout 15 --max-time 600 --output "$destination/$rel" "${release_base}${rel}"
            done
            curl --fail --silent --show-error --location --proto '=https' --tlsv1.2 \
              --connect-timeout 15 --max-time 60 --output "$destination/update-index-v1" "$index_url"
            curl --fail --silent --show-error --location --proto '=https' --tlsv1.2 \
              --connect-timeout 15 --max-time 60 --output "$destination/update-index-v1.sig" "${index_url}.sig"
            chmod 0755 "$destination/codex-code-mode-host" "$destination/core" \
              "$destination/helpers/0" "$destination/helpers/1" "$destination/manager" "$destination/runtime"
            chmod 0644 "$destination/generation.meta" "$destination/release.manifest" \
              "$destination/release.sig" "$destination/update-index-v1" "$destination/update-index-v1.sig"
          }

          current_index="https://raw.githubusercontent.com/humtr/codex/${{ needs.producer.outputs.expected_main_sha }}/update-index-v1"
          fetch_generation "$current" "$current_index"
          python3 publication-source/.github/scripts/rald5_publication.py verify-public \
            --root "$root" --public-key "$authority" \
            --generation "$current" \
            --release-sequence '${{ needs.producer.outputs.current_release_sequence }}' \
            --release-base "https://humtr.github.io/codex/$current/"

          candidate_index="https://humtr.github.io/codex/$candidate/update-index-v1"
          ready=false
          for attempt in $(seq 1 20); do
            if curl --fail --silent --show-error --location --proto '=https' --tlsv1.2 \
              --connect-timeout 15 --max-time 60 --output "$root/candidate-probe" \
              "https://humtr.github.io/codex/$candidate/release.manifest" && \
              test "$(awk -F '\t' '$1=="generation_id"{print $2}' "$root/candidate-probe")" = "$candidate"; then
              ready=true
              break
            fi
            sleep 5
          done
          test "$ready" = true
          fetch_generation "$candidate" "$candidate_index"

          release_readback="$root/release-readback"
          mkdir -p "$release_readback"
          release_url="https://github.com/humtr/codex/releases/download/$candidate"
          compare_release_asset() {
            local asset="$1"
            local relative="$2"
            curl --fail --silent --show-error --location --proto '=https' --tlsv1.2 \
              --connect-timeout 15 --max-time 600 \
              --output "$release_readback/$asset" "$release_url/$asset"
            cmp "$release_readback/$asset" "$root/$candidate/$relative"
          }
          compare_release_asset release.manifest release.manifest
          compare_release_asset release.sig release.sig
          compare_release_asset codex-code-mode-host codex-code-mode-host
          compare_release_asset core core
          compare_release_asset generation.meta generation.meta
          compare_release_asset helper-0 helpers/0
          compare_release_asset helper-1 helpers/1
          compare_release_asset manager manager
          compare_release_asset runtime runtime
          compare_release_asset candidate-update-index-v1 update-index-v1
          compare_release_asset candidate-update-index-v1.sig update-index-v1.sig
          curl --fail --silent --show-error --location --proto '=https' --tlsv1.2 \
            --connect-timeout 15 --max-time 60 --max-filesize 16384 \
            --output "$release_readback/update-public-key.pem" "$release_url/update-public-key.pem"
          cmp "$release_readback/update-public-key.pem" "$authority"

          if test '${{ needs.producer.outputs.negative_gate }}' = true; then
            printf 'rald5-negative-gate\n' >> "$root/$candidate/runtime"
            if python3 publication-source/.github/scripts/rald5_publication.py verify-public \
              --root "$root" --public-key "$authority" \
              --generation "$candidate" \
              --release-sequence '${{ needs.producer.outputs.release_sequence }}' \
              --release-base "https://humtr.github.io/codex/$candidate/"; then
              printf 'negative gate unexpectedly verified tampered candidate\n' >&2
              exit 1
            fi
            printf 'RALD-5 negative gate rejected staged candidate before promotion as required\n' >&2
            exit 1
          fi
          python3 publication-source/.github/scripts/rald5_publication.py verify-public \
            --root "$root" --public-key "$authority" \
            --generation "$candidate" \
            --release-sequence '${{ needs.producer.outputs.release_sequence }}' \
            --release-base "https://humtr.github.io/codex/$candidate/"

      - name: Provision ephemeral Android bionic interpreter path
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -m)" = aarch64
          for tool in curl base64 unzip debugfs file readelf sha256sum; do
            command -v "$tool" >/dev/null
          done
          sudo test ! -e /system
          root="$RUNNER_TEMP/rald5-bionic"
          rm -rf "$root"
          mkdir -p "$root/bin" "$root/lib64/bionic"
          apex_url="https://android.googlesource.com/platform/prebuilts/runtime/+/${ANDROID_RUNTIME_APEX_COMMIT}/mainline/runtime/apex/com.android.runtime-arm64.apex?format=TEXT"
          curl --fail --silent --show-error --location --proto '=https' --tlsv1.2 \
            --connect-timeout 15 --max-time 120 --max-filesize 20971520 \
            --output "$root/runtime.apex.b64" "$apex_url"
          base64 --decode "$root/runtime.apex.b64" > "$root/runtime.apex"
          test "$(wc -c < "$root/runtime.apex")" -eq 13881344
          test "$(sha256sum "$root/runtime.apex" | awk '{print $1}')" = "$ANDROID_RUNTIME_APEX_SHA256"
          unzip -p "$root/runtime.apex" apex_payload.img > "$root/apex_payload.img"
          test "$(wc -c < "$root/apex_payload.img")" -eq 13783040
          debugfs -R "dump -p /bin/linker64 $root/bin/linker64" "$root/apex_payload.img" >/dev/null 2>&1
          for library in libc.so libdl.so libm.so; do
            debugfs -R "dump -p /lib64/bionic/$library $root/lib64/bionic/$library" \
              "$root/apex_payload.img" >/dev/null 2>&1
          done
          chmod 0755 "$root/bin/linker64"
          sudo mkdir -p /system/bin /system/lib64
          sudo install -m 0755 "$root/bin/linker64" /system/bin/linker64
          for library in libc.so libdl.so libm.so; do
            sudo install -m 0644 "$root/lib64/bionic/$library" "/system/lib64/$library"
          done
          file /system/bin/linker64 | grep -F 'ARM aarch64'
          readelf -h /system/bin/linker64 | grep -Eq 'Machine:[[:space:]]+AArch64'
          rm -f "$root/runtime.apex.b64" "$root/runtime.apex" "$root/apex_payload.img"

      - name: Bootstrap current public stable and update through staged Pages
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/rald5-public"
          current='${{ needs.producer.outputs.current_generation }}'
          candidate='${{ needs.producer.outputs.generation_id }}'
          version='${{ needs.producer.outputs.upstream_version }}'
          export HOME="$RUNNER_TEMP/rald5-home"
          export PREFIX="$RUNNER_TEMP/rald5-prefix"
          export TMPDIR="$RUNNER_TEMP/rald5-tmp"
          export PATH="$PREFIX/bin:/usr/bin:/bin"
          export SSL_CERT_FILE="$PREFIX/etc/tls/cert.pem"
          export SSL_CERT_DIR="$PREFIX/etc/tls/certs"
          mkdir -p "$HOME" "$PREFIX/bin" "$PREFIX/etc/tls/certs" "$TMPDIR"
          cp /usr/bin/curl "$PREFIX/bin/curl"
          cp /usr/bin/openssl "$PREFIX/bin/openssl"
          cp /etc/resolv.conf "$PREFIX/etc/resolv.conf"
          cp /etc/ssl/certs/ca-certificates.crt "$PREFIX/etc/tls/cert.pem"
          if test '${{ needs.producer.outputs.transition_stage }}' = true; then
            generation_root="$HOME/.local/lib/codex/core/generations"
            current_dir="$generation_root/$current"
            state_root="$HOME/.local/share/codex/core"
            mkdir -p "$generation_root" "$state_root/config"
            python3 - "$root/$current" "$current_dir" <<'PY'
          import hashlib
          import os
          from pathlib import Path, PurePosixPath
          import shutil
          import stat
          import sys

          source = Path(sys.argv[1])
          destination = Path(sys.argv[2])
          if destination.exists():
              raise SystemExit("current generation destination already exists")
          manifest = source / "release.manifest"
          data = manifest.read_bytes()
          if len(data) > 128 * 1024 or not data.endswith(b"\n"):
              raise SystemExit("current manifest is not bounded canonical text")
          lines = data.decode("utf-8").splitlines()
          if not lines or lines[0] != "codex-release-v4":
              raise SystemExit("current manifest format is not v4")
          headers = {}
          for line in lines[1:10]:
              parts = line.split("\t")
              if len(parts) != 2 or parts[0] in headers:
                  raise SystemExit("current manifest header is invalid")
              headers[parts[0]] = parts[1]
          if headers.get("generation_id") != destination.name:
              raise SystemExit("current manifest generation id mismatch")
          count = int(headers.get("file_count", "0"))
          records = lines[10:]
          if count != len(records) or count != 7:
              raise SystemExit("current manifest inventory size mismatch")
          destination.mkdir(mode=0o755)
          seen = set()
          for line in records:
              parts = line.split("\t")
              if len(parts) != 4 or parts[0] != "file":
                  raise SystemExit("current manifest file record is invalid")
              rel, digest, mode = parts[1:]
              pure = PurePosixPath(rel)
              if pure.is_absolute() or ".." in pure.parts or rel in seen:
                  raise SystemExit("current manifest path is unsafe")
              if mode not in {"0644", "0755"}:
                  raise SystemExit("current manifest mode is invalid")
              seen.add(rel)
              src = source / rel
              st = src.lstat()
              if not stat.S_ISREG(st.st_mode) or src.is_symlink():
                  raise SystemExit(f"current source is not a regular file: {rel}")
              if hashlib.sha256(src.read_bytes()).hexdigest() != digest:
                  raise SystemExit(f"current source digest mismatch: {rel}")
              if f"{stat.S_IMODE(st.st_mode):04o}" != mode:
                  raise SystemExit(f"current source mode mismatch: {rel}")
              target = destination / rel
              target.parent.mkdir(parents=True, exist_ok=True)
              shutil.copyfile(src, target)
              os.chmod(target, int(mode, 8))
          for name in ("release.manifest", "release.sig"):
              src = source / name
              st = src.lstat()
              if not stat.S_ISREG(st.st_mode) or src.is_symlink():
                  raise SystemExit(f"current authority file is unsafe: {name}")
              shutil.copyfile(src, destination / name)
              os.chmod(destination / name, 0o644)
          PY
            manifest_key="$(awk -F '	' '$1=="release_public_key"{print $2}' "$current_dir/release.manifest")"
            test "${#manifest_key}" -eq 64
            case "$manifest_key" in (*[!0-9a-f]*) exit 1;; esac
            openssl pkey -pubin -in "$root/update-public-key.pem" -pubout -outform DER \
              > "$RUNNER_TEMP/rald45-public.der"
            test "$(wc -c < "$RUNNER_TEMP/rald45-public.der")" -eq 44
            authority_key="$(tail -c 32 "$RUNNER_TEMP/rald45-public.der" | od -An -vtx1 | tr -d ' \n')"
            test "$authority_key" = "$manifest_key"
            install -m 0644 "$root/update-public-key.pem" \
              "$HOME/.local/lib/codex/core/release-public-key.pem"
            cat > "$state_root/activation-state" <<EOF
          format=codex-activation-state-v3
          update_key=$manifest_key
          current=$current
          current_key=$manifest_key
          previous_present=0
          previous=
          previous_key=
          EOF
            chmod 0644 "$state_root/activation-state"
            test ! -e "$state_root/activation-journal"
            test ! -e "$state_root/activation-journal.tmp"
            test ! -e "$state_root/activation-state.tmp"
            install -m 0755 "$current_dir/core" "$PREFIX/bin/codex"
            cmp "$PREFIX/bin/codex" "$current_dir/core"
            if cmp -s "$PREFIX/bin/codex" "$root/$candidate/core"; then
              printf 'transition fixture did not preserve the old public stable Core\n' >&2
              exit 1
            fi
            "$PREFIX/bin/codex" --version > "$RUNNER_TEMP/rald45-pre-update-version.out"
            printf 'codex-cli %s\n' "$version" > "$RUNNER_TEMP/rald45-pre-update-version.expected"
            cmp "$RUNNER_TEMP/rald45-pre-update-version.expected" "$RUNNER_TEMP/rald45-pre-update-version.out"
          else
            /bin/sh publication-source/bootstrap/codex-bootstrap \
              "$root/$current/core" "$root/$current" "$root/update-public-key.pem"
          fi
          test -x "$PREFIX/bin/codex"

          export CODEX_TERMUX_UPDATE_INDEX_URL="https://humtr.github.io/codex/$candidate/update-index-v1"
          "$PREFIX/bin/codex" update > "$RUNNER_TEMP/rald5-first-update.out"
          printf 'activated channel generation %s\n' "$candidate" > "$RUNNER_TEMP/rald5-first-update.expected"
          cmp "$RUNNER_TEMP/rald5-first-update.expected" "$RUNNER_TEMP/rald5-first-update.out"
          if test '${{ needs.producer.outputs.transition_stage }}' = true; then
            test "$(sed -n 's/^current=//p' "$HOME/.local/share/codex/core/activation-state")" = "$candidate"
            test "$(sed -n 's/^previous=//p' "$HOME/.local/share/codex/core/activation-state")" = "$current"
            cmp "$PREFIX/bin/codex" "$root/$candidate/core"
          fi
          "$PREFIX/bin/codex" --version > "$RUNNER_TEMP/rald5-version.out"
          printf 'codex-cli %s\n' "$version" > "$RUNNER_TEMP/rald5-version.expected"
          cmp "$RUNNER_TEMP/rald5-version.expected" "$RUNNER_TEMP/rald5-version.out"
          set +e
          "$PREFIX/bin/codex" doctor --json > "$RUNNER_TEMP/rald5-doctor.out"
          doctor_rc=$?
          set -e
          test "$doctor_rc" -eq 0 -o "$doctor_rc" -eq 1
          test -s "$RUNNER_TEMP/rald5-doctor.out"
          test "$(wc -c < "$RUNNER_TEMP/rald5-doctor.out")" -lt 65536
          python3 - "$RUNNER_TEMP/rald5-doctor.out" "$doctor_rc" "$candidate" <<'PY'
          import json
          from pathlib import Path
          import sys

          report = json.loads(Path(sys.argv[1]).read_text())
          rc = int(sys.argv[2])
          candidate = sys.argv[3]
          if report.get("schema_version") != 2:
              raise SystemExit("doctor schema is not v2")
          upstream = report.get("upstream")
          core = report.get("termux_core")
          manager = report.get("manager")
          summary = report.get("summary")
          if not isinstance(upstream, dict) or not isinstance(core, dict):
              raise SystemExit("doctor report sections are invalid")
          if core.get("status") != "healthy" or core.get("generation_id") != candidate:
              raise SystemExit("Termux Core health is not healthy for the activated candidate")
          if core.get("layout") != "root-code-mode-host-v2":
              raise SystemExit("Termux Core layout is unexpected")
          if core.get("runtime", {}).get("status") != "healthy":
              raise SystemExit("Termux runtime health is not healthy")
          if core.get("code_mode_host", {}).get("status") != "healthy":
              raise SystemExit("code-mode host health is not healthy")
          upstream_status = upstream.get("status")
          if upstream_status not in {"healthy", "unhealthy"}:
              raise SystemExit("actual upstream doctor did not run")
          upstream_output = upstream.get("output")
          if not isinstance(upstream_output, str) or len(upstream_output.encode()) >= 32768:
              raise SystemExit("upstream diagnostic output is invalid or unbounded")
          manager_status = manager.get("status") if isinstance(manager, dict) else None
          if manager_status not in {"healthy", "unavailable", "unhealthy"}:
              raise SystemExit("manager doctor status is invalid for this proof")
          if upstream_status == "unhealthy" or manager_status == "unhealthy":
              expected_summary = "unhealthy"
          elif manager_status == "unavailable":
              expected_summary = "degraded"
          else:
              expected_summary = "healthy"
          actual_summary = summary.get("status") if isinstance(summary, dict) else None
          if actual_summary != expected_summary:
              raise SystemExit("doctor summary is inconsistent with component health")
          expected_rc = 0 if expected_summary == "healthy" else 1
          if rc != expected_rc:
              raise SystemExit("doctor exit status is inconsistent with diagnostic report")
          print(f"doctor_upstream_status={upstream_status}")
          print("doctor_termux_core_status=healthy")
          PY

          snapshot() {
            python3 - "$HOME/.local/share/codex/core" "$HOME/.local/lib/codex/core" "$PREFIX/bin/codex" <<'PY'
          import hashlib
          import os
          from pathlib import Path
          import sys
          for raw in sys.argv[1:]:
              root = Path(raw)
              if root.is_symlink():
                  print(f"L\t{root}\t{os.readlink(root)}")
                  continue
              if root.is_file():
                  print(f"F\t{root}\t{root.stat().st_mode & 0o7777:04o}\t{hashlib.sha256(root.read_bytes()).hexdigest()}")
                  continue
              if not root.is_dir():
                  print(f"M\t{root}")
                  continue
              for path in sorted(root.rglob('*')):
                  rel = path.relative_to(root)
                  if path.is_symlink():
                      print(f"L\t{root}\t{rel}\t{os.readlink(path)}")
                  elif path.is_file():
                      print(f"F\t{root}\t{rel}\t{path.stat().st_mode & 0o7777:04o}\t{hashlib.sha256(path.read_bytes()).hexdigest()}")
                  elif path.is_dir():
                      print(f"D\t{root}\t{rel}")
          PY
          }
          snapshot > "$RUNNER_TEMP/rald5-before-noop"
          "$PREFIX/bin/codex" update > "$RUNNER_TEMP/rald5-second-update.out"
          printf 'codex is already up to date (generation %s)\n' "$candidate" > "$RUNNER_TEMP/rald5-second-update.expected"
          cmp "$RUNNER_TEMP/rald5-second-update.expected" "$RUNNER_TEMP/rald5-second-update.out"
          snapshot > "$RUNNER_TEMP/rald5-after-noop"
          diff -u "$RUNNER_TEMP/rald5-before-noop" "$RUNNER_TEMP/rald5-after-noop"

      - name: Remove ephemeral bionic interpreter path
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if sudo test -e /system; then
            sudo rm -rf /system
          fi
          sudo test ! -e /system

  promote:
    name: CAS-promote signed stable index
    needs: [producer, verify_public]
    if: needs.producer.outputs.candidate == 'true' && needs.verify_public.result == 'success' && needs.producer.outputs.acceptance_gate != 'true' && needs.producer.outputs.publication_authorized == 'true' && needs.producer.outputs.negative_gate != 'true' && needs.producer.outputs.transition_stage != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Promote only after exact public proof
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          rm -rf publication-source
          git init publication-source
          git -C publication-source remote add origin https://github.com/humtr/codex.git
          git -C publication-source fetch --no-tags --depth=1 origin "$RALD5_SOURCE_SHA"
          git -C publication-source checkout --detach FETCH_HEAD
          test "$(git -C publication-source rev-parse HEAD)" = "$RALD5_SOURCE_SHA"
          python3 publication-source/.github/scripts/test_rald5_promotion.py

          expected='${{ needs.producer.outputs.expected_main_sha }}'
          generation='${{ needs.producer.outputs.generation_id }}'
          current='${{ needs.producer.outputs.current_generation }}'
          work="$RUNNER_TEMP/rald5-promote"
          rm -rf "$work"
          mkdir -p "$work"
          index_url="https://humtr.github.io/codex/$generation/update-index-v1"
          curl --fail --silent --show-error --location --proto '=https' --tlsv1.2 \
            --connect-timeout 15 --max-time 60 --output "$work/update-index-v1" "$index_url"
          curl --fail --silent --show-error --location --proto '=https' --tlsv1.2 \
            --connect-timeout 15 --max-time 60 --output "$work/update-index-v1.sig" "${index_url}.sig"
          curl --fail --silent --show-error --location --proto '=https' --tlsv1.2 \
            --connect-timeout 15 --max-time 60 --output "$work/update-public-key.pem" \
            "https://github.com/humtr/codex/releases/download/$current/update-public-key.pem"
          test "$(sha256sum "$work/update-public-key.pem" | awk '{print $1}')" = "$WRAPPER_PUBLIC_KEY_SHA256"
          openssl pkeyutl -verify -pubin -inkey "$work/update-public-key.pem" -rawin \
            -in "$work/update-index-v1" -sigfile "$work/update-index-v1.sig"
          test "$(awk -F '\t' '$1=="generation_id"{print $2}' "$work/update-index-v1")" = "$generation"
          test "$(awk -F '\t' '$1=="release_base"{print $2}' "$work/update-index-v1")" = \
            "https://humtr.github.io/codex/$generation/"

          before="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')"
          test "$before" = "$expected"
          base_tree="$(gh api "repos/$GITHUB_REPOSITORY/git/commits/$expected" --jq '.tree.sha')"
          index_blob="$(base64 -w0 "$work/update-index-v1" | \
            jq -Rs '{content:.,encoding:"base64"}' | \
            gh api --method POST "repos/$GITHUB_REPOSITORY/git/blobs" --input - --jq '.sha')"
          sig_blob="$(base64 -w0 "$work/update-index-v1.sig" | \
            jq -Rs '{content:.,encoding:"base64"}' | \
            gh api --method POST "repos/$GITHUB_REPOSITORY/git/blobs" --input - --jq '.sha')"
          new_tree="$(jq -n --arg base "$base_tree" --arg index "$index_blob" --arg sig "$sig_blob" \
            '{base_tree:$base,tree:[{path:"update-index-v1",mode:"100644",type:"blob",sha:$index},{path:"update-index-v1.sig",mode:"100644",type:"blob",sha:$sig}]}' | \
            gh api --method POST "repos/$GITHUB_REPOSITORY/git/trees" --input - --jq '.sha')"
          new_commit="$(jq -n --arg tree "$new_tree" --arg parent "$expected" --arg generation "$generation" \
            '{message:("release: promote " + $generation),tree:$tree,parents:[$parent]}' | \
            gh api --method POST "repos/$GITHUB_REPOSITORY/git/commits" --input - --jq '.sha')"

          set +e
          jq -n --arg sha "$new_commit" '{sha:$sha,force:false}' | \
            gh api --method PATCH "repos/$GITHUB_REPOSITORY/git/refs/heads/main" --input - \
            > "$work/ref-update.out" 2> "$work/ref-update.err"
          update_rc=$?
          set -e

          actual=''
          for attempt in 1 2 3; do
            if observed="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha' 2>/dev/null)" && \
              test "${#observed}" -eq 40; then
              actual="$observed"
              break
            fi
            sleep 2
          done
          test -n "$actual"
          python3 publication-source/.github/scripts/rald5_promotion.py \
            --expected "$expected" \
            --new-commit "$new_commit" \
            --actual "$actual" \
            --update-rc "$update_rc"

          served=false
          for attempt in $(seq 1 20); do
            if curl --fail --silent --show-error --location --proto '=https' --tlsv1.2 \
              --connect-timeout 15 --max-time 60 --output "$work/served-index" "$PUBLIC_INDEX_URL" && \
              curl --fail --silent --show-error --location --proto '=https' --tlsv1.2 \
              --connect-timeout 15 --max-time 60 --output "$work/served-index.sig" "${PUBLIC_INDEX_URL}.sig" && \
              cmp "$work/update-index-v1" "$work/served-index" && \
              cmp "$work/update-index-v1.sig" "$work/served-index.sig"; then
              served=true
              break
            fi
            sleep 5
          done
          test "$served" = true
          openssl pkeyutl -verify -pubin -inkey "$work/update-public-key.pem" -rawin \
            -in "$work/served-index" -sigfile "$work/served-index.sig"
