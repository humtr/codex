name: Termux Hosted Release Preflight (unsigned qualification)

on:
  workflow_dispatch:
    inputs:
      rald4_positive_gate:
        description: 'Run the bounded RALD-4 acceptance-only signing gate'
        required: false
        type: boolean
        default: false
      rald5_publication_authorized:
        description: 'Explicitly authorize public Release/Pages/promotion for this manual run; RALD-7 schedules authorize only ordinary newer stable'
        required: false
        type: boolean
        default: false
      rald5_same_version_acceptance:
        description: 'Bounded RALD-5 acceptance: republish exact official 0.154.0 through the full public path'
        required: false
        type: boolean
        default: false
      rald45_transition_stage:
        description: 'Stage/prove the backward-compatible RALD-4.5 transition generation without stable promotion'
        required: false
        type: boolean
        default: false
      rald45_transition_promote:
        description: 'Separately authorize stable promotion of the proved RALD-4.5 transition generation'
        required: false
        type: boolean
        default: false
      rald5_negative_gate:
        description: 'For an authorized publication candidate, fail public readback before promotion'
        required: false
        type: boolean
        default: false
      legacy_lag_jump_remediation:
        description: 'One-shot production remediation: exact 0.155.0 sequence-13 R10 direct-jump bridge'
        required: false
        type: boolean
        default: false
      ux1_same_version_deploy:
        description: 'One-shot production deployment: exact 0.155.1 sequence-14 to sequence-15 UX-1 Core correction'
        required: false
        type: boolean
        default: false
      update_progress_same_version_deploy:
        description: 'One-shot production deployment: exact 0.155.1 sequence-15 to sequence-16 animated progress responsiveness correction'
        required: false
        type: boolean
        default: false
      exact_current_fastpath_same_version_deploy:
        description: 'One-shot production deployment: exact 0.155.1 sequence-16 to sequence-17 exact-current fastpath correction'
        required: false
        type: boolean
        default: false
      no_emoji_same_version_deploy:
        description: 'One-shot production deployment: exact 0.155.1 sequence-17 to sequence-18 no-emoji output correction'
        required: false
        type: boolean
        default: false
      download_size_same_version_deploy:
        description: 'One-shot production deployment: exact 0.157.1 sequence-22 to sequence-23 authenticated download-size progress correction'
        required: false
        type: boolean
        default: false
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: termux-hosted-release-producer
  cancel-in-progress: false

env:
  CODEX_SOURCE_SHA: '053e35bee0cb044cd3dd1f1e2d835d0810766078'
  RALD5_SOURCE_SHA: '59308430d39dc3c57159e260e5f7a873c1b16b8d'
  RUST_VERSION: '1.98.0'
  ANDROID_API: '24'
  ANDROID_NDK_VERSION: '27.3.13750724'
  PUBLIC_INDEX_URL: 'https://raw.githubusercontent.com/humtr/codex/main/update-index-v1'
  UPSTREAM_LATEST_URL: 'https://releases.openai.com/codex/channels/latest'
  RALD4_ACCEPTANCE_BASELINE_VERSION: '0.153.4'
  RALD4_ACCEPTANCE_TARGET_VERSION: '0.154.0'
  RALD5_SAME_VERSION_ACCEPTANCE_VERSION: '0.154.0'
  LEGACY_LAG_REMEDIATION_VERSION: '0.155.0'
  LEGACY_LAG_REMEDIATION_CURRENT_GENERATION: 'local-hosted-0-155-0-566034e1aff4'
  LEGACY_LAG_REMEDIATION_CURRENT_SEQUENCE: '12'
  LEGACY_LAG_REMEDIATION_TARGET_SEQUENCE: '13'
  LEGACY_LAG_SOURCE_SHA: '0621105fd1be8461b370466fbfa981938241074d'
  LEGACY_LAG_VERSION: '0.153.4'
  LEGACY_LAG_ARCHIVE_SHA256: 'fc395cb043a1093ab0db34f44aba3199bfaa9ce640cd9be7fd588f44b0da64a4'
  LEGACY_LAG_GENERATION: 'legacy-lag-seq7-r10-01534'
  LEGACY_LAG_BUILD_ANDROID_API: '30'
  UX1_ACCEPTED_SOURCE_SHA: '07f77b89a177682954d80ae3f797377c4731de64'
  UX1_DEPLOY_VERSION: '0.155.1'
  UX1_DEPLOY_CURRENT_GENERATION: 'local-hosted-0-155-1-566034e1aff4'
  UX1_DEPLOY_CURRENT_SEQUENCE: '14'
  UX1_DEPLOY_TARGET_SEQUENCE: '15'
  UPDATE_PROGRESS_ACCEPTED_SOURCE_SHA: '81131655d98f114b5324bd8ee5866cff0a171941'
  UPDATE_PROGRESS_DEPLOY_VERSION: '0.155.1'
  UPDATE_PROGRESS_DEPLOY_CURRENT_GENERATION: 'local-hosted-0-155-1-07f77b89a177-ux1-human-output'
  UPDATE_PROGRESS_DEPLOY_CURRENT_SEQUENCE: '15'
  UPDATE_PROGRESS_DEPLOY_TARGET_SEQUENCE: '16'
  EXACT_CURRENT_FASTPATH_ACCEPTED_SOURCE_SHA: '7817b939c81ce15c76d3d0d57157ca5e378a8491'
  EXACT_CURRENT_FASTPATH_DEPLOY_VERSION: '0.155.1'
  EXACT_CURRENT_FASTPATH_DEPLOY_CURRENT_GENERATION: 'local-hosted-0-155-1-81131655d98f-update-progress-responsiveness'
  EXACT_CURRENT_FASTPATH_DEPLOY_CURRENT_SEQUENCE: '16'
  EXACT_CURRENT_FASTPATH_DEPLOY_TARGET_SEQUENCE: '17'
  NO_EMOJI_ACCEPTED_SOURCE_SHA: '9300a68852c879f4730e9191e46837cfab6745d9'
  NO_EMOJI_DEPLOY_VERSION: '0.155.1'
  NO_EMOJI_DEPLOY_CURRENT_GENERATION: 'local-hosted-0-155-1-7817b939c81c-exact-current-fastpath'
  NO_EMOJI_DEPLOY_CURRENT_SEQUENCE: '17'
  NO_EMOJI_DEPLOY_TARGET_SEQUENCE: '18'
  DOWNLOAD_SIZE_ACCEPTED_SOURCE_SHA: '4fd14ed8aafcf29602f43e00c314eb8da39a6e5f'
  DOWNLOAD_SIZE_DEPLOY_VERSION: '0.159.0'
  DOWNLOAD_SIZE_DEPLOY_CURRENT_GENERATION: 'local-hosted-0-159-0-b164e5b61cb4'
  DOWNLOAD_SIZE_DEPLOY_CURRENT_SEQUENCE: '23'
  DOWNLOAD_SIZE_DEPLOY_TARGET_SEQUENCE: '24'
  PROFILE_RELEASE_ACCEPTED_SOURCE_SHA: '59308430d39dc3c57159e260e5f7a873c1b16b8d'
  PROFILE_RELEASE_CURRENT_GENERATION: 'local-hosted-0-160-0-b7c1e61019b1-retired-server-discovery'
  PROFILE_RELEASE_CURRENT_SEQUENCE: '39'
  PROFILE_RELEASE_TARGET_SEQUENCE: '40'
  PROFILE_RELEASE_TARGET_VERSION: '0.160.0'
  PROFILE_RELEASE_TARGET_ARCHIVE_SHA256: '7f0fe42ff22ecfa3a47bc4a34f5b22c4218b431a4ec0aba51c7d98299f07900c'
  WRAPPER_PUBLIC_KEY_SHA256: '62ab1640b6b4e63afbd5952d11a0bd0a9f1cb78ddde2472e003a42c4db2b832c'
  ANDROID_RUNTIME_APEX_COMMIT: '8aeb37cca394ce39c1311744c60960cbd466aa77'
  ANDROID_RUNTIME_APEX_SHA256: '83bf0dce249728dae48149b80d28b48115c54adad95a352120d58a6ac669d1fc'

jobs:
  producer:
    name: Build unsigned Android/AArch64 candidate
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    outputs:
      candidate: ${{ steps.decision.outputs.candidate }}
      artifact_name: ${{ steps.decision.outputs.artifact_name }}
      qualified_artifact_name: ${{ steps.decision.outputs.qualified_artifact_name }}
      signed_artifact_name: ${{ steps.decision.outputs.signed_artifact_name }}
      generation_id: ${{ steps.decision.outputs.generation_id }}
      upstream_version: ${{ steps.decision.outputs.upstream_version }}
      acceptance_gate: ${{ steps.decision.outputs.acceptance_gate }}
      publication_authorized: ${{ steps.decision.outputs.publication_authorized }}
      same_version_acceptance: ${{ steps.decision.outputs.same_version_acceptance }}
      transition_stage: ${{ steps.decision.outputs.transition_stage }}
      transition_promote: ${{ steps.decision.outputs.transition_promote }}
      negative_gate: ${{ steps.decision.outputs.negative_gate }}
      legacy_lag_jump_remediation: ${{ steps.decision.outputs.legacy_lag_jump_remediation }}
      ux1_same_version_deploy: ${{ steps.decision.outputs.ux1_same_version_deploy }}
      update_progress_same_version_deploy: ${{ steps.decision.outputs.update_progress_same_version_deploy }}
      exact_current_fastpath_same_version_deploy: ${{ steps.decision.outputs.exact_current_fastpath_same_version_deploy }}
      no_emoji_same_version_deploy: ${{ steps.decision.outputs.no_emoji_same_version_deploy }}
      download_size_same_version_deploy: ${{ steps.decision.outputs.download_size_same_version_deploy }}
      profile_release_push_bridge: ${{ steps.decision.outputs.profile_release_push_bridge }}
      expected_main_sha: ${{ steps.stable.outputs.expected_main_sha }}
      current_generation: ${{ steps.stable.outputs.current_generation }}
      current_release_sequence: ${{ steps.stable.outputs.current_release_sequence }}
      release_sequence: ${{ steps.stable.outputs.release_sequence }}
    steps:
      - name: Fetch exact accepted source
        shell: bash
        run: |
          set -euo pipefail
          rm -rf source
          git init source
          git -C source remote add origin https://github.com/humtr/codex.git
          git -C source fetch --no-tags --depth=1 origin "$CODEX_SOURCE_SHA"
          git -C source checkout --detach FETCH_HEAD
          test "$(git -C source rev-parse HEAD)" = "$CODEX_SOURCE_SHA"
          test -z "$(git -C source status --porcelain)"

      - name: Verify source preflight helpers
        shell: bash
        run: |
          set -euo pipefail
          python3 source/.github/scripts/test_rald3_preflight.py
          python3 -m py_compile \
            source/.github/scripts/rald3_preflight.py \
            source/.github/scripts/test_rald3_preflight.py

      - name: Authenticate current public stable
        id: stable
        shell: bash
        run: |
          set -euo pipefail
          state="$RUNNER_TEMP/rald3-stable"
          rm -rf "$state"
          mkdir -p "$state"

          expected_main_sha="$(git ls-remote --exit-code https://github.com/humtr/codex.git refs/heads/main | awk '{print $1}')"
          test "${#expected_main_sha}" -eq 40
          case "$expected_main_sha" in (*[!0-9a-f]*) exit 1;; esac
          pinned_index_url="https://raw.githubusercontent.com/humtr/codex/${expected_main_sha}/update-index-v1"
          curl --fail --silent --show-error --location --proto '=https' --tlsv1.2 \
            --connect-timeout 15 --max-time 60 --max-filesize 16384 \
            --output "$state/update-index-v1" "$pinned_index_url"
          curl --fail --silent --show-error --location --proto '=https' --tlsv1.2 \
            --connect-timeout 15 --max-time 60 --max-filesize 1024 \
            --output "$state/update-index-v1.sig" "${pinned_index_url}.sig"
          test "$(wc -c < "$state/update-index-v1.sig")" -eq 64

          python3 source/.github/scripts/rald3_preflight.py \
            index "$state/update-index-v1" > "$state/index.untrusted"
          current_id="$(sed -n 's/^generation_id=//p' "$state/index.untrusted")"
          current_base="$(sed -n 's/^release_base=//p' "$state/index.untrusted")"
          test -n "$current_id"
          test "$current_base" = "https://humtr.github.io/codex/${current_id}/"

          curl --fail --silent --show-error --location --proto '=https' --tlsv1.2 \
            --connect-timeout 15 --max-time 60 --max-filesize 16384 \
            --output "$state/update-public-key.pem" \
            "https://github.com/humtr/codex/releases/download/${current_id}/update-public-key.pem"
          test "$(sha256sum "$state/update-public-key.pem" | awk '{print $1}')" = \
            "$WRAPPER_PUBLIC_KEY_SHA256"
          openssl pkeyutl -verify -pubin -inkey "$state/update-public-key.pem" -rawin \
            -in "$state/update-index-v1" -sigfile "$state/update-index-v1.sig"
          python3 source/.github/scripts/rald3_preflight.py \
            index "$state/update-index-v1" > "$state/index.authenticated"
          cmp "$state/index.untrusted" "$state/index.authenticated"

          curl --fail --silent --show-error --location --proto '=https' --tlsv1.2 \
            --connect-timeout 15 --max-time 60 --max-filesize 131072 \
            --output "$state/release.manifest" "${current_base}release.manifest"
          curl --fail --silent --show-error --location --proto '=https' --tlsv1.2 \
            --connect-timeout 15 --max-time 60 --max-filesize 1024 \
            --output "$state/release.sig" "${current_base}release.sig"
          curl --fail --silent --show-error --location --proto '=https' --tlsv1.2 \
            --connect-timeout 15 --max-time 60 --max-filesize 65536 \
            --output "$state/generation.meta" "${current_base}generation.meta"
          test "$(wc -c < "$state/release.sig")" -eq 64
          openssl pkeyutl -verify -pubin -inkey "$state/update-public-key.pem" -rawin \
            -in "$state/release.manifest" -sigfile "$state/release.sig"

          python3 source/.github/scripts/rald3_preflight.py manifest-entry \
            "$state/release.manifest" generation.meta > "$state/manifest-entry"
          test "$(sed -n 's/^generation_id=//p' "$state/manifest-entry")" = "$current_id"
          test "$(sed -n 's/^mode=//p' "$state/manifest-entry")" = '0644'
          test "$(sha256sum "$state/generation.meta" | awk '{print $1}')" = \
            "$(sed -n 's/^sha256=//p' "$state/manifest-entry")"
          python3 source/.github/scripts/rald3_preflight.py descriptor \
            "$state/generation.meta" > "$state/descriptor"
          test "$(sed -n 's/^generation_id=//p' "$state/descriptor")" = "$current_id"
          current_version="$(sed -n 's/^version=//p' "$state/descriptor")"
          current_sequence="$(sed -n 's/^release_sequence=//p' "$state/manifest-entry")"
          test -n "$current_version"
          test -n "$current_sequence"
          python3 source/.github/scripts/rald3_preflight.py next-sequence \
            "$current_sequence" > "$state/next-sequence"
          release_sequence="$(sed -n 's/^release_sequence=//p' "$state/next-sequence")"
          test -n "$release_sequence"
          printf 'current_version=%s\n' "$current_version" >> "$GITHUB_OUTPUT"
          printf 'expected_main_sha=%s\n' "$expected_main_sha" >> "$GITHUB_OUTPUT"
          printf 'current_generation=%s\n' "$current_id" >> "$GITHUB_OUTPUT"
          printf 'current_release_sequence=%s\n' "$current_sequence" >> "$GITHUB_OUTPUT"
          printf 'release_sequence=%s\n' "$release_sequence" >> "$GITHUB_OUTPUT"

      - name: Validate exact profile-lifecycle corrective inputs
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && github.event.before == '471590750468f6d99b520c3a8d47b03a474aacbb' && github.event.head_commit.message == 'release-profile-lifecycle-seq40-source-59308430' }}
        shell: bash
        run: |
          set -euo pipefail
          test "$CODEX_SOURCE_SHA" = "$PROFILE_RELEASE_ACCEPTED_SOURCE_SHA"
          test '${{ steps.stable.outputs.current_version }}' = "$PROFILE_RELEASE_TARGET_VERSION"
          test '${{ steps.stable.outputs.current_generation }}' = "$PROFILE_RELEASE_CURRENT_GENERATION"
          test '${{ steps.stable.outputs.current_release_sequence }}' = "$PROFILE_RELEASE_CURRENT_SEQUENCE"
          test '${{ steps.stable.outputs.release_sequence }}' = "$PROFILE_RELEASE_TARGET_SEQUENCE"
          state="$RUNNER_TEMP/profile-lifecycle-preflight"
          rm -rf "$state"
          mkdir -p "$state"
          curl --fail --silent --show-error --location --proto '=https' --tlsv1.2 \
            --connect-timeout 15 --max-time 60 --max-filesize 131072 \
            --output "$state/latest.json" "$UPSTREAM_LATEST_URL"
          python3 source/.github/scripts/rald3_preflight.py upstream "$state/latest.json" > "$state/upstream"
          test "$(sed -n 's/^version=//p' "$state/upstream")" = "$PROFILE_RELEASE_TARGET_VERSION"
          test "$(sed -n 's/^archive_sha256=//p' "$state/upstream")" = "$PROFILE_RELEASE_TARGET_ARCHIVE_SHA256"

      - name: Resolve official upstream stable
        id: decision
        shell: bash
        env:
          RALD4_POSITIVE_GATE: ${{ github.event_name == 'workflow_dispatch' && inputs.rald4_positive_gate }}
          PROFILE_RELEASE_PUSH_BRIDGE: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && github.event.before == '471590750468f6d99b520c3a8d47b03a474aacbb' && github.event.head_commit.message == 'release-profile-lifecycle-seq40-source-59308430' }}
          RALD5_PUBLICATION_AUTHORIZED: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.rald5_publication_authorized) || (github.event_name == 'push' && github.ref == 'refs/heads/main' && github.event.before == '471590750468f6d99b520c3a8d47b03a474aacbb' && github.event.head_commit.message == 'release-profile-lifecycle-seq40-source-59308430') }}
          RALD5_SAME_VERSION_ACCEPTANCE: ${{ github.event_name == 'workflow_dispatch' && inputs.rald5_same_version_acceptance }}
          RALD45_TRANSITION_STAGE: ${{ github.event_name == 'workflow_dispatch' && inputs.rald45_transition_stage }}
          RALD45_TRANSITION_PROMOTE: ${{ github.event_name == 'workflow_dispatch' && inputs.rald45_transition_promote }}
          RALD5_NEGATIVE_GATE: ${{ github.event_name == 'workflow_dispatch' && inputs.rald5_negative_gate }}
          LEGACY_LAG_JUMP_REMEDIATION: ${{ github.event_name == 'workflow_dispatch' && inputs.legacy_lag_jump_remediation }}
          UX1_SAME_VERSION_DEPLOY: ${{ github.event_name == 'workflow_dispatch' && inputs.ux1_same_version_deploy }}
          UPDATE_PROGRESS_SAME_VERSION_DEPLOY: ${{ github.event_name == 'workflow_dispatch' && inputs.update_progress_same_version_deploy }}
          EXACT_CURRENT_FASTPATH_SAME_VERSION_DEPLOY: ${{ github.event_name == 'workflow_dispatch' && inputs.exact_current_fastpath_same_version_deploy }}
          NO_EMOJI_SAME_VERSION_DEPLOY: ${{ github.event_name == 'workflow_dispatch' && inputs.no_emoji_same_version_deploy }}
          DOWNLOAD_SIZE_SAME_VERSION_DEPLOY: ${{ github.event_name == 'workflow_dispatch' && inputs.download_size_same_version_deploy }}
        run: |
          set -euo pipefail
          state="$RUNNER_TEMP/rald3-upstream"
          rm -rf "$state"
          mkdir -p "$state"
          curl --fail --silent --show-error --location --proto '=https' --tlsv1.2 \
            --connect-timeout 15 --max-time 60 --max-filesize 131072 \
            --output "$state/latest.json" "$UPSTREAM_LATEST_URL"
          python3 source/.github/scripts/rald3_preflight.py upstream \
            "$state/latest.json" > "$state/upstream"
          upstream_version="$(sed -n 's/^version=//p' "$state/upstream")"
          archive_sha256="$(sed -n 's/^archive_sha256=//p' "$state/upstream")"

          comparison_version='${{ steps.stable.outputs.current_version }}'
          acceptance_suffix=''
          if test "$RALD4_POSITIVE_GATE" = true; then
            test "$GITHUB_EVENT_NAME" = workflow_dispatch
            test "$GITHUB_REF" = refs/heads/rewrite/rust-core
            test '${{ steps.stable.outputs.current_version }}' = "$RALD4_ACCEPTANCE_TARGET_VERSION"
            test "$upstream_version" = "$RALD4_ACCEPTANCE_TARGET_VERSION"
            comparison_version="$RALD4_ACCEPTANCE_BASELINE_VERSION"
            acceptance_suffix='-acceptance'
            printf 'RALD-4 acceptance-only comparison baseline %s; authenticated public stable remains %s\n' \
              "$comparison_version" '${{ steps.stable.outputs.current_version }}'
          fi

          python3 source/.github/scripts/rald3_preflight.py compare \
            "$comparison_version" "$upstream_version" > "$state/decision"
          candidate="$(sed -n 's/^candidate=//p' "$state/decision")"
          test "$candidate" = true -o "$candidate" = false
          test "$RALD5_PUBLICATION_AUTHORIZED" = true -o "$RALD5_PUBLICATION_AUTHORIZED" = false
          test "$RALD5_SAME_VERSION_ACCEPTANCE" = true -o "$RALD5_SAME_VERSION_ACCEPTANCE" = false
          test "$RALD45_TRANSITION_STAGE" = true -o "$RALD45_TRANSITION_STAGE" = false
          test "$RALD45_TRANSITION_PROMOTE" = true -o "$RALD45_TRANSITION_PROMOTE" = false
          test "$RALD5_NEGATIVE_GATE" = true -o "$RALD5_NEGATIVE_GATE" = false
          test "$LEGACY_LAG_JUMP_REMEDIATION" = true -o "$LEGACY_LAG_JUMP_REMEDIATION" = false
          test "$UX1_SAME_VERSION_DEPLOY" = true -o "$UX1_SAME_VERSION_DEPLOY" = false
          test "$UPDATE_PROGRESS_SAME_VERSION_DEPLOY" = true -o "$UPDATE_PROGRESS_SAME_VERSION_DEPLOY" = false
          test "$EXACT_CURRENT_FASTPATH_SAME_VERSION_DEPLOY" = true -o "$EXACT_CURRENT_FASTPATH_SAME_VERSION_DEPLOY" = false
          test "$NO_EMOJI_SAME_VERSION_DEPLOY" = true -o "$NO_EMOJI_SAME_VERSION_DEPLOY" = false
          test "$DOWNLOAD_SIZE_SAME_VERSION_DEPLOY" = true -o "$DOWNLOAD_SIZE_SAME_VERSION_DEPLOY" = false
          test "$PROFILE_RELEASE_PUSH_BRIDGE" = true -o "$PROFILE_RELEASE_PUSH_BRIDGE" = false
          if test "$GITHUB_EVENT_NAME" = push; then
            test "$PROFILE_RELEASE_PUSH_BRIDGE" = true
          fi
          if test "$PROFILE_RELEASE_PUSH_BRIDGE" = true; then
            test "$GITHUB_EVENT_NAME" = push
            test "$GITHUB_REF" = refs/heads/main
            test "$RALD5_PUBLICATION_AUTHORIZED" = true
            test "$RALD4_POSITIVE_GATE" != true
            test "$RALD5_SAME_VERSION_ACCEPTANCE" != true
            test "$RALD45_TRANSITION_STAGE" != true
            test "$RALD45_TRANSITION_PROMOTE" != true
            test "$RALD5_NEGATIVE_GATE" != true
            test "$LEGACY_LAG_JUMP_REMEDIATION" != true
            test "$UX1_SAME_VERSION_DEPLOY" != true
            test "$UPDATE_PROGRESS_SAME_VERSION_DEPLOY" != true
            test "$EXACT_CURRENT_FASTPATH_SAME_VERSION_DEPLOY" != true
            test "$NO_EMOJI_SAME_VERSION_DEPLOY" != true
            test "$DOWNLOAD_SIZE_SAME_VERSION_DEPLOY" != true
            test "$CODEX_SOURCE_SHA" = "$PROFILE_RELEASE_ACCEPTED_SOURCE_SHA"
            test '${{ steps.stable.outputs.current_version }}' = "$PROFILE_RELEASE_TARGET_VERSION"
            test "$upstream_version" = "$PROFILE_RELEASE_TARGET_VERSION"
            test '${{ steps.stable.outputs.current_version }}' = "$upstream_version"
            test '${{ steps.stable.outputs.current_generation }}' = "$PROFILE_RELEASE_CURRENT_GENERATION"
            test '${{ steps.stable.outputs.current_release_sequence }}' = "$PROFILE_RELEASE_CURRENT_SEQUENCE"
            test '${{ steps.stable.outputs.release_sequence }}' = "$PROFILE_RELEASE_TARGET_SEQUENCE"
            test "$archive_sha256" = "$PROFILE_RELEASE_TARGET_ARCHIVE_SHA256"
            test "$candidate" = false
            candidate=true
            acceptance_suffix='-profile-lifecycle'
            printf 'profile-lifecycle same-version corrective selected: %s sequence %s -> sequence %s\n' \
              "$upstream_version" "$PROFILE_RELEASE_CURRENT_SEQUENCE" "$PROFILE_RELEASE_TARGET_SEQUENCE"
          fi
          if test "$RALD4_POSITIVE_GATE" = true; then
            test "$candidate" = true
            test "$RALD5_PUBLICATION_AUTHORIZED" != true
            test "$RALD5_SAME_VERSION_ACCEPTANCE" != true
            test "$RALD45_TRANSITION_STAGE" != true
            test "$RALD45_TRANSITION_PROMOTE" != true
            test "$RALD5_NEGATIVE_GATE" != true
            test "$LEGACY_LAG_JUMP_REMEDIATION" != true
            test "$UX1_SAME_VERSION_DEPLOY" != true
            test "$UPDATE_PROGRESS_SAME_VERSION_DEPLOY" != true
            test "$EXACT_CURRENT_FASTPATH_SAME_VERSION_DEPLOY" != true
            test "$NO_EMOJI_SAME_VERSION_DEPLOY" != true
            test "$DOWNLOAD_SIZE_SAME_VERSION_DEPLOY" != true
          fi
          if test "$RALD5_PUBLICATION_AUTHORIZED" = true; then
            case "$GITHUB_EVENT_NAME" in
              workflow_dispatch)
                ;;
              push)
                test "$PROFILE_RELEASE_PUSH_BRIDGE" = true
                ;;
              schedule)
                test "$RALD4_POSITIVE_GATE" != true
                test "$RALD5_SAME_VERSION_ACCEPTANCE" != true
                test "$RALD45_TRANSITION_STAGE" != true
                test "$RALD45_TRANSITION_PROMOTE" != true
