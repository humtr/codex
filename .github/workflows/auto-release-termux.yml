      - name: Cross-build Core and Manager
        if: steps.decision.outputs.candidate == 'true'
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install "$RUST_VERSION" --profile minimal --target aarch64-linux-android
          ndk="$ANDROID_SDK_ROOT/ndk/$ANDROID_NDK_VERSION"
          toolchain="$ndk/toolchains/llvm/prebuilt/linux-x86_64/bin"
          linker="$toolchain/aarch64-linux-android${ANDROID_API}-clang"
          test -x "$linker"
          test -x "$toolchain/llvm-ar"
          cd source
          export CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER="$linker"
          export CC_aarch64_linux_android="$linker"
          export AR_aarch64_linux_android="$toolchain/llvm-ar"
          cargo "+$RUST_VERSION" build --release --locked --target aarch64-linux-android \
            -p codex -p codex-manager
          cargo "+$RUST_VERSION" build --release --locked -p codex-release-builder

      - name: Fetch, adapt, and qualify unsigned candidate
        if: steps.decision.outputs.candidate == 'true'
        shell: bash
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/rald3-candidate"
          rm -rf "$work"
          mkdir -p "$work"
          builder="$GITHUB_WORKSPACE/source/target/release/codex-release-builder"
          core="$GITHUB_WORKSPACE/source/target/aarch64-linux-android/release/codex"
          manager="$GITHUB_WORKSPACE/source/target/aarch64-linux-android/release/codex-manager"
          upstream_version='${{ steps.decision.outputs.upstream_version }}'
          archive_sha256='${{ steps.decision.outputs.archive_sha256 }}'
          generation_id='${{ steps.decision.outputs.generation_id }}'
          # The signed R10 activation bridge signal is required on every public
          # stable candidate until the compatibility floor moves past retained R10.
          transition_args=(--legacy-activation-doctor-unsupported)
          fetch_output="$($builder fetch \
            --version "$upstream_version" \
            --curl /usr/bin/curl \
            --openssl /usr/bin/openssl \
            --output "$work/upstream.tar.gz")"
          fetched_sha256="$(printf '%s\n' "$fetch_output" | awk -F '\t' '$1=="archive_sha256"{print $2}')"
          test "$fetched_sha256" = "$archive_sha256"

          "$builder" build \
            --version "$upstream_version" \
            --archive "$work/upstream.tar.gz" \
            --archive-sha256 "$archive_sha256" \
            --generation-id "$generation_id" \
            --core "$core" \
            --manager "$manager" \
            --defer-manager-probe \
            "${transition_args[@]}" \
            --creation-metadata r10-browser-helper-bridge-v1 \
            --gzip /usr/bin/gzip \
            --openssl /usr/bin/openssl \
            --output "$work/candidate"

          python3 source/.github/scripts/rald3_preflight.py candidate \
            "$work/candidate" "$upstream_version"
          test "$(awk -F '\t' '$1=="creation_metadata"{print $2}' "$work/candidate/generation.meta")" = r10-browser-helper-bridge-v1
          doctor_capability="$(awk -F '\t' '$1=="upstream_doctor"{print $2}' "$work/candidate/generation.meta")"
          test "$doctor_capability" = unsupported
          find "$work/candidate" -type f -printf '%P\n' | LC_ALL=C sort > "$work/actual-files"
          cat > "$work/expected-files" <<'EOF'
          .manager-probe-deferred
          codex-code-mode-host
          core
          generation.meta
          helpers/0
          helpers/1
          manager
          runtime
          EOF
          diff -u "$work/expected-files" "$work/actual-files"
          for executable in codex-code-mode-host core helpers/0 helpers/1 manager runtime; do
            test -f "$work/candidate/$executable"
            test ! -L "$work/candidate/$executable"
            test "$(stat -c '%a' "$work/candidate/$executable")" = '755'
          done


      - name: Require exact sequence-12 component bytes for legacy-lag remediation
        if: steps.decision.outputs.legacy_lag_jump_remediation == 'true'
        shell: bash
        run: |
          set -euo pipefail
          stable="$RUNNER_TEMP/rald3-stable"
          candidate="$RUNNER_TEMP/rald3-candidate/candidate"
          for rel in codex-code-mode-host core helpers/0 helpers/1 manager runtime; do
            entry="$RUNNER_TEMP/legacy-lag-entry-${rel//\//-}"
            python3 source/.github/scripts/rald3_preflight.py manifest-entry \
              "$stable/release.manifest" "$rel" > "$entry"
            expected_digest="$(sed -n 's/^sha256=//p' "$entry")"
            expected_mode="$(sed -n 's/^mode=//p' "$entry")"
            test "$(sha256sum "$candidate/$rel" | awk '{print $1}')" = "$expected_digest"
            test "0$(stat -c '%a' "$candidate/$rel")" = "$expected_mode"
          done
          python3 - "$stable/generation.meta" "$candidate/generation.meta" \
            "$LEGACY_LAG_REMEDIATION_CURRENT_GENERATION" \
            '${{ steps.decision.outputs.generation_id }}' <<'PY'
          from pathlib import Path
          import sys

          current_path = Path(sys.argv[1])
          candidate_path = Path(sys.argv[2])
          current_id = sys.argv[3]
          candidate_id = sys.argv[4]
          current = current_path.read_text()
          candidate = candidate_path.read_text()
          old_id = f"generation_id\t{current_id}\n"
          new_id = f"generation_id\t{candidate_id}\n"
          marker = "creation_metadata\tr10-browser-helper-bridge-v1\n"
          old_doctor = "upstream_doctor\tsupported\n"
          new_doctor = "upstream_doctor\tunsupported\n"
          if current.count(old_id) != 1 or candidate.count(new_id) != 1:
              raise SystemExit("generation identity binding is not unique")
          if current.count(marker) != 1 or candidate.count(marker) != 1:
              raise SystemExit("R10 bridge marker is not exact")
          if current.count(old_doctor) != 1 or candidate.count(new_doctor) != 1:
              raise SystemExit("legacy activation doctor transition is not exact")
          expected = current.replace(old_id, new_id, 1).replace(old_doctor, new_doctor, 1)
          if expected != candidate:
              raise SystemExit("sequence-13 descriptor changes more than generation identity and legacy doctor signal")
          PY

      - name: Require exact sequence-14 non-Core bytes for UX-1 deployment
        if: steps.decision.outputs.ux1_same_version_deploy == 'true'
        shell: bash
        run: |
          set -euo pipefail
          stable="$RUNNER_TEMP/rald3-stable"
          candidate="$RUNNER_TEMP/rald3-candidate/candidate"
          for rel in codex-code-mode-host helpers/0 helpers/1 manager runtime; do
            entry="$RUNNER_TEMP/ux1-entry-${rel//\//-}"
