name: RALD-7 upstream archive layout probe

on:
  push:
    branches:
      - rewrite/rust-core
    paths:
      - .github/workflows/rald7-upstream-layout-probe.yml

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      EXPECTED_PARENT: '78b60745b8b8cead42c654da98d3cc1830d3f683'
      ACCEPTED_SOURCE: '9972a3288c0531ba744e9bd1356273d9a080aa79'
    steps:
      - name: Bind source and inspect authenticated official archive
        shell: bash
        run: |
          set -euo pipefail
          git init trigger
          git -C trigger remote add origin "https://github.com/$GITHUB_REPOSITORY.git"
          git -C trigger fetch --no-tags --depth=2 origin "$GITHUB_SHA"
          git -C trigger checkout --detach FETCH_HEAD
          test "$(git -C trigger rev-parse HEAD^)" = "$EXPECTED_PARENT"

          git init source
          git -C source remote add origin "https://github.com/$GITHUB_REPOSITORY.git"
          git -C source fetch --no-tags --depth=1 origin "$ACCEPTED_SOURCE"
          git -C source checkout --detach FETCH_HEAD
          test "$(git -C source rev-parse HEAD)" = "$ACCEPTED_SOURCE"

          work="$RUNNER_TEMP/rald7-layout"
          mkdir -p "$work"
          curl --fail --silent --show-error --location --proto '=https' --tlsv1.2             --connect-timeout 15 --max-time 60 --max-filesize 131072             --output "$work/latest.json"             'https://releases.openai.com/codex/channels/latest'
          python3 source/.github/scripts/rald3_preflight.py upstream             "$work/latest.json" > "$work/upstream"
          version="$(sed -n 's/^version=//p' "$work/upstream")"
          digest="$(sed -n 's/^archive_sha256=//p' "$work/upstream")"
          test -n "$version"
          test -n "$digest"
          printf 'official_version=%s\n' "$version"
          printf 'official_archive_sha256=%s\n' "$digest"

          url="https://releases.openai.com/codex/releases/$version/codex-package-aarch64-unknown-linux-musl.tar.gz"
          curl --fail --silent --show-error --location --proto '=https' --tlsv1.2             --connect-timeout 15 --max-time 300 --max-filesize 536870912             --output "$work/package.tar.gz" "$url"
          test "$(sha256sum "$work/package.tar.gz" | awk '{print $1}')" = "$digest"
          test "$(stat -c '%s' "$work/package.tar.gz")" -lt 536870912

          tar -tzf "$work/package.tar.gz" > "$work/paths"
          test "$(wc -l < "$work/paths")" -le 256
          printf '%s\n' '--- official archive paths ---'
          cat "$work/paths"
          printf '%s\n' '--- package manifests ---'
          while IFS= read -r path; do
            case "$path" in
              */codex-package.json|codex-package.json)
                printf 'path=%s\n' "$path"
                tar -xOzf "$work/package.tar.gz" "$path"
                ;;
            esac
          done < "$work/paths"

          mkdir -p "$work/extract"
          tar -xzf "$work/package.tar.gz" -C "$work/extract"             bin/codex bin/codex-code-mode-host
          file "$work/extract/bin/codex" "$work/extract/bin/codex-code-mode-host"
          readelf -h "$work/extract/bin/codex" | grep -E 'Class:|Data:|Type:|Machine:'
          readelf -l "$work/extract/bin/codex" | grep -F INTERP && exit 1 || :
          readelf -l "$work/extract/bin/codex-code-mode-host" | grep -F INTERP && exit 1 || :
          python3 - "$work/extract/bin/codex" <<'PY'
          from pathlib import Path
          import sys
          data = Path(sys.argv[1]).read_bytes()
          for value in [
              b"/etc/resolv.conf",
              b"/etc/codex/config.toml",
              b"/etc/codex/requirements.toml",
              b"/etc/codex/managed_config.toml",
          ]:
              print(f"patch_source_count={value.decode()}:{data.count(value)}")
          PY
