name: Manager TUI native qualification
on:
  workflow_dispatch:
    inputs:
      mutation_check:
        description: Verify catalog and local-provider login regressions with disposable source faults
        type: boolean
        default: false
      native_transition_mutation_check:
        description: Verify route catalog, runtime binding and live-resume persistence with disposable faults
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: manager-tui-native
  cancel-in-progress: false
jobs:
  upstream-baseline:
    name: Build and test native switch selection
    runs-on: ubuntu-24.04-arm
    # Baseline plus four independent TUI mutation rebuilds and restored-source gates.
    timeout-minutes: 120
    env:
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_DEV_INCREMENTAL: 'false'
      CARGO_PROFILE_DEV_OPT_LEVEL: '1'
      CARGO_PROFILE_TEST_OPT_LEVEL: '0'
      CARGO_PROFILE_RELEASE_OPT_LEVEL: 'z'
      CARGO_PROFILE_RELEASE_CODEGEN_UNITS: '1'
      CARGO_PROFILE_RELEASE_STRIP: 'symbols'
      CARGO_BUILD_JOBS: '3'
      CODEX_PROFILE_CORE: ''
    steps:
      - name: Fetch exact frontend authority
        shell: bash
        run: |
          set -euo pipefail
          git init experiment
          git -C experiment remote add origin "https://github.com/$GITHUB_REPOSITORY.git"
          git -C experiment fetch --no-tags --depth=1 origin "$GITHUB_SHA"
          git -C experiment checkout --detach FETCH_HEAD
          test "$(git -C experiment rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git -C experiment status --porcelain)"
      - name: Load exact release input authority
        shell: bash
        run: |
          set -euo pipefail
          python3 experiment/.github/scripts/upstream_release.py experiment/release/upstream.json --component frontend >> "$GITHUB_ENV"
      - name: Fetch exact unmodified official source
        shell: bash
        run: |
          set -euo pipefail
          git init upstream
          git -C upstream remote add origin https://github.com/openai/codex.git
          git -C upstream fetch --no-tags --depth=1 origin "$UPSTREAM_SHA"
          git -C upstream checkout --detach FETCH_HEAD
          patch_base="$(cat experiment/frontend/manager-tui/upstream-base)"
          [[ "$patch_base" =~ ^[0-9a-f]{40}$ ]]
          git -C upstream fetch --no-tags --depth=1 origin "$patch_base"
          test "$(git -C upstream rev-parse HEAD)" = "$UPSTREAM_SHA"
          test -z "$(git -C upstream status --porcelain)"
      - name: Provision ephemeral source build tools
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install "$RUST_VERSION" --profile minimal --component rustfmt,clippy --target aarch64-unknown-linux-musl
          test "$(uname -m)" = aarch64
      - name: Install official release Zig toolchain
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/zig-linux-aarch64-0.14.0.tar.xz"
          curl --fail --silent --show-error https://ziglang.org/download/0.14.0/zig-linux-aarch64-0.14.0.tar.xz -o "$archive"
          echo "ab64e3ea277f6fc5f3d723dcd95d9ce1ab282c8ed0f431b4de880d30df891e4f  $archive" | sha256sum -c -
          tar -xJf "$archive" -C "$RUNNER_TEMP"
          tool="$RUNNER_TEMP/zig-linux-aarch64-0.14.0"
          test "$("$tool/zig" version)" = 0.14.0
          echo "$tool" >> "$GITHUB_PATH"
      - name: Use exact upstream musl native dependency tooling
        shell: bash
        env:
          TARGET: aarch64-unknown-linux-musl
          APT_UPDATE_ARGS: -qq
          APT_INSTALL_ARGS: --no-install-recommends
          OPENSSL_BUILD_JOBS: '3'
        run: |
          set -euo pipefail
          bash upstream/.github/scripts/install-musl-build-tools.sh
          echo 'AWS_LC_SYS_NO_JITTER_ENTROPY=1' >> "$GITHUB_ENV"
          echo 'AWS_LC_SYS_NO_JITTER_ENTROPY_aarch64_unknown_linux_musl=1' >> "$GITHUB_ENV"
      - name: Restore isolated frontend compile cache
        id: compile-cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            upstream/codex-rs/target
          key: profile-tui-display-aarch64-musl-${{ env.RUST_VERSION }}-${{ env.UPSTREAM_SHA }}-${{ github.sha }}
          restore-keys: |
            profile-tui-display-aarch64-musl-${{ env.RUST_VERSION }}-${{ env.UPSTREAM_SHA }}-
            profile-tui-display-aarch64-musl-1.95.0-97901140-
      - name: Build shared Rust source preparation and normalize release versions
        shell: bash
        run: |
          set -euo pipefail
          PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s experiment/frontend/manager-tui -p 'test_*.py'
          CARGO_TARGET_DIR="$RUNNER_TEMP/source-tools" cargo "+$RUST_VERSION" build \
            --manifest-path experiment/Cargo.toml --release --locked -p codex-release-builder
          builder="$RUNNER_TEMP/source-tools/release/codex-release-builder"
          "$builder" prepare-source --source "$GITHUB_WORKSPACE/upstream" \
            --version "$UPSTREAM_VERSION" --source-sha "$UPSTREAM_SHA" --frontend provided \
            > "$RUNNER_TEMP/profile-tui-native-preparation.json"
          "$builder" normalize-lock --source "$GITHUB_WORKSPACE/upstream/codex-rs" \
            --openssl /usr/bin/openssl --audit "$RUNNER_TEMP/profile-tui-lock-audit.json"
      - name: Apply bounded native profile patch
        shell: bash
        run: |
          set -euo pipefail
          python3 experiment/frontend/manager-tui/check_command_boundary.py upstream
          pristine="$RUNNER_TEMP/profile-tui-pristine/codex-rs/tui/src"
          mkdir -p "$pristine"
          cp upstream/codex-rs/tui/src/slash_command.rs "$pristine/slash_command.rs"
          python3 experiment/frontend/manager-tui/apply.py upstream --native-preparation "$RUNNER_TEMP/profile-tui-native-preparation.json"
          python3 experiment/frontend/manager-tui/check_command_boundary.py "$RUNNER_TEMP/profile-tui-pristine" --patched upstream
          git -C upstream diff --check
          python3 experiment/frontend/manager-tui/apply.py upstream --check-scope --native-preparation "$RUNNER_TEMP/profile-tui-native-preparation.json"
      - name: Preserve freshness of byte-identical upstream packages
        shell: bash
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/source-tools/release/codex-release-builder" preserve-source-times \
            --source "$GITHUB_WORKSPACE/upstream"
          git -C upstream diff --check
      - name: Provision pinned upstream test and formatting tools
        shell: bash
        run: |
          set -euo pipefail
          tools="$RUNNER_TEMP/profile-test-tools"
          mkdir -p "$tools"
          acquire() {
            local url="$1" digest="$2" name="$3"
            curl --location --fail --silent --show-error "$url" -o "$tools/$name.tar.gz"
            echo "$digest  $tools/$name.tar.gz" | sha256sum -c -
            mkdir "$tools/$name"
            tar -xzf "$tools/$name.tar.gz" -C "$tools/$name"
            find "$tools/$name" -type f -name "$name" -exec cp {} "$tools/$name-bin" \;
            test -x "$tools/$name-bin"
            mkdir -p "$tools/bin"
            cp "$tools/$name-bin" "$tools/bin/$name"
          }
          acquire https://github.com/casey/just/releases/download/1.51.0/just-1.51.0-aarch64-unknown-linux-musl.tar.gz ed7ec466b77709198fd4afed253dba0270203ba5eb1c006bee2b0139090284f5 just
          acquire https://github.com/nextest-rs/nextest/releases/download/cargo-nextest-0.9.146/cargo-nextest-0.9.146-aarch64-unknown-linux-musl.tar.gz 62ae8b4ad034704f67417f8ed8b897566d82359ab44952729b925fb37eeb7622 cargo-nextest
          acquire https://github.com/facebook/dotslash/releases/download/v0.5.9/dotslash-linux-musl.aarch64.tar.gz 11323ef72fac5885d7c54bff70d666486bd800a8d908d0acd3bd838fd8a9b0db dotslash
          acquire https://github.com/astral-sh/uv/releases/download/0.12.23/uv-aarch64-unknown-linux-gnu.tar.gz 6524bd338177ed50d035d39354e12545e993bbeba2ecbddf0480c5b3a81d313f uv
          echo "$tools/bin" >> "$GITHUB_PATH"
      - name: Format and inspect native profile scope
        id: native-format
        shell: bash
        run: |
          set -euo pipefail
          cd upstream
          just fmt
          git diff --check
          git add -N codex-rs/tui
          git diff -- codex-rs > "$RUNNER_TEMP/profile-tui-formatted.patch"
          python3 ../experiment/frontend/manager-tui/apply.py . --check-scope --native-preparation "$RUNNER_TEMP/profile-tui-native-preparation.json"
      - name: Verify generated Native protocol contracts
        shell: bash
        run: |
          set -euo pipefail
          cd upstream
          export CODEX_APP_SERVER_SCHEMA_ROOT="$RUNNER_TEMP/native-protocol-schema"
          for experimental in 0 1; do
            CODEX_APP_SERVER_SCHEMA_EXPERIMENTAL="$experimental" just test --retries 0 --locked --target aarch64-unknown-linux-musl -p codex-app-server-protocol --lib --run-ignored only -E 'test(=schema_fixtures_tests::write_schema_fixtures_from_env)' 2>&1 | tee "$RUNNER_TEMP/native-provider-schema-$experimental.log"
          done
          tar -czf "$RUNNER_TEMP/native-protocol-generated.tar.gz" -C "$CODEX_APP_SERVER_SCHEMA_ROOT" .
          diff -rq codex-rs/app-server-protocol/schema "$CODEX_APP_SERVER_SCHEMA_ROOT" | tee "$RUNNER_TEMP/native-provider-schema-diff.log"
      - name: Verify Native per-thread provider transitions
        shell: bash
        run: |
          set -euo pipefail
          cd upstream
          # Reuse upstream test runner, profile and stack settings from its justfile.
          mkdir -p "$RUNNER_TEMP/native-interface-sockets"
          exec 35<"$RUNNER_TEMP/native-interface-sockets"
          just test --retries 0 --locked --target aarch64-unknown-linux-musl -p codex-app-server --test all -E 'test(model_provider) | test(thread_resume_checkpoints_settings) | test(thread_resume_does_not_checkpoint_unchanged_settings) | test(thread_resume_with_overrides_preserves_recency) | test(thread_archive_without_turns) | test(thread_read_loaded_include_turns_reads_store_history_without_rollout_path) | test(thread_read_can_include_turns) | test(thread_read_include_turns_rejects_unmaterialized_loaded_thread)' 2>&1 | tee "$RUNNER_TEMP/native-provider-api.log"
          just test --retries 0 --locked --target aarch64-unknown-linux-musl -p codex-app-server --test all -E 'test(initialize)' 2>&1 | tee "$RUNNER_TEMP/native-provider-initialize.log"
          for scope in model_provider compact guardian; do
            just test --retries 0 --locked --target aarch64-unknown-linux-musl -p codex-core --lib -E "test($scope)" 2>&1 | tee "$RUNNER_TEMP/native-provider-core-$scope.log"
          done
          just test --retries 0 --locked --target aarch64-unknown-linux-musl -p codex-app-server-client --lib 2>&1 | tee "$RUNNER_TEMP/native-provider-client.log"
          just test --retries 0 --locked --target aarch64-unknown-linux-musl -p codex-app-server --lib -E 'test(provider_tests)' 2>&1 | tee "$RUNNER_TEMP/native-provider-config.log"
          python3 - <<'PYTHON'
          import os, re
          from pathlib import Path
          root = Path(os.environ['RUNNER_TEMP'])
          for name in ['core-model_provider', 'core-compact', 'core-guardian', 'client', 'config', 'api', 'initialize']:
              text = (root / f'native-provider-{name}.log').read_text()
              text = re.sub(r'\x1b\[[0-?]*[ -/]*[@-~]', '', text)
              summary = re.search(r'Summary\s*\[[^\]]+\]\s*([1-9][0-9]*) tests? run: ([1-9][0-9]*) passed(?: \([1-9][0-9]* slow\))?(?:, [0-9]+ skipped)?\s*$', text)
              assert summary and summary[1] == summary[2], name + ': required tests did not pass'
          PYTHON
      - name: Build actual patched CLI with pinned external dependencies
        shell: bash
        run: |
          set -euo pipefail
          cd upstream/codex-rs
          cargo "+$RUST_VERSION" build --release --locked --target aarch64-unknown-linux-musl -p codex-cli --bin codex
          git diff --check
      - name: Execute and identify native frontend
        shell: bash
        run: |
          set -euo pipefail
          binary="$GITHUB_WORKSPACE/upstream/codex-rs/target/aarch64-unknown-linux-musl/release/codex"
          test -x "$binary"
          file "$binary" | grep -F 'ARM aarch64'
          if readelf -l "$binary" | grep -F INTERP; then exit 1; fi
          root="$RUNNER_TEMP/manager-tui-native"
          mkdir -p "$root/home" "$root/home/.codex" "$root/tmp" "$root/artifact"
          chmod 0700 "$root/home" "$root/home/.codex" "$root/tmp"
          env -i HOME="$root/home" CODEX_HOME="$root/home/.codex" TMPDIR="$root/tmp" PATH=/usr/bin:/bin "$binary" --version > "$root/artifact/version.txt"
          env -i HOME="$root/home" CODEX_HOME="$root/home/.codex" TMPDIR="$root/tmp" PATH=/usr/bin:/bin "$binary" --help > "$root/artifact/help.txt"
          printf 'codex-cli %s\n' "$UPSTREAM_VERSION" > "$root/version.expected"
          cmp "$root/version.expected" "$root/artifact/version.txt"
          printf 'codex-termux-resolved-startup-v1\n' > "$root/capability.expected"
          # Invalid user configuration must not be loaded by the static query.
          printf 'not valid toml = [\n' > "$root/home/.codex/config.toml"
          env -i HOME="$root/home" CODEX_HOME="$root/home/.codex" TMPDIR="$root/tmp" PATH=/usr/bin:/bin TERM=xterm-256color "$binary" --termux-backend-capabilities > "$root/capability.actual"
          cmp "$root/capability.expected" "$root/capability.actual"
          test ! -e "$root/home/.codex/state_5.sqlite"
          rm "$root/home/.codex/config.toml"
          cp "$binary" "$root/artifact/codex"
          cp "$RUNNER_TEMP/profile-tui-lock-audit.json" "$root/artifact/lock-audit.json"
          cp "$RUNNER_TEMP/profile-tui-formatted.patch" "$root/artifact/native.patch"
          sha256sum "$root/artifact/codex" > "$root/artifact/sha256.txt"
          printf 'upstream_sha=%s\nsource_sha=%s\ntarget=aarch64-unknown-linux-musl\nprofile=release opt-level=z codegen-units=1 strip=symbols\n' "$UPSTREAM_SHA" "$GITHUB_SHA" > "$root/artifact/source.txt"
          cat "$root/artifact/version.txt" "$root/artifact/source.txt" "$root/artifact/sha256.txt"
      - name: Upload unsigned frontend candidate
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: manager-tui-native
          path: ${{ runner.temp }}/manager-tui-native/artifact
          if-no-files-found: error
          retention-days: 3
          compression-level: 1
      - name: Verify destination catalog regression
        id: native-catalog-mutation
        if: ${{ inputs.native_transition_mutation_check }}
        shell: bash
        run: |
          set -euo pipefail
          cd upstream
          source=codex-rs/core/src/thread_manager.rs
          original="$RUNNER_TEMP/native-provider-catalog-original.rs"
          cp "$source" "$original"
          trap 'cp "$original" "$source"' EXIT
          python3 - <<'PYTHON'
          from pathlib import Path
          path = Path('codex-rs/core/src/thread_manager.rs')
          text = path.read_text()
          start = text.index('        let models_manager = if ', text.index('async fn spawn_thread('))
          end = text.index('        let spawn_result = Session::spawn(', start)
          path.write_text(text[:start] + '        let models_manager = Arc::clone(&self.models_manager);\n' + text[end:])
          PYTHON
          mkdir -p "$RUNNER_TEMP/native-interface-sockets"
          exec 35<"$RUNNER_TEMP/native-interface-sockets"
          set +e
          just test --retries 0 --locked --target aarch64-unknown-linux-musl -p codex-core --lib -E 'test(model_provider_binding_keeps_originators_and_selects_destination_catalog)' 2>&1 | tee "$RUNNER_TEMP/native-provider-catalog-mutation.log"
          result=${PIPESTATUS[0]}
          set -e
          test "$result" -ne 0
          python3 - <<'PYTHON'
          import os, re
          from pathlib import Path
          text = Path(os.environ['RUNNER_TEMP'], 'native-provider-catalog-mutation.log').read_text()
          text = re.sub(r'\x1b\[[0-?]*[ -/]*[@-~]', '', text)
          assert re.search(r'Summary\s*\[[^\]]+\]\s*[1-9][0-9]* tests? run:.*[1-9][0-9]* failed', text), text[-6000:]
          assert 'the destination catalog must replace the former binding' in text, text[-6000:]
          PYTHON
          cp "$original" "$source"
          cmp "$original" "$source"
          trap - EXIT
          just test --retries 0 --locked --target aarch64-unknown-linux-musl -p codex-core --lib -E 'test(model_provider_binding_keeps_originators_and_selects_destination_catalog)' 2>&1 | tee "$RUNNER_TEMP/native-provider-catalog-restored.log"
      - name: Verify provider runtime binding regression
        id: native-route-mutation
        if: ${{ inputs.native_transition_mutation_check }}
        shell: bash
        run: |
          set -euo pipefail
          cd upstream
          source=codex-rs/core/src/session/mod.rs
          original="$RUNNER_TEMP/native-provider-original.rs"
          cp "$source" "$original"
          trap 'cp "$original" "$source"' EXIT
          python3 - <<'PYTHON'
          from pathlib import Path
          path = Path('codex-rs/core/src/session/mod.rs')
          text = path.read_text()
          needle = 'self.services.inference.store(Arc::clone(runtime));'
          assert text.count(needle) == 1
          path.write_text(text.replace(needle, 'let _ = runtime;'))
          PYTHON
          mkdir -p "$RUNNER_TEMP/native-interface-sockets"
          exec 35<"$RUNNER_TEMP/native-interface-sockets"
          set +e
          just test --retries 0 --locked --target aarch64-unknown-linux-musl -p codex-app-server --test all -E 'test(model_provider_roundtrip_preserves_jobs_history_observers_and_siblings)' 2>&1 | tee "$RUNNER_TEMP/native-provider-mutation.log"
          result=${PIPESTATUS[0]}
          set -e
          test "$result" -ne 0
          python3 - <<'PYTHON'
          import os, re
          from pathlib import Path
          text = Path(os.environ['RUNNER_TEMP'], 'native-provider-mutation.log').read_text()
          text = re.sub(r'\x1b\[[0-?]*[ -/]*[@-~]', '', text)
          assert re.search(r'Summary\s*\[[^\]]+\]\s*[1-9][0-9]* tests? run:.*[1-9][0-9]* failed', text), text[-6000:]
          assert 'selected route did not receive the continuation' in text, text[-6000:]
          PYTHON
          cp "$original" "$source"
          cmp "$original" "$source"
          trap - EXIT
          just test --retries 0 --locked --target aarch64-unknown-linux-musl -p codex-app-server --test all -E 'test(model_provider_roundtrip_preserves_jobs_history_observers_and_siblings)' 2>&1 | tee "$RUNNER_TEMP/native-provider-restored.log"
      - name: Verify empty live-thread resume regression
        id: native-resume-mutation
        if: ${{ inputs.native_transition_mutation_check }}
        shell: bash
        run: |
          set -euo pipefail
          cd upstream
          source=codex-rs/app-server/src/request_processors/thread_processor.rs
          original="$RUNNER_TEMP/native-resume-original.rs"
          cp "$source" "$original"
          trap 'cp "$original" "$source"' EXIT
          python3 - <<'PYTHON'
          from pathlib import Path
          path = Path('codex-rs/app-server/src/request_processors/thread_processor.rs')
          text = path.read_text()
          start = text.index('            // The live writer can precede its rollout.')
          end = text.index('            let source_thread = self', start)
          path.write_text(text[:start] + text[end:])
          PYTHON
          set +e
          just test --retries 0 --locked --target aarch64-unknown-linux-musl -p codex-app-server --test all -E 'test(model_provider_resume_empty_live_thread_preserves_writer_and_observers)' 2>&1 | tee "$RUNNER_TEMP/native-provider-resume-mutation.log"
          result=${PIPESTATUS[0]}
          set -e
          test "$result" -ne 0
          python3 - <<'PYTHON'
          import os, re
          from pathlib import Path
          text = Path(os.environ['RUNNER_TEMP'], 'native-provider-resume-mutation.log').read_text()
          text = re.sub(r'\x1b\[[0-?]*[ -/]*[@-~]', '', text)
          assert re.search(r'Summary\s*\[[^\]]+\]\s*[1-9][0-9]* tests? run:.*[1-9][0-9]* failed', text), text[-6000:]
          assert 'no rollout found for thread id' in text, text[-6000:]
          PYTHON
          cp "$original" "$source"
          cmp "$original" "$source"
          trap - EXIT
          just test --retries 0 --locked --target aarch64-unknown-linux-musl -p codex-app-server --test all -E 'test(model_provider_resume_empty_live_thread_preserves_writer_and_observers)' 2>&1 | tee "$RUNNER_TEMP/native-provider-resume-restored.log"
      - name: Prepare bounded nonowner ownership fixture
        shell: bash
        run: |
          set -euo pipefail
          test "$(id -u)" != 0
          fixture="$(mktemp -d "$RUNNER_TEMP/profile-core-owner.XXXXXX")/core"
          cat > "$fixture" <<'CORE_FIXTURE'
          #!/bin/sh
          printf '%s\n' '{"schema":"codex-manager-profiles-v1","profiles":["default"],"current":"default","current_source":"default","saved_default":"default"}'
          CORE_FIXTURE
          chmod 0755 "$fixture"
          sudo chown 0 "$fixture"
          echo "CODEX_PROFILE_NONOWNER_CORE=$fixture" >> "$GITHUB_ENV"
      - name: Focused actual native TUI regressions
        shell: bash
        run: |
          set -euo pipefail
          cd upstream
          just test --retries 0 --locked --target aarch64-unknown-linux-musl -p codex-tui --lib -E 'test(termux_chat_models) | test(termux_backend_catalog) | test(chat_model_reentry) | test(profile_transport) | test(termux_permissions) | test(termux_terminal) | test(termux_clipboard) | test(clipboard_copy) | test(copy_export_picker) | test(copy_mode) | test(copy_picker) | test(profile_manager) | test(switch_command) | test(side_conversation_hides_commands_without_side_flag) | test(provider_presentation) | test(side_fork_uses_one_request_for_long_paginated_history) | test(absolute_time_uses_child_timezone) | test(bound_chat_synchronization) | test(active_chat_provider_steer) | test(image_preparation) | test(image_submission_is_portable)' 2>&1 | tee "$RUNNER_TEMP/profile-tui-focused.log"
          python3 "$GITHUB_WORKSPACE/experiment/frontend/manager-tui/check_command_boundary.py" "$RUNNER_TEMP/profile-tui-pristine" --patched "$GITHUB_WORKSPACE/upstream" --test-log "$RUNNER_TEMP/profile-tui-focused.log"
      - name: Verify active Steer regression detects the next-turn barrier fault
        if: inputs.mutation_check
        shell: bash
        run: |
          set -euo pipefail
          cd upstream
          source=codex-rs/tui/src/chatwidget/input_submission.rs
          original="$RUNNER_TEMP/profile-tui-steer-original.rs"
          cp "$source" "$original"
          trap 'cp "$original" "$source"' EXIT
          python3 - <<'PYTHON'
          from pathlib import Path
          path = Path('codex-rs/tui/src/chatwidget/input_submission.rs')
          text = path.read_text()
          guard = '(self.needs_chat_synchronization()\n                && (!self.turn_lifecycle.agent_turn_running\n                    || self.turn_lifecycle.last_turn_id.is_none()))'
          assert text.count(guard) == 1
          path.write_text(text.replace(guard, 'self.needs_chat_synchronization()'))
          PYTHON
          status=0
          just test --retries 0 --locked --target aarch64-unknown-linux-musl -p codex-tui --lib -E 'test(active_chat_provider_steer)' > "$RUNNER_TEMP/profile-tui-steer-mutation.log" 2>&1 || status=$?
          test "$status" -ne 0
          python3 - <<'PYTHON'
          import os, re
          from pathlib import Path
          text = Path(os.environ['RUNNER_TEMP'], 'profile-tui-steer-mutation.log').read_text()
          text = re.sub(r'\x1b\[[0-?]*[ -/]*[@-~]', '', text)
          assert re.search(r'Summary\s*\[[^\]]+\]\s*1 tests? run:.*1 failed', text), text[-4000:]
          assert 'active text Steer must submit directly to Native' in text, text[-4000:]
          PYTHON
          cp "$original" "$source"
          cmp "$original" "$source"
          trap - EXIT
      - name: Verify saved catalog regression detects the source fault
        if: inputs.mutation_check
        shell: bash
        run: |
          set -euo pipefail
          cd upstream
          source=codex-rs/tui/src/termux_chat_models.rs
          original="$RUNNER_TEMP/profile-tui-catalog-original.rs"
          cp "$source" "$original"
          trap 'cp "$original" "$source"' EXIT
          python3 - <<'PYTHON'
          from pathlib import Path
          path = Path('codex-rs/tui/src/termux_chat_models.rs')
          text = path.read_text()
          guard = 'if config.model_catalog.is_some() {'
          assert text.count(guard) == 1
          path.write_text(text.replace(guard, 'if config.model_catalog.is_none() {'))
          PYTHON
          status=0
          just test --retries 0 --locked --target aarch64-unknown-linux-musl -p codex-tui --lib -E 'test(termux_chat_models_installed_catalog_decodes_in_real_config)' > "$RUNNER_TEMP/profile-tui-mutation.log" 2>&1 || status=$?
          test "$status" -ne 0
          python3 - <<'PYTHON'
          import os, re
          from pathlib import Path
          text = Path(os.environ['RUNNER_TEMP'], 'profile-tui-mutation.log').read_text()
          text = re.sub(r'\x1b\[[0-?]*[ -/]*[@-~]', '', text)
          assert re.search(r'Summary\s*\[[^\]]+\]\s*1 tests? run:.*1 failed', text), text[-4000:]
          assert 'left: Ok(false)' in text and 'right: Ok(true)' in text, text[-4000:]
          PYTHON
          cp "$original" "$source"
          cmp "$original" "$source"
          trap - EXIT
      - name: Verify local-provider login regression detects the default-account fault
        if: inputs.mutation_check
        shell: bash
        run: |
          set -euo pipefail
          cd upstream
          source=codex-rs/tui/src/profile_transport.rs
          original="$RUNNER_TEMP/profile-tui-login-original.rs"
          cp "$source" "$original"
          trap 'cp "$original" "$source"' EXIT
          python3 - <<'PYTHON'
          from pathlib import Path
          path = Path('codex-rs/tui/src/profile_transport.rs')
          text = path.read_text()
          selected = '        selected_provider_requires_auth\n'
          assert text.count(selected) == 1
          path.write_text(text.replace(selected, '        backend_requires_auth\n'))
          PYTHON
          status=0
          just test --retries 0 --locked --target aarch64-unknown-linux-musl -p codex-tui --lib -E 'test(profile_transport_login_uses_selected_local_provider)' > "$RUNNER_TEMP/profile-tui-login-mutation.log" 2>&1 || status=$?
          test "$status" -ne 0
          python3 - <<'PYTHON'
          import os, re
          from pathlib import Path
          text = Path(os.environ['RUNNER_TEMP'], 'profile-tui-login-mutation.log').read_text()
          text = re.sub(r'\x1b\[[0-?]*[ -/]*[@-~]', '', text)
          assert re.search(r'Summary\s*\[[^\]]+\]\s*1 tests? run:.*1 failed', text), text[-4000:]
          assert 'left: true' in text and 'right: false' in text, text[-4000:]
          PYTHON
          cp "$original" "$source"
          cmp "$original" "$source"
          trap - EXIT
      - name: Verify Paginated blank-history regression detects the old method filter
        if: inputs.mutation_check
        shell: bash
        run: |
          set -euo pipefail
          cd upstream
          source=codex-rs/tui/src/app/chat_model_reentry.rs
          original="$RUNNER_TEMP/profile-tui-blank-original.rs"
          cp "$source" "$original"
          trap 'cp "$original" "$source"' EXIT
          python3 - <<'PYTHON'
          from pathlib import Path
          path = Path('codex-rs/tui/src/app/chat_model_reentry.rs')
          text = path.read_text()
          guard = 'matches!(method.as_str(), "thread/read" | "thread/turns/list")'
          assert text.count(guard) == 1
          path.write_text(text.replace(guard, 'method == "thread/read"'))
          PYTHON
          status=0
          just test --retries 0 --locked --target aarch64-unknown-linux-musl -p codex-tui --lib -E 'test(termux_chat_models_blank_history_errors_are_exact_and_thread_bound)' > "$RUNNER_TEMP/profile-tui-blank-mutation.log" 2>&1 || status=$?
          test "$status" -ne 0
          python3 - <<'PYTHON'
          import os, re
          from pathlib import Path
          text = Path(os.environ['RUNNER_TEMP'], 'profile-tui-blank-mutation.log').read_text()
          text = re.sub(r'\x1b\[[0-?]*[ -/]*[@-~]', '', text)
          assert re.search(r'Summary\s*\[[^\]]+\]\s*1 tests? run:.*1 failed', text), text[-4000:]
          assert 'left: false' in text and 'right: true' in text, text[-4000:]
          PYTHON
          cp "$original" "$source"
          cmp "$original" "$source"
          trap - EXIT
      - name: Qualify retained upstream 0.162 features
        shell: bash
        run: |
          set -euo pipefail
          # Production uses the official host, whose V8 build has its own release
          # tooling. Exercise those exact authenticated bytes instead of adding
          # another host/V8 producer to this frontend build.
          host="$RUNNER_TEMP/profile-code-mode-host"
          mkdir -m 0700 "$host"
          curl --fail --silent --show-error --location --proto '=https' --tlsv1.2 \
            --connect-timeout 15 --max-time 180 --max-filesize 536870912 \
            "https://github.com/openai/codex/releases/download/rust-v${UPSTREAM_VERSION}/codex-package-aarch64-unknown-linux-musl.tar.gz" \
            --output "$host/package.tar.gz"
          echo "$UPSTREAM_ARCHIVE_SHA256  $host/package.tar.gz" | sha256sum -c -
          python3 - <<'PYTHON'
          import os, shutil, tarfile
          from pathlib import Path
          root = Path(os.environ['RUNNER_TEMP']) / 'profile-code-mode-host'
          with tarfile.open(root / 'package.tar.gz', 'r:gz') as archive:
              member = archive.getmember('bin/codex-code-mode-host')
              if not member.isfile() or not 0 < member.size <= 128 * 1024 * 1024:
                  raise RuntimeError('invalid official code-mode host')
              with archive.extractfile(member) as source, (root / 'codex-code-mode-host').open('xb') as target:
                  shutil.copyfileobj(source, target)
          (root / 'codex-code-mode-host').chmod(0o755)
          PYTHON
          "$host/codex-code-mode-host" --help > "$host/help.txt"
          export CARGO_BIN_EXE_codex="$GITHUB_WORKSPACE/upstream/codex-rs/target/aarch64-unknown-linux-musl/release/codex"
          export CARGO_BIN_EXE_codex_code_mode_host="$host/codex-code-mode-host"
          PYTHONDONTWRITEBYTECODE=1 python3 "$GITHUB_WORKSPACE/experiment/frontend/manager-tui/check_upstream_features.py" --run "$GITHUB_WORKSPACE/upstream" --logs "$RUNNER_TEMP"
      - name: Inspect TUI lint fixes
        shell: bash
        run: |
          set -euo pipefail
          cd upstream
          # Validation-only compiler capacity and ARM64 fstatfs type allowances.
          # The CLI above contains pristine Core lib.rs/daemon_startup; neither temporary
          # allowance enters an asset or suppresses a lint in maintained code.
          python3 - <<'PYTHON'
          from pathlib import Path
          import subprocess
          core = Path('codex-rs/core/src/lib.rs')
          original = core.read_bytes()
          pristine = subprocess.check_output(['git', 'show', 'HEAD:codex-rs/core/src/lib.rs'])
          if original != pristine:
              raise RuntimeError('upstream Core source must remain pristine')
          annotated = b'#![recursion_limit = "256"]\n' + original
          daemon = Path('codex-rs/tui/src/daemon_startup.rs')
          daemon_original = daemon.read_bytes()
          if daemon_original != subprocess.check_output(['git', 'show', 'HEAD:codex-rs/tui/src/daemon_startup.rs']):
              raise RuntimeError('upstream daemon startup source must remain pristine')
          needle = b'pub fn uses_wsl_drvfs('
          if daemon_original.count(needle) != 1:
              raise RuntimeError('unqualified upstream WSL filesystem probe')
          # f_type is u64 on aarch64-musl and signed on other upstream targets.
          # Keep the portable upstream cast, rather than auto-fixing it for one ABI.
          daemon_annotated = daemon_original.replace(needle, b'#[allow(clippy::unnecessary_cast)]\n' + needle)
          try:
              core.write_bytes(annotated)
              daemon.write_bytes(daemon_annotated)
              result = subprocess.run(['just', 'fix', '--locked', '--target',
                                       'aarch64-unknown-linux-musl', '-p', 'codex-tui'])
              if core.read_bytes() != annotated:
                  raise RuntimeError('lint changed upstream Core source')
              if daemon.read_bytes() != daemon_annotated:
                  raise RuntimeError('lint changed upstream daemon startup source')
              result.check_returncode()
          finally:
              core.write_bytes(original)
              daemon.write_bytes(daemon_original)
          PYTHON
          git diff --exit-code -- codex-rs/tui/src/daemon_startup.rs
          git diff -- codex-rs > "$RUNNER_TEMP/profile-tui-linted.patch"
          cmp "$RUNNER_TEMP/profile-tui-formatted.patch" "$RUNNER_TEMP/profile-tui-linted.patch"
          python3 ../experiment/frontend/manager-tui/apply.py . --check-scope --native-preparation "$RUNNER_TEMP/profile-tui-native-preparation.json"
      - name: Retain native focus and pending snapshots
        if: ${{ !cancelled() && steps.native-format.outcome != 'skipped' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: manager-tui-native-proof
          path: |
            ${{ runner.temp }}/native-provider-*.log
            ${{ runner.temp }}/native-protocol-generated.tar.gz
            ${{ runner.temp }}/profile-tui-focused.log
            ${{ runner.temp }}/profile-tui-mutation.log
            ${{ runner.temp }}/profile-tui-login-mutation.log
            ${{ runner.temp }}/profile-tui-blank-mutation.log
            ${{ runner.temp }}/profile-tui-steer-mutation.log
            ${{ runner.temp }}/profile-tui-upstream-*.log
            ${{ runner.temp }}/profile-tui-formatted.patch
            ${{ runner.temp }}/profile-tui-native-preparation.json
            ${{ runner.temp }}/profile-tui-linted.patch
            upstream/codex-rs/tui/src/app/snapshots/*profile_manager*.snap*
          if-no-files-found: error
          retention-days: 3
      - name: Retain isolated partial compile cache
        # Fault injection dirties Cargo outputs and consumes the optional cache
        # save budget. Preserve ordinary compile failures before the Native fault;
        # after that fault, only the restored-source passing run may publish it.
        if: ${{ !cancelled() && !inputs.mutation_check && steps.native-route-mutation.outcome != 'failure' && steps.native-catalog-mutation.outcome != 'failure' && steps.native-resume-mutation.outcome != 'failure' && steps.compile-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            upstream/codex-rs/target
          key: profile-tui-display-aarch64-musl-${{ env.RUST_VERSION }}-${{ env.UPSTREAM_SHA }}-${{ github.sha }}
      - name: Retain failed native build diagnosis
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: manager-tui-native-diagnosis
          path: |
            ${{ runner.temp }}/profile-tui-lock-audit.json
            ${{ github.workspace }}/upstream/codex-rs/target/**/config.log
          if-no-files-found: warn
          retention-days: 3

  notify_acceptance:
    needs: upstream-baseline
    if: always()
    permissions:
      contents: read
      actions: write
    runs-on: ubuntu-24.04
    steps:
      - name: Continue accepted input processing
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh api 'repos/humtr/codex/contents/.github/workflows/accepted-release-inputs.yml?ref=main' --silent; then
            gh workflow run accepted-release-inputs.yml --repo humtr/codex --ref main -f completed_run="$GITHUB_RUN_ID"
          fi
