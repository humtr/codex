name: Wrapper CI

on:
  push:
    branches:
      - main
      - wrapper
      - rewrite/wrapper
    tags:
      - 'wrapper'
      - 'wrapper-*'
      - 'v*'
  pull_request:
    branches:
      - main
      - wrapper
      - rewrite/wrapper
  workflow_dispatch:
    inputs:
      check_upstream:
        description: Inspect official stable inputs without installing or publishing
        type: boolean
        default: false
      qualify_upstream:
        description: Exercise the base runtime in disposable Bionic roots (no accounts or publication)
        type: boolean
        default: false
      upstream_version:
        description: Optional exact stable version; empty discovers official latest
        type: string
        default: ''
      publish_release:
        description: Publish wrapper GitHub Release assets
        type: boolean
        default: false
      release_tag:
        description: Target GitHub Release tag when publish_release is true
        type: string
        default: wrapper
      prerelease:
        description: Mark published GitHub Release as prerelease (keeps /releases/latest untouched)
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: wrapper-${{ github.ref }}
  cancel-in-progress: ${{ github.ref == 'refs/heads/main' || github.ref == 'refs/heads/wrapper' || github.ref == 'refs/heads/rewrite/wrapper' || github.event_name == 'pull_request' }}

jobs:
  verify:
    name: Verify standalone Wrapper
    permissions:
      contents: read
    uses: ./.github/workflows/wrapper-verify.yml
    with:
      source_sha: ${{ github.sha }}
      check_upstream: ${{ inputs.check_upstream == true }}
      qualify_upstream: ${{ inputs.qualify_upstream == true }}
      upstream_version: ${{ inputs.upstream_version || '' }}

  release:
    name: Publish wrapper GitHub Release
    needs: verify
    if: github.ref == 'refs/tags/wrapper' || startsWith(github.ref, 'refs/tags/wrapper-') || startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.publish_release == true)
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    timeout-minutes: 10
    # Dispatches from different refs may target the SAME Release tag. Keep one
    # publisher per tag globally without cancelling a partially uploaded job.
    concurrency:
      group: wrapper-publish-${{ github.repository }}-${{ inputs.release_tag || github.ref_name }}
      cancel-in-progress: false
    steps:
      - name: Checkout exact publishing source
        shell: bash
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          git init .
          git remote add origin "https://github.com/$GITHUB_REPOSITORY.git"
          git fetch --no-tags --depth=1 origin "$SOURCE_SHA"
          git checkout --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"

      - name: Download packaged release artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: wrapper-android
          path: ${{ runner.temp }}/dist

      - name: Publish and verify source tag, notes and exact uploaded bytes
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_TAG: ${{ inputs.release_tag }}
          INPUT_PRERELEASE: ${{ inputs.prerelease }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            tag="$INPUT_TAG"
          else
            tag="$REF_NAME"
          fi
          flags=(--repo "$GITHUB_REPOSITORY" --tag "$tag"
                 --source-sha "$GITHUB_SHA" --dist "$RUNNER_TEMP/dist")
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            flags+=(--dispatch)
            if [ "$INPUT_PRERELEASE" = "true" ]; then flags+=(--prerelease); fi
          elif [[ "$tag" == *-* ]]; then
            flags+=(--prerelease)
          fi
          PYTHONDONTWRITEBYTECODE=1 python3 .github/scripts/publish_wrapper_release.py "${flags[@]}"
