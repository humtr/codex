name: Wrapper CI

on:
  push:
    branches:
      - main
      - wrapper
      - rewrite/wrapper
    tags:
      - 'wrapper'
      - 'wrapper-*'
      - 'v*'
  pull_request:
    branches:
      - main
      - wrapper
      - rewrite/wrapper
  workflow_dispatch:
    inputs:
      check_upstream:
        description: Inspect official stable inputs without installing or publishing
        type: boolean
        default: false
      qualify_upstream:
        description: Exercise the base runtime in disposable Bionic roots (no accounts or publication)
        type: boolean
        default: false
      upstream_version:
        description: Optional exact stable version; empty discovers official latest
        type: string
        default: ''
      publish_release:
        description: Publish wrapper GitHub Release assets
        type: boolean
        default: false
      release_tag:
        description: Target GitHub Release tag when publish_release is true
        type: string
        default: wrapper
      prerelease:
        description: Mark published GitHub Release as prerelease (keeps /releases/latest untouched)
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: wrapper-${{ github.ref }}
  cancel-in-progress: ${{ github.ref == 'refs/heads/main' || github.ref == 'refs/heads/wrapper' || github.ref == 'refs/heads/rewrite/wrapper' || github.event_name == 'pull_request' }}

jobs:
  verify:
    name: Verify standalone Wrapper
    permissions:
      contents: read
    uses: ./.github/workflows/wrapper-verify.yml
    with:
      source_sha: ${{ github.sha }}
      check_upstream: ${{ inputs.check_upstream == true }}
      qualify_upstream: ${{ inputs.qualify_upstream == true }}
      upstream_version: ${{ inputs.upstream_version || '' }}

  release:
    name: Publish wrapper GitHub Release
    needs: verify
    if: github.ref == 'refs/tags/wrapper' || startsWith(github.ref, 'refs/tags/wrapper-') || startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.publish_release == true)
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    timeout-minutes: 10
    steps:
      - name: Download packaged release artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: wrapper-android
          path: ${{ runner.temp }}/dist

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_TAG: ${{ inputs.release_tag }}
          INPUT_PRERELEASE: ${{ inputs.prerelease }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            tag="$INPUT_TAG"
          else
            tag="$REF_NAME"
          fi
          case "$tag" in
            '' | *[!A-Za-z0-9._-]* )
              echo "invalid release tag: $tag" >&2
              exit 1
              ;;
          esac

          dist="$RUNNER_TEMP/dist"
          sha_line="$(cat "$dist/codex-wrapper-aarch64-linux-android.tar.gz.sha256")"
          notes="$(printf '%s\n' \
            "Termux codex wrapper ($tag)." \
            "" \
            "- Source commit: $GITHUB_SHA" \
            "- Target: aarch64-linux-android (Android API 24)" \
            "- Archive SHA-256: $sha_line" \
            "- Install in Termux:" \
            "  curl -fsSL https://github.com/$GITHUB_REPOSITORY/releases/download/$tag/install.sh | sh")"

          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
              gh api -X PATCH "repos/$GITHUB_REPOSITORY/git/refs/tags/$tag" \
                -f "sha=$GITHUB_SHA" >/dev/null 2>&1 || true
            fi
            gh release upload "$tag" "$dist"/* --repo "$GITHUB_REPOSITORY" --clobber
            gh release edit "$tag" --repo "$GITHUB_REPOSITORY" --notes "$notes"
          else
            flags=(--repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "Termux Codex Wrapper ($tag)" --notes "$notes")
            if [ "$EVENT_NAME" = "workflow_dispatch" ] && [ "$INPUT_PRERELEASE" = "true" ]; then
              flags+=(--prerelease)
            elif [ "$EVENT_NAME" != "workflow_dispatch" ] && [[ "$tag" == *-* ]]; then
              flags+=(--prerelease)
            fi
            gh release create "$tag" "$dist"/* "${flags[@]}"
          fi
