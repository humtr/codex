name: Tunnel-Client & Runit Supervision CI

on:
  push:
    branches:
      - main
    paths:
      - 'transport/tunnel-client/**'
      - 'scripts/build_tunnel_client.py'
      - 'scripts/test_build_tunnel_client.py'
      - 'scripts/runit_service.py'
      - 'scripts/test_runit_service.py'
      - '.github/workflows/tunnel-client.yml'
      - '.github/scripts/release_sign.py'
  pull_request:
    branches:
      - main
    paths:
      - 'transport/tunnel-client/**'
      - 'scripts/build_tunnel_client.py'
      - 'scripts/test_build_tunnel_client.py'
      - 'scripts/runit_service.py'
      - 'scripts/test_runit_service.py'
      - '.github/workflows/tunnel-client.yml'
      - '.github/scripts/release_sign.py'
  workflow_dispatch:
    inputs:
      publish_release:
        description: Publish signed tunnel-client GitHub Release assets
        type: boolean
        default: false
      release_tag:
        description: Target GitHub Release tag when publish_release is true
        type: string
        default: tunnel-client
      prerelease:
        description: Mark published GitHub Release as prerelease
        type: boolean
        default: false
      release_sequence:
        description: Monotonic signed release sequence (used when CODEX_SIGNING_KEY secret is set)
        type: string
        default: ''

permissions:
  contents: read

env:
  ANDROID_API: '24'
  ANDROID_NDK_VERSION: '27.3.13750724'

jobs:
  build-and-test:
    name: Test tunnel builder, runit supervision, and build android/arm64 tunnel-client
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'

      - name: Run Python unit tests for tunnel builder and runit supervision
        run: |
          set -euo pipefail
          PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s scripts -p 'test_*.py' -v

      - name: Build and test patched openai/tunnel-client for android/arm64
        run: |
          set -euo pipefail
          cc="$ANDROID_SDK_ROOT/ndk/$ANDROID_NDK_VERSION/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android$ANDROID_API-clang"
          test -x "$cc"
          out="$RUNNER_TEMP/tunnel-out"
          rm -rf "$out"
          version="$(python3 -c 'import json; print(json.load(open("transport/tunnel-client/recipe.json"))["version"])')"
          PYTHONDONTWRITEBYTECODE=1 python3 scripts/build_tunnel_client.py \
            --version "$version" --output "$out" --allow-cross --cc "$cc"
          elf="$out/tunnel-client"
          test -x "$elf"
          file "$elf" | grep -F 'ARM aarch64'
          readelf -l "$elf" | grep -F '/system/bin/linker64'
          PYTHONDONTWRITEBYTECODE=1 python3 - <<'PYELF'
          import importlib.util, os
          from pathlib import Path
          spec = importlib.util.spec_from_file_location('qualify_wrapper', '.github/scripts/qualify_wrapper.py')
          module = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(module)
          path = Path(os.environ['RUNNER_TEMP']) / 'tunnel-out/tunnel-client'
          assert module.elf_16k(path), 'tunnel-client: incompatible ELF geometry for 16 KiB pages'
          PYELF

      - name: Package tunnel-client release bundle
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/tunnel-out"
          dist="$RUNNER_TEMP/dist"
          rm -rf "$dist" && mkdir -p "$dist"
          (
            cd "$out"
            sha256sum tunnel-client LICENSE build.json > SHA256SUMS
            sha256sum -c SHA256SUMS
          )
          tarball="tunnel-client-aarch64-linux-android.tar.gz"
          tar --sort=name --mtime='UTC 2026-01-01' --owner=0 --group=0 --numeric-owner \
            -cf - -C "$out" . | gzip -n -9 > "$dist/$tarball"
          (
            cd "$dist"
            sha256sum "$tarball" > "$tarball.sha256"
            sha256sum -c "$tarball.sha256"
          )

      - name: Upload tunnel-client artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: tunnel-client-android
          path: ${{ runner.temp }}/dist/*
          if-no-files-found: error
          retention-days: 30

  release:
    name: Publish signed tunnel-client GitHub Release
    needs: [build-and-test]
    if: github.event_name == 'workflow_dispatch' && inputs.publish_release == true
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    timeout-minutes: 10
    concurrency:
      group: tunnel-client-publish-${{ github.repository }}-${{ inputs.release_tag }}
      cancel-in-progress: false
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v4

      - name: Download tunnel-client artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: tunnel-client-android
          path: ${{ runner.temp }}/dist

      - name: Sign, enforce monotonic sequence, publish, and verify readback
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.release_tag }}
          PRERELEASE: ${{ inputs.prerelease }}
          INPUT_SEQUENCE: ${{ inputs.release_sequence }}
          CODEX_SIGNING_KEY: ${{ secrets.CODEX_SIGNING_KEY }}
        run: |
          set -euo pipefail
          dist="$RUNNER_TEMP/dist"
          tarball="tunnel-client-aarch64-linux-android.tar.gz"
          key_file="$RUNNER_TEMP/release-signing-key.pem"
          trap 'rm -f "$key_file"' EXIT
          [ -n "${CODEX_SIGNING_KEY:-}" ] || { echo "CODEX_SIGNING_KEY secret is required" >&2; exit 1; }
          umask 077
          printf '%s\n' "$CODEX_SIGNING_KEY" > "$key_file"
          seq="${INPUT_SEQUENCE:-$GITHUB_RUN_NUMBER}"
          PYTHONDONTWRITEBYTECODE=1 python3 .github/scripts/release_sign.py sign \
            --component tunnel-client --sequence "$seq" --commit "$GITHUB_SHA" \
            --dist "$dist" --files "$tarball" --private-key "$key_file"
          PYTHONDONTWRITEBYTECODE=1 python3 .github/scripts/release_sign.py verify \
            --component tunnel-client --dist "$dist" --public-key release/release-public-key.pem \
            --min-sequence "$seq"
          assets=("$dist/$tarball" "$dist/$tarball.sha256" "$dist/SHA256SUMS" "$dist/SHA256SUMS.sig")
          notes="Termux patched openai/tunnel-client ($TAG, commit $GITHUB_SHA, sequence $seq)."
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            prev_dir="$RUNNER_TEMP/prev-seq"
            rm -rf "$prev_dir" && mkdir -p "$prev_dir"
            if gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern SHA256SUMS --dir "$prev_dir" >/dev/null 2>&1; then
              PYTHONDONTWRITEBYTECODE=1 python3 - "$prev_dir/SHA256SUMS" "$seq" <<'PYSEQ'
          import importlib.util, sys
          from pathlib import Path
          spec = importlib.util.spec_from_file_location('release_sign', '.github/scripts/release_sign.py')
          rs = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(rs)
          prev = rs.parse_sums(Path(sys.argv[1]).read_bytes())
          cur_seq = int(sys.argv[2])
          if prev['component'] == 'tunnel-client' and cur_seq <= prev['sequence']:
              raise SystemExit(f"tunnel-client sequence {cur_seq} must exceed published sequence {prev['sequence']}")
          PYSEQ
            fi
            gh release upload "$TAG" "${assets[@]}" --repo "$GITHUB_REPOSITORY" --clobber
            edit_flags=(--repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --notes "$notes")
            if [ "$PRERELEASE" = "true" ]; then edit_flags+=(--prerelease); else edit_flags+=(--prerelease=false); fi
            gh release edit "$TAG" "${edit_flags[@]}"
          else
            create_flags=(--repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "Termux tunnel-client ($TAG)" --notes "$notes")
            if [ "$PRERELEASE" = "true" ]; then create_flags+=(--prerelease); fi
            gh release create "$TAG" "${assets[@]}" "${create_flags[@]}"
          fi
          rb="$RUNNER_TEMP/readback"
          rm -rf "$rb" && mkdir -p "$rb"
          for name in "$tarball" SHA256SUMS SHA256SUMS.sig; do
            gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern "$name" --dir "$rb"
          done
          PYTHONDONTWRITEBYTECODE=1 python3 .github/scripts/release_sign.py verify \
            --component tunnel-client --dist "$rb" --public-key release/release-public-key.pem \
            --min-sequence "$seq"
