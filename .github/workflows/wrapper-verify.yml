name: Standalone Wrapper verification

on:
  workflow_call:
    inputs:
      source_sha:
        required: true
        type: string
      check_upstream:
        type: boolean
        default: false
      qualify_upstream:
        type: boolean
        default: false
      upstream_version:
        type: string
        default: ''

permissions:
  contents: read

env:
  RUST_VERSION: '1.99.1'
  ANDROID_TARGET: 'aarch64-linux-android'
  ANDROID_API: '24'
  ANDROID_NDK_VERSION: '27.3.13750724'
  ANDROID_RUNTIME_APEX_COMMIT: '8aeb37cca394ce39c1311744c60960cbd466aa77'
  ANDROID_RUNTIME_APEX_SHA256: '83bf0dce249728dae48149b80d28b48115c54adad95a352120d58a6ac669d1fc'
  CARGO_INCREMENTAL: '0'

jobs:
  checks:
    name: Workspace lint, tests, and docs
    # Execute the emitted AArch64 realpath hook in addition to structural tests.
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
    timeout-minutes: 20
    steps:
      - name: Checkout exact commit
        shell: bash
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          set -euo pipefail
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          git init .
          git remote add origin "https://github.com/$GITHUB_REPOSITORY.git"
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            git fetch --no-tags --depth=2 origin "$GITHUB_REF"
          else
            git fetch --no-tags --depth=2 origin "$SOURCE_SHA"
          fi
          git checkout --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"

      - name: Validate workflow, shell, workspace scope, and markdown links
        shell: bash
        run: |
          set -euo pipefail
          export PYTHONDONTWRITEBYTECODE=1
          for workflow in .github/workflows/*.yml; do
            ruby -e 'require "psych"; Psych.parse_file(ARGV.fetch(0))' "$workflow"
          done
          sh -n install.sh
          if command -v shellcheck >/dev/null 2>&1; then
            shellcheck install.sh
          fi
          python3 - <<'PYCHECK'
          from pathlib import Path
          import re
          import tomllib

          cargo = tomllib.loads(Path('Cargo.toml').read_text())
          assert cargo['workspace']['members'] == ['crates/wrapper', 'crates/release-builder'], cargo

          lock = tomllib.loads(Path('Cargo.lock').read_text())
          names = sorted(pkg['name'] for pkg in lock['package'])
          assert names == ['codex', 'codex-release-builder', 'libc'], names

          root = Path('.').resolve()
          broken = []
          for md in sorted(root.rglob('*.md')):
              if '.git' in md.parts:
                  continue
              text = md.read_text()
              for lineno, line in enumerate(text.splitlines(), 1):
                  for target in re.findall(r'\[[^\]]+\]\(([^)]+)\)', line):
                      if target.startswith(('http://', 'https://', 'mailto:', '#')):
                          continue
                      rel = target.split('#', 1)[0]
                      if not rel:
                          continue
                      if not (md.parent / rel).resolve().exists():
                          broken.append(f'{md.relative_to(root)}:{lineno}: {target}')
          assert not broken, 'Broken markdown links:\n' + '\n'.join(broken)
          print('Wrapper workspace scope and markdown links verified.')
          PYCHECK
          if git rev-parse HEAD^ >/dev/null 2>&1; then
            git diff --check HEAD^ HEAD
          fi

      - name: Mock release publication negative and provenance tests (no public mutation)
        shell: bash
        run: |
          set -euo pipefail
          PYTHONDONTWRITEBYTECODE=1 python3 .github/scripts/test_publish_wrapper_release.py

      - name: Install Rust toolchain
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install "$RUST_VERSION" --profile minimal --component rustfmt,clippy
          rustup default "$RUST_VERSION"

      - name: Restore Cargo cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: wrapper-host-${{ runner.os }}-${{ runner.arch }}-rust${{ env.RUST_VERSION }}-${{ hashFiles('Cargo.toml', 'Cargo.lock') }}
          restore-keys: |
            wrapper-host-${{ runner.os }}-${{ runner.arch }}-rust${{ env.RUST_VERSION }}-

      - name: Format, clippy, and unit tests
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --check
          cargo clippy --workspace --all-targets --locked -- -D warnings
          cargo test --workspace --locked

  android-package:
    name: Build and package aarch64-linux-android bundle
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    timeout-minutes: 25
    steps:
      - name: Checkout exact commit
        shell: bash
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          set -euo pipefail
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          git init .
          git remote add origin "https://github.com/$GITHUB_REPOSITORY.git"
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            git fetch --no-tags --depth=2 origin "$GITHUB_REF"
          else
            git fetch --no-tags --depth=2 origin "$SOURCE_SHA"
          fi
          git checkout --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"

      - name: Install Rust target toolchain
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install "$RUST_VERSION" --profile minimal --target "$ANDROID_TARGET"
          rustup default "$RUST_VERSION"

      - name: Restore Android build cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: wrapper-android-${{ runner.os }}-rust${{ env.RUST_VERSION }}-api${{ env.ANDROID_API }}-${{ hashFiles('Cargo.toml', 'Cargo.lock') }}
          restore-keys: |
            wrapper-android-${{ runner.os }}-rust${{ env.RUST_VERSION }}-api${{ env.ANDROID_API }}-

      - name: Cross-compile wrapper binaries
        shell: bash
        run: |
          set -euo pipefail
          toolchain="$ANDROID_SDK_ROOT/ndk/$ANDROID_NDK_VERSION/toolchains/llvm/prebuilt/linux-x86_64/bin"
          linker="$toolchain/aarch64-linux-android$ANDROID_API-clang"
          ar="$toolchain/llvm-ar"
          test -x "$linker"
          test -x "$ar"
          export CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER="$linker"
          export CC_aarch64_linux_android="$linker"
          export AR_aarch64_linux_android="$ar"
          export RUSTFLAGS="-C link-arg=-Wl,-z,max-page-size=16384 -C link-arg=-Wl,-z,common-page-size=16384"
          unset CARGO_ENCODED_RUSTFLAGS
          cargo build --release --locked --target "$ANDROID_TARGET" -p codex -p codex-release-builder

          for bin in codex codex-release-builder; do
            elf="target/$ANDROID_TARGET/release/$bin"
            test -x "$elf"
            file "$elf" | grep -F 'ARM aarch64'
            readelf -l "$elf" | grep -F '/system/bin/linker64'
          done
          PYTHONDONTWRITEBYTECODE=1 python3 - <<'PYELF'
          import importlib.util
          from pathlib import Path
          spec = importlib.util.spec_from_file_location('qualify_wrapper', '.github/scripts/qualify_wrapper.py')
          module = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(module)
          for name in ('codex', 'codex-release-builder'):
              path = Path('target/aarch64-linux-android/release') / name
              assert module.elf_16k(path), f'{name}: incompatible ELF geometry for 16 KiB pages'
          PYELF

      - name: Package wrapper release bundle
        shell: bash
        run: |
          set -euo pipefail
          bundle="$RUNNER_TEMP/codex-wrapper-aarch64-linux-android"
          dist="$RUNNER_TEMP/dist"
          rm -rf "$bundle" "$dist"
          mkdir -p "$bundle/bin" "$dist"

          install -m 0755 "target/$ANDROID_TARGET/release/codex" "$bundle/bin/codex"
          install -m 0755 "target/$ANDROID_TARGET/release/codex-release-builder" "$bundle/bin/codex-release-builder"
          install -m 0755 install.sh "$bundle/install.sh"
          install -m 0644 README.md "$bundle/README.md"
          install -m 0644 SPEC.md "$bundle/SPEC.md"

          (
            cd "$bundle"
            sha256sum bin/codex bin/codex-release-builder install.sh README.md SPEC.md > SHA256SUMS
            sha256sum -c SHA256SUMS
          )

          tarball="codex-wrapper-aarch64-linux-android.tar.gz"
          tar --sort=name --mtime='UTC 2026-01-01' --owner=0 --group=0 --numeric-owner \
            -cf - -C "$bundle" . | gzip -n -9 > "$dist/$tarball"
          (
            cd "$dist"
            sha256sum "$tarball" > "$tarball.sha256"
            sha256sum -c "$tarball.sha256"
          )
          install -m 0755 install.sh "$dist/install.sh"
          install -m 0644 "$bundle/SHA256SUMS" "$dist/SHA256SUMS"
          ls -lh "$dist"

      - name: Upload packaged release artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: wrapper-android
          path: ${{ runner.temp }}/dist/*
          if-no-files-found: error
          retention-days: 30

  android-smoke:
    name: Smoke-test Android Bionic binary and install.sh
    needs: [checks, android-package]
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
    timeout-minutes: 15
    steps:
      - name: Download packaged release artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: wrapper-android
          path: ${{ runner.temp }}/dist

      - name: Checkout exact source for installer fault injection
        shell: bash
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          set -euo pipefail
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          git init .
          git remote add origin "https://github.com/$GITHUB_REPOSITORY.git"
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            git fetch --no-tags --depth=2 origin "$GITHUB_REF"
          else
            git fetch --no-tags --depth=2 origin "$SOURCE_SHA"
          fi
          git checkout --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"

      - name: Provision Android Runtime Bionic linker64 and Termux test layout
        shell: bash
        run: |
          set -euo pipefail
          for tool in curl base64 unzip debugfs file readelf sha256sum tar gzip sh; do
            command -v "$tool" >/dev/null
          done
          sudo test ! -e /system
          root="$RUNNER_TEMP/bionic"
          mkdir -p "$root/bin" "$root/lib64/bionic"
          apex_url="https://android.googlesource.com/platform/prebuilts/runtime/+/$ANDROID_RUNTIME_APEX_COMMIT/mainline/runtime/apex/com.android.runtime-arm64.apex?format=TEXT"
          curl --fail --silent --show-error --location --proto '=https' --tlsv1.2 \
            --connect-timeout 15 --max-time 120 --max-filesize 20971520 \
            --output "$root/runtime.apex.b64" "$apex_url"
          base64 --decode "$root/runtime.apex.b64" > "$root/runtime.apex"
          test "$(wc -c < "$root/runtime.apex")" -eq 13881344
          test "$(sha256sum "$root/runtime.apex" | awk '{print $1}')" = "$ANDROID_RUNTIME_APEX_SHA256"
          unzip -p "$root/runtime.apex" apex_payload.img > "$root/apex_payload.img"
          test "$(wc -c < "$root/apex_payload.img")" -eq 13783040
          debugfs -R "dump -p /bin/linker64 $root/bin/linker64" "$root/apex_payload.img" >/dev/null 2>&1
          for library in libc.so libdl.so libm.so; do
            debugfs -R "dump -p /lib64/bionic/$library $root/lib64/bionic/$library" \
              "$root/apex_payload.img" >/dev/null 2>&1
          done
          sudo mkdir -p /system/bin /system/lib64
          sudo install -m 0755 "$root/bin/linker64" /system/bin/linker64
          for library in libc.so libdl.so libm.so; do
            sudo install -m 0644 "$root/lib64/bionic/$library" "/system/lib64/$library"
          done
          rm -rf "$root"

          prefix="/data/data/com.termux/files/usr"
          sudo mkdir -p "$prefix/bin" "$prefix/tmp" "$prefix/etc/tls"
          for tool in sh curl openssl gzip tar ps; do
            src="$(command -v "$tool")"
            sudo install -m 0755 "$src" "$prefix/bin/$tool"
          done
          sudo chown -R "$(id -u):$(id -g)" /data/data/com.termux

      - name: Checkout exact verification source for explicit or scheduled discovery
        if: github.event_name == 'schedule' || inputs.check_upstream == true || inputs.qualify_upstream == true
        shell: bash
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          set -euo pipefail
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          git init .
          git remote add origin "https://github.com/$GITHUB_REPOSITORY.git"
          git fetch --no-tags --depth=1 origin "$SOURCE_SHA"
          git checkout --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"

      - name: Verify checksum, install.sh, and Bionic ELF behavior
        shell: bash
        run: |
          set -euo pipefail
          dist="$RUNNER_TEMP/dist"
          bundle="$RUNNER_TEMP/unpacked"
          smoke_home="$RUNNER_TEMP/smoke-home"
          prefix="/data/data/com.termux/files/usr"
          tarball="codex-wrapper-aarch64-linux-android.tar.gz"

          (
            cd "$dist"
            sha256sum -c "$tarball.sha256"
          )
          mkdir -p "$bundle" "$smoke_home"
          tar -xzf "$dist/$tarball" -C "$bundle"
          (
            cd "$bundle"
            sha256sum -c SHA256SUMS
          )

          HOME="$smoke_home" PREFIX="$prefix" TMPDIR="$prefix/tmp" \
            "$bundle/install.sh" --skip-upstream

          codex_bin="$prefix/bin/codex"
          test -x "$codex_bin"
          "$codex_bin" update --help | grep -F -- '--upstream'

          set +e
          status_json="$(HOME="$smoke_home" PREFIX="$prefix" TMPDIR="$prefix/tmp" "$codex_bin" wrapper status --json)"
          status_rc=$?
          HOME="$smoke_home" PREFIX="$prefix" TMPDIR="$prefix/tmp" "$codex_bin" --sandbox read-only --version >/dev/null 2>&1
          sandbox_rc=$?
          HOME="$smoke_home" PREFIX="$prefix" TMPDIR="$prefix/tmp" "$codex_bin" sandbox linux true >/dev/null 2>&1
          subcmd_sandbox_rc=$?
          set -e

          test "$status_rc" -eq 1
          printf '%s\n' "$status_json" | grep -F '"status":"uninitialized"'
          printf '%s\n' "$status_json" | grep -F '"addons":"none"'
          printf '%s\n' "$status_json" | grep -F '"signed_update":false'
          test "$sandbox_rc" -eq 2
          test "$subcmd_sandbox_rc" -eq 2

          # Exercise the real Android/Bionic CLI in a disposable HOME.
          smoke_codex() {
            HOME="$smoke_home" PREFIX="$prefix" TMPDIR="$prefix/tmp" "$codex_bin" "$@"
          }
          cfg="$smoke_home/.local/share/codex/wrapper/wrapper.toml"
          test ! -e "$cfg"
          show="$(smoke_codex wrapper setup show)"
          printf '%s\n' "$show" | grep -F 'addons: none'
          test ! -e "$cfg"
          umask 0022
          smoke_codex wrapper setup --enable manager --signed-update true
          test -f "$cfg"
          test "$(stat -c '%a' "$cfg")" = 600
          test "$(stat -c '%a' "$smoke_home/.local/share")" = 755
          test "$(stat -c '%a' "$smoke_home/.local/share/codex")" = 700

          set +e
          selected="$(smoke_codex wrapper status --json)"
          selected_rc=$?
          smoke_codex wrapper --with manager -- --version >/dev/null 2>&1
          unavailable_rc=$?
          smoke_codex wrapper --with unknown >/dev/null 2>&1
          unknown_rc=$?
          set -e
          test "$selected_rc" -eq 1
          printf '%s\n' "$selected" | grep -F '"addons":"manager"'
          printf '%s\n' "$selected" | grep -F '"signed_update":true'
          test "$unavailable_rc" -eq 1
          test "$unknown_rc" -eq 2

          smoke_codex wrapper setup --bare
          reset="$(smoke_codex wrapper setup show)"
          printf '%s\n' "$reset" | grep -F 'addons: none'
          printf '%s\n' "$reset" | grep -F 'signed_update: true'

          # Symlinked wrapper.toml must fail closed on AArch64 Bionic without following or overwriting target.
          sym_target="$RUNNER_TEMP/symlink-target.toml"
          printf 'manager = false\n' > "$sym_target"
          rm -f "$cfg"
          ln -s "$sym_target" "$cfg"
          set +e
          smoke_codex wrapper setup show >/dev/null 2>&1
          sym_read_rc=$?
          smoke_codex wrapper setup --bare >/dev/null 2>&1
          sym_write_rc=$?
          smoke_codex wrapper status --json >/dev/null 2>&1
          sym_status_rc=$?
          set -e
          test "$sym_read_rc" -ne 0
          test "$sym_write_rc" -ne 0
          test "$sym_status_rc" -ne 0
          test "$(cat "$sym_target")" = 'manager = false'
          rm -f "$cfg" "$sym_target"

      - name: Exercise installer rollback and concurrency guards on Android Bionic
        shell: bash
        run: |
          set -euo pipefail
          dist="$RUNNER_TEMP/dist"
          bundle="$RUNNER_TEMP/unpacked"
          recovery="$RUNNER_TEMP/install-recovery"
          home="$recovery/home"
          prefix="$recovery/prefix"
          mkdir -p "$home" "$prefix/bin" "$prefix/tmp" "$prefix/etc/tls"
          printf 'nameserver 1.1.1.1\n' > "$prefix/etc/resolv.conf"
          : > "$prefix/etc/tls/cert.pem"
          for tool in openssl gzip; do
            cp "$(command -v "$tool")" "$prefix/bin/$tool"
          done
          # Bootstrap must reach curl and fail deterministically, offline.
          printf '#!/bin/sh\n: > "%s"\nexit 57\n' "$recovery/curl-invoked" > "$prefix/bin/curl"
          chmod 0755 "$prefix/bin/curl"
          printf '%s\n' '#!/bin/sh' 'echo ORIGINAL_WRAPPER' > "$prefix/bin/codex"
          chmod 0755 "$prefix/bin/codex"
          cp "$prefix/bin/codex" "$recovery/original"
          run_install() {
            HOME="$home" PREFIX="$prefix" TMPDIR="$prefix/tmp" PATH="$prefix/bin:$PATH" \
              "$bundle/install.sh" --binary "$bundle/bin/codex" --prefix "$prefix" "$@"
          }

          # Pre-swap validation failure must keep the old executable intact.
          printf '%s\n' '#!/bin/sh' 'exit 41' > "$recovery/invalid"
          chmod 0755 "$recovery/invalid"
          if HOME="$home" PREFIX="$prefix" TMPDIR="$prefix/tmp" PATH="$prefix/bin:$PATH" \
              "$bundle/install.sh" --binary "$recovery/invalid" --prefix "$prefix" --skip-upstream \
              > "$recovery/pre-swap.log" 2>&1; then
            echo 'invalid staged binary unexpectedly admitted' >&2
            exit 1
          fi
          cmp "$recovery/original" "$prefix/bin/codex"
          test ! -e "$prefix/bin/.codex-install.lock"

          # Post-swap bootstrap failure must restore the exact old binary.
          if run_install --version 0.169.0 > "$recovery/failed-bootstrap.log" 2>&1; then
            echo 'offline bootstrap unexpectedly succeeded' >&2
            exit 1
          fi
          test -f "$recovery/curl-invoked"
          grep -F 'restored previous codex executable' "$recovery/failed-bootstrap.log"
          cmp "$recovery/original" "$prefix/bin/codex"
          test ! -e "$prefix/bin/.codex-install.lock"
          test -z "$(find "$prefix/bin" -maxdepth 1 -name '.codex.previous.*' -print)"

          # A failed first install returns to 'not installed', not half-installed.
          rm "$prefix/bin/codex"
          rm "$recovery/curl-invoked"
          if run_install --version 0.169.0 > "$recovery/failed-first.log" 2>&1; then
            echo 'offline first install unexpectedly succeeded' >&2
            exit 1
          fi
          test -f "$recovery/curl-invoked"
          test ! -e "$prefix/bin/codex"
          test ! -e "$prefix/bin/.codex-install.lock"

          # Successful skip-upstream install commits cleanly.
          run_install --skip-upstream
          "$prefix/bin/codex" update --help | grep -F -- '--upstream'
          test ! -e "$prefix/bin/.codex-install.lock"
          test -z "$(find "$prefix/bin" -maxdepth 1 -name '.codex.previous.*' -print)"

          # Refuse unsafe destination and stale lock without mutating either.
          rm "$prefix/bin/codex"
          printf '%s\n' 'DO_NOT_TOUCH' > "$recovery/protected"
          ln -s "$recovery/protected" "$prefix/bin/codex"
          if run_install --skip-upstream > "$recovery/symlink.log" 2>&1; then exit 1; fi
          test "$(cat "$recovery/protected")" = 'DO_NOT_TOUCH'
          test -L "$prefix/bin/codex"
          test ! -e "$prefix/bin/.codex-install.lock"
          rm "$prefix/bin/codex"
          mkdir "$prefix/bin/.codex-install.lock"
          if run_install --skip-upstream > "$recovery/lock.log" 2>&1; then exit 1; fi
          test -d "$prefix/bin/.codex-install.lock"
          test ! -e "$prefix/bin/codex"
          rmdir "$prefix/bin/.codex-install.lock"

      - name: SIGKILL installer fault matrix (isolated Android/Bionic roots)
        shell: bash
        run: |
          set -euo pipefail
          PYTHONDONTWRITEBYTECODE=1 python3 .github/scripts/test_install_recovery.py

      - name: Discover immutable official inputs without deployment
        id: upstream
        if: github.event_name == 'schedule' || inputs.check_upstream == true || inputs.qualify_upstream == true
        shell: bash
        env:
          UPSTREAM_VERSION: ${{ inputs.upstream_version }}
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          set -euo pipefail
          args=()
          if [ -n "$UPSTREAM_VERSION" ]; then args+=(--version "$UPSTREAM_VERSION"); fi
          PYTHONDONTWRITEBYTECODE=1 python3 .github/scripts/qualify_wrapper.py \
            --wrapper "$RUNNER_TEMP/unpacked/bin/codex" \
            --root "$RUNNER_TEMP/upstream-discovery" --source-sha "$SOURCE_SHA" --inspect-only "${args[@]}"
          python3 - <<'PYINPUT' >> "$GITHUB_OUTPUT"
          import json, os
          from pathlib import Path
          report = json.loads((Path(os.environ['RUNNER_TEMP'])/'upstream-discovery/report.json').read_text())
          assert report['status'] == 'discovered'
          print('input_id='+report['input_id'])
          print('version='+report['inputs']['release']['upstream_version'])
          PYINPUT

      - name: Reuse only an identical completed base qualification
        id: proof
        if: github.event_name == 'schedule' || inputs.qualify_upstream == true
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ${{ runner.temp }}/upstream-proof
          key: wrapper-upstream-${{ steps.upstream.outputs.version }}-${{ steps.upstream.outputs.input_id }}
          restore-keys: |
            wrapper-upstream-${{ steps.upstream.outputs.version }}-

      - name: Reject an archive changed under a previously qualified version
        if: github.event_name == 'schedule' || inputs.qualify_upstream == true
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PYARCHIVE'
          import json, os
          from pathlib import Path
          root=Path(os.environ['RUNNER_TEMP'])
          old=root/'upstream-proof/report.json'
          if old.exists():
              proof=json.loads(old.read_text())
              discovered=json.loads((root/'upstream-discovery/report.json').read_text())
              assert proof['status']=='passed'
              previous=proof['inputs']['release']
              current=discovered['inputs']['release']
              assert previous['upstream_version']==current['upstream_version']
              assert previous['archive_sha256']==current['archive_sha256'], 'official archive changed under a known version'
          PYARCHIVE

      - name: Qualify official base runtime through the public Wrapper
        if: (github.event_name == 'schedule' || inputs.qualify_upstream == true) && steps.proof.outputs.cache-hit != 'true'
        shell: bash
        env:
          UPSTREAM_VERSION: ${{ steps.upstream.outputs.version }}
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          set -euo pipefail
          PYTHONDONTWRITEBYTECODE=1 python3 .github/scripts/qualify_wrapper.py \
            --wrapper "$RUNNER_TEMP/unpacked/bin/codex" \
            --root "$RUNNER_TEMP/upstream-qualification" --source-sha "$SOURCE_SHA" --version "$UPSTREAM_VERSION"
          mkdir -p "$RUNNER_TEMP/upstream-proof"
          cp "$RUNNER_TEMP/upstream-qualification/report.json" "$RUNNER_TEMP/upstream-proof/report.json"

      - name: Validate cached or fresh proof against exact discovered inputs
        if: github.event_name == 'schedule' || inputs.qualify_upstream == true
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PYPROOF'
          import json, os
          from pathlib import Path
          root=Path(os.environ['RUNNER_TEMP'])
          discovered=json.loads((root/'upstream-discovery/report.json').read_text())
          proof=json.loads((root/'upstream-proof/report.json').read_text())
          assert proof['status']=='passed'
          assert proof['input_id']==discovered['input_id']
          assert proof['inputs']==discovered['inputs']
          assert proof['environment']['android_api'] is None, 'Bionic host proof must not claim real Android'
          PYPROOF

      - name: Retain discovery and qualification receipts
        if: always() && (github.event_name == 'schedule' || inputs.check_upstream == true || inputs.qualify_upstream == true)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: wrapper-upstream-evidence
          path: |
            ${{ runner.temp }}/upstream-discovery/report.json
            ${{ runner.temp }}/upstream-qualification/report.json
            ${{ runner.temp }}/upstream-proof/report.json
          if-no-files-found: warn
          retention-days: 30
