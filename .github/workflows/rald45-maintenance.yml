name: RALD-4.5 bounded maintenance

on:
  push:
    branches:
      - rewrite/rust-core
    paths:
      - .github/workflows/rald45-maintenance.yml

permissions:
  contents: write

concurrency:
  group: rald45-bounded-maintenance
  cancel-in-progress: false

jobs:
  patch-and-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      EXPECTED_HEAD: 6225bf551cade12f36bc73c35f4407a9e957d2f8
    steps:
      - name: Apply activation-safe candidate probe correction
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          rm -rf repo
          git clone --branch rewrite/rust-core --single-branch "https://github.com/$GITHUB_REPOSITORY.git" repo
          cd repo
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD^)" = "$EXPECTED_HEAD"
          git status --short
          python3 <<'PY'
          from pathlib import Path

          TRANSITION = "r10-browser-helper-bridge-v1;rald4-5-activation-transition-v1"

          def once(text: str, old: str, new: str, label: str) -> str:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected one match, found {count}")
              return text.replace(old, new, 1)

          core_path = Path("crates/core/src/main.rs")
          core = core_path.read_text()
          core = once(
              core,
              'const R10_BROWSER_HELPER_BRIDGE_METADATA: &str = "r10-browser-helper-bridge-v1";\n',
              'const R10_BROWSER_HELPER_BRIDGE_METADATA: &str = "r10-browser-helper-bridge-v1";\n'
              '/// Exact backward-compatibility signal for the RALD-4.5 transition generation.\n'
              '/// Old Cores read `upstream_doctor=unsupported` only to avoid coupling activation\n'
              '/// to user credential/provider health. Corrected Cores still run public doctor.\n'
              '#[cfg(unix)]\n'
              f'const RALD45_ACTIVATION_TRANSITION_METADATA: &str = "{TRANSITION}";\n\n'
              '#[cfg(unix)]\n'
              'fn is_r10_browser_helper_bridge_metadata(value: &str) -> bool {\n'
              '    matches!(\n'
              '        value,\n'
              '        R10_BROWSER_HELPER_BRIDGE_METADATA | RALD45_ACTIVATION_TRANSITION_METADATA\n'
              '    )\n'
              '}\n',
              "core transition constant",
          )
          core = once(
              core,
              '    if manifest.creation_metadata != R10_BROWSER_HELPER_BRIDGE_METADATA {\n',
              '    if !is_r10_browser_helper_bridge_metadata(&manifest.creation_metadata) {\n',
              "core bridge recognizer",
          )
          core = once(
              core,
              '                loaded.manifest.creation_metadata == R10_BROWSER_HELPER_BRIDGE_METADATA,\n',
              '                is_r10_browser_helper_bridge_metadata(&loaded.manifest.creation_metadata),\n',
              "core installed helper layout",
          )
          core = once(
              core,
              '                source.manifest.creation_metadata == R10_BROWSER_HELPER_BRIDGE_METADATA,\n',
              '                is_r10_browser_helper_bridge_metadata(&source.manifest.creation_metadata),\n',
              "core staged helper layout",
          )
          execute_marker = '#[cfg(unix)]\nfn execute_activated_route(\n'
          public_helper = '''#[cfg(unix)]
          fn public_doctor_capability(
              creation_metadata: &str,
              declared: UpstreamDoctorCapability,
          ) -> UpstreamDoctorCapability {
              if creation_metadata == RALD45_ACTIVATION_TRANSITION_METADATA {
                  UpstreamDoctorCapability::Supported
              } else {
                  declared
              }
          }

          '''
          core = once(core, execute_marker, public_helper + execute_marker, "public doctor helper")
          core = once(
              core,
              '            doctor_capability: loaded.doctor_capability,\n',
              '            doctor_capability: public_doctor_capability(\n'
              '                &loaded.manifest.creation_metadata,\n'
              '                loaded.doctor_capability,\n'
              '            ),\n',
              "public doctor capability use",
          )
          doctor_gate = '''        if loaded.doctor_capability == UpstreamDoctorCapability::Supported
                      && probe_qualified_upstream_doctor(
                          assets,
                          process_env,
                          roots.cert_file.as_os_str(),
                          Some(roots.cert_dir.as_os_str()),
                          &roots.resolver_path,
                          &roots.config_dir,
                      )
                      .map_err(|_| LocalProductError::CandidateProbe("candidate doctor probe failed"))?
                          != UpstreamDoctorStatus::Healthy
                  {
                      return Err(LocalProductError::CandidateProbe(
                          "candidate doctor probe was unhealthy",
                      ));
                  }
          '''
          core = once(core, doctor_gate, '', "remove activation doctor gate")
          core = once(
              core,
              'fn test_m2_b4_activation_version_and_doctor_probe_failures_preserve_old_current() {',
              'fn test_m2_b4_activation_version_probe_failure_blocks_but_doctor_health_does_not() {',
              "rename probe test",
          )
          doctor_test = '''        b4_assert_public_update_rejected(
                      &doctor_failure,
                      &home,
                      &prefix,
                      &tmp,
                      b"candidate doctor probe was unhealthy",
                  );
                  assert_eq!(
                      std::fs::read(&state_paths.activation_state).unwrap(),
                      state_before
                  );
          '''
          doctor_test_new = '''        b4_assert_public_update_activated(
                      &doctor_failure,
                      &home,
                      &prefix,
                      &tmp,
                      "doctor-failure",
                  );
                  let state_after_doctor_health = read_pointer_state(&state_paths).unwrap().unwrap();
                  assert_eq!(state_after_doctor_health.current, "doctor-failure");
                  assert_eq!(
                      state_after_doctor_health.previous.as_deref(),
                      Some("probe-current")
                  );
          '''
          core = once(core, doctor_test, doctor_test_new, "candidate doctor health test")
          test_marker = '''    #[cfg(unix)]
              #[test]
              fn test_m2_b4_activation_version_probe_failure_blocks_but_doctor_health_does_not() {
          '''
          transition_test = '''    #[cfg(unix)]
              #[test]
              fn test_rald45_transition_signal_preserves_public_doctor_and_r10_layout() {
                  assert!(is_r10_browser_helper_bridge_metadata(
                      RALD45_ACTIVATION_TRANSITION_METADATA
                  ));
                  assert_eq!(
                      public_doctor_capability(
                          RALD45_ACTIVATION_TRANSITION_METADATA,
                          UpstreamDoctorCapability::Unsupported,
                      ),
                      UpstreamDoctorCapability::Supported
                  );
                  assert_eq!(
                      public_doctor_capability(
                          R10_BROWSER_HELPER_BRIDGE_METADATA,
                          UpstreamDoctorCapability::Unsupported,
                      ),
                      UpstreamDoctorCapability::Unsupported
                  );
              }

          '''
          core = once(core, test_marker, transition_test + test_marker, "transition core unit test")
          core_path.write_text(core)

          builder_path = Path("crates/release-builder/src/lib.rs")
          builder = builder_path.read_text()
          builder = once(
              builder,
              'const R10_BROWSER_HELPER_BRIDGE_METADATA: &str = "r10-browser-helper-bridge-v1";\n',
              'const R10_BROWSER_HELPER_BRIDGE_METADATA: &str = "r10-browser-helper-bridge-v1";\n'
              f'const RALD45_ACTIVATION_TRANSITION_METADATA: &str = "{TRANSITION}";\n\n'
              'fn is_r10_browser_helper_bridge_metadata(value: &str) -> bool {\n'
              '    matches!(\n'
              '        value,\n'
              '        R10_BROWSER_HELPER_BRIDGE_METADATA | RALD45_ACTIVATION_TRANSITION_METADATA\n'
              '    )\n'
              '}\n\n'
              'fn upstream_doctor_descriptor_capability(creation_metadata: &str) -> &\'static str {\n'
              '    if creation_metadata == RALD45_ACTIVATION_TRANSITION_METADATA {\n'
              '        "unsupported"\n'
              '    } else {\n'
              '        "supported"\n'
              '    }\n'
              '}\n',
              "builder transition helpers",
          )
          validator_old = '''    let creation_metadata = publish_descriptor_field(&mut lines, "creation_metadata")?;
              if (creation_metadata == R10_BROWSER_HELPER_BRIDGE_METADATA) != r10_bridge
                  || publish_descriptor_field(&mut lines, "upstream_doctor")? != "supported"
                  || publish_descriptor_field(&mut lines, "helper_count")? != "2"
              {
          '''
          validator_new = '''    let creation_metadata = publish_descriptor_field(&mut lines, "creation_metadata")?;
              let upstream_doctor = publish_descriptor_field(&mut lines, "upstream_doctor")?;
              if is_r10_browser_helper_bridge_metadata(creation_metadata) != r10_bridge
                  || upstream_doctor != upstream_doctor_descriptor_capability(creation_metadata)
                  || publish_descriptor_field(&mut lines, "helper_count")? != "2"
              {
          '''
          builder = once(builder, validator_old, validator_new, "builder publish validator")
          builder = once(
              builder,
              '        request.creation_metadata == R10_BROWSER_HELPER_BRIDGE_METADATA,\n',
              '        is_r10_browser_helper_bridge_metadata(&request.creation_metadata),\n',
              "builder helper layout",
          )
          builder = once(
              builder,
              '            "upstream_doctor\\tsupported\\\n",\n',
              '            "upstream_doctor\\t{}\\\n",\n',
              "builder descriptor placeholder",
          )
          builder = once(
              builder,
              '        request.creation_metadata,\n        TERMUX_BROWSER_OPEN_HELPER_IDENTITY,\n',
              '        request.creation_metadata,\n'
              '        upstream_doctor_descriptor_capability(&request.creation_metadata),\n'
              '        TERMUX_BROWSER_OPEN_HELPER_IDENTITY,\n',
              "builder descriptor argument",
          )
          builder_test_marker = '''    #[test]
              fn test_tc_live_bridge_build_and_publish_are_marker_bound_and_r10_readable() {
          '''
          builder_test = '''    #[test]
              fn test_rald45_transition_marker_is_exact_legacy_activation_signal() {
                  assert!(is_r10_browser_helper_bridge_metadata(
                      RALD45_ACTIVATION_TRANSITION_METADATA
                  ));
                  assert_eq!(
                      upstream_doctor_descriptor_capability(RALD45_ACTIVATION_TRANSITION_METADATA),
                      "unsupported"
                  );
                  assert_eq!(
                      upstream_doctor_descriptor_capability(R10_BROWSER_HELPER_BRIDGE_METADATA),
                      "supported"
                  );
                  assert_eq!(upstream_doctor_descriptor_capability("test-fixture"), "supported");
              }

          '''
          builder = once(
              builder,
              builder_test_marker,
              builder_test + builder_test_marker,
              "builder transition unit test",
          )
          builder_path.write_text(builder)
          PY

          cargo fmt --all
          cargo fmt --all -- --check
          git diff --check
          PREFIX=/usr TMPDIR=/tmp cargo test --workspace
          git status --short
          test -n "$(git status --porcelain -- crates/core/src/main.rs crates/release-builder/src/lib.rs)"
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add crates/core/src/main.rs crates/release-builder/src/lib.rs
          git commit -m 'fix: decouple activation probe from doctor health'
          test "$(git rev-parse HEAD^)" = "$GITHUB_SHA"
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push origin HEAD:rewrite/rust-core
