name: RALD-4.5 bounded maintenance

on:
  push:
    branches:
      - rewrite/rust-core
    paths:
      - .github/workflows/rald45-maintenance.yml

permissions:
  contents: write

concurrency:
  group: rald45-bounded-maintenance
  cancel-in-progress: false

jobs:
  patch-and-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      EXPECTED_HEAD: 484704cf7c157bb06652a268a8e6c87173141e9b
    steps:
      - name: Apply and verify bounded RALD-4.5 transition workflow
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          rm -rf repo
          git clone --branch rewrite/rust-core --single-branch "https://github.com/$GITHUB_REPOSITORY.git" repo
          cd repo
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD^)" = "$EXPECTED_HEAD"
          test -z "$(git status --porcelain)"

          python3 .github/scripts/rald45_patch.py
          python3 <<'PY'
          from pathlib import Path
          path = Path('.github/scripts/test_rald5_workflow.py')
          text = path.read_text()
          old = '        self.assertIn("test "$doctor_capability" = unsupported", candidate_build)\n'
          new = '        self.assertIn(\'test "$doctor_capability" = unsupported\', candidate_build)\n'
          if text.count(old) != 1:
              raise SystemExit('workflow contract quoting anchor mismatch')
          path.write_text(text.replace(old, new, 1))
          PY
          python3 -m py_compile \
            .github/scripts/rald45_patch.py \
            .github/scripts/test_rald5_workflow.py
          python3 .github/scripts/test_rald5_workflow.py
          ruby -e 'require "psych"; Psych.parse_file(ARGV.fetch(0))' \
            .github/workflows/auto-release-termux.yml
          git diff --check

          changed="$(git status --porcelain | awk '{print $2}' | LC_ALL=C sort)"
          expected="$(printf '%s\n' \
            .github/scripts/test_rald5_workflow.py \
            .github/workflows/auto-release-termux.yml | LC_ALL=C sort)"
          test "$changed" = "$expected"

          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .github/workflows/auto-release-termux.yml .github/scripts/test_rald5_workflow.py
          git commit -m 'ci: add bounded RALD-4.5 transition proof'
          test "$(git rev-parse HEAD^)" = "$GITHUB_SHA"
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push origin HEAD:rewrite/rust-core
