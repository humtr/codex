name: RALD-4.5 bounded maintenance

on:
  push:
    branches:
      - rewrite/rust-core
    paths:
      - .github/workflows/rald45-maintenance.yml

permissions:
  contents: write

concurrency:
  group: rald45-bounded-maintenance
  cancel-in-progress: false

jobs:
  patch-and-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      EXPECTED_HEAD: 34ed9393c269c8cb8438d5be500fb10532eac4b1
    steps:
      - name: Apply and verify activation-safe candidate probe correction
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          rm -rf repo
          git clone --branch rewrite/rust-core --single-branch "https://github.com/$GITHUB_REPOSITORY.git" repo
          cd repo
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD^)" = "$EXPECTED_HEAD"
          test -z "$(git status --porcelain)"

          python3 .github/scripts/rald45_patch.py
          cargo fmt --all
          cargo fmt --all -- --check
          git diff --check

          # Compile every workspace test target, then execute the environment-independent
          # contracts that carry activation, admission, anti-rollback, public doctor,
          # browser-layout, and transition semantics on a hosted Linux runner.
          cargo test --workspace --no-run
          cargo test -p codex --bin codex test_m2_b4_
          cargo test -p codex --bin codex test_m2_b5_
          cargo test -p codex --bin codex test_m2_b7_
          cargo test -p codex --bin codex test_arh1_
          cargo test -p codex --bin codex doctor
          cargo test -p codex --bin codex test_r10_
          cargo test -p codex --bin codex test_rald45_transition_signal_preserves_public_doctor_semantics
          cargo test -p codex-release-builder test_rald45_transition_flag_is_exact_and_legacy_bounded
          cargo test -p codex-release-builder test_tc_live_bridge_build_and_publish_are_marker_bound_and_r10_readable

          test -n "$(git status --porcelain -- crates/core/src/main.rs crates/release-builder/src/lib.rs)"
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add crates/core/src/main.rs crates/release-builder/src/lib.rs
          git commit -m 'fix: decouple activation probe from doctor health'
          test "$(git rev-parse HEAD^)" = "$GITHUB_SHA"
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push origin HEAD:rewrite/rust-core
