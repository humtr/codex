name: RALD-4.5 bounded maintenance

on:
  push:
    branches:
      - rewrite/rust-core
    paths:
      - .github/workflows/rald45-maintenance.yml

permissions:
  contents: write

concurrency:
  group: rald45-bounded-maintenance
  cancel-in-progress: false

jobs:
  patch-and-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      EXPECTED_HEAD: 0505cd63d6eac2245449b9f3ca10a030a8e714c4
    steps:
      - name: Apply and verify activation-safe candidate probe correction
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          rm -rf repo
          git clone --branch rewrite/rust-core --single-branch "https://github.com/$GITHUB_REPOSITORY.git" repo
          cd repo
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD^)" = "$EXPECTED_HEAD"
          test -z "$(git status --porcelain)"

          python3 .github/scripts/rald45_patch.py
          python3 <<'PY'
          from pathlib import Path
          path = Path('crates/release-builder/src/lib.rs')
          text = path.read_text()
          old = '        let mut fixture = Fixture::new("rald45-transition-flag");\n'
          new = '        let mut fixture = fixture("rald45-transition-flag", happy_entries("0.150.1"), false);\n'
          if text.count(old) != 1:
              raise SystemExit('transition test fixture anchor mismatch')
          path.write_text(text.replace(old, new, 1))
          PY
          cargo fmt --all
          cargo fmt --all -- --check
          git diff --check

          cargo test --workspace --no-run
          PREFIX=/usr TMPDIR=/tmp cargo test -p codex --bin codex test_m2_b4_
          PREFIX=/usr TMPDIR=/tmp cargo test -p codex --bin codex test_m2_b5_
          PREFIX=/usr TMPDIR=/tmp cargo test -p codex --bin codex test_m2_b7_
          PREFIX=/usr TMPDIR=/tmp cargo test -p codex --bin codex test_arh1_
          PREFIX=/usr TMPDIR=/tmp cargo test -p codex --bin codex doctor
          PREFIX=/usr TMPDIR=/tmp cargo test -p codex --bin codex test_r10_
          PREFIX=/usr TMPDIR=/tmp cargo test -p codex --bin codex test_rald45_transition_signal_preserves_public_doctor_semantics
          cargo test -p codex-release-builder test_rald45_transition_flag_is_exact_and_legacy_bounded
          cargo test -p codex-release-builder test_tc_live_bridge_build_and_publish_are_marker_bound_and_r10_readable

          test -n "$(git status --porcelain -- crates/core/src/main.rs crates/release-builder/src/lib.rs)"
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add crates/core/src/main.rs crates/release-builder/src/lib.rs
          git commit -m 'fix: decouple activation probe from doctor health'
          test "$(git rev-parse HEAD^)" = "$GITHUB_SHA"
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push origin HEAD:rewrite/rust-core
