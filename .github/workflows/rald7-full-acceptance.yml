name: Rust Core full source acceptance

on:
  push:
    branches:
      - rewrite/rust-core
    paths:
      - '.github/**'
      - 'crates/**'
      - 'scripts/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'install*.sh'
      - 'bootstrap/**'
      - 'SPEC.md'
      - 'GOAL.md'
      - 'WORKBOARD.md'
      - 'AGENTS.md'

permissions:
  contents: read

concurrency:
  group: rald7-full-source-acceptance
  cancel-in-progress: false

env:
  RUST_VERSION: '1.98.0'
  ANDROID_API: '24'
  ANDROID_NDK_VERSION: '27.3.13750724'
  ANDROID_RUNTIME_APEX_COMMIT: '8aeb37cca394ce39c1311744c60960cbd466aa77'
  ANDROID_RUNTIME_APEX_SHA256: '83bf0dce249728dae48149b80d28b48115c54adad95a352120d58a6ac669d1fc'
  TERMUX_TEST_PREFIX: '/data/data/com.termux/files/usr'
  TERMUX_TEST_TMPDIR: '/data/data/com.termux/files/usr/tmp'
  PUBLIC_KEY_URL: 'https://github.com/humtr/codex/releases/download/local-hosted-0-154-0-37fbbd8033b8-rald45-transition/update-public-key.pem'
  PUBLIC_KEY_SHA256: '62ab1640b6b4e63afbd5952d11a0bd0a9f1cb78ddde2472e003a42c4db2b832c'

jobs:
  contract:
    name: Workflow, credential, and diff gate
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Fetch exact acceptance source
        shell: bash
        run: |
          set -euo pipefail
          git init source
          git -C source remote add origin "https://github.com/$GITHUB_REPOSITORY.git"
          git -C source fetch --no-tags --depth=2 origin "$GITHUB_SHA"
          git -C source checkout --detach FETCH_HEAD
          test "$(git -C source rev-parse HEAD)" = "$GITHUB_SHA"

      - name: Validate workflow syntax and action pins
        shell: bash
        run: |
          set -euo pipefail
          cd source
          for workflow in .github/workflows/*.yml; do
            ruby -e 'require "psych"; Psych.parse_file(ARGV.fetch(0))' "$workflow"
          done
          python3 -m py_compile .github/scripts/test_rald7_acceptance.py
          python3 .github/scripts/test_rald7_acceptance.py
          git diff --check HEAD^ HEAD

  android-core:
    name: Build event Android/AArch64 Core proof artifact
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Fetch exact event product source
        shell: bash
        run: |
          set -euo pipefail
          git init product
          git -C product remote add origin "https://github.com/$GITHUB_REPOSITORY.git"
          git -C product fetch --no-tags --depth=1 origin "$GITHUB_SHA"
          git -C product checkout --detach FETCH_HEAD
          test "$(git -C product rev-parse HEAD)" = "$GITHUB_SHA"

      - name: Cross-build Android/AArch64 Core
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install "$RUST_VERSION" --profile minimal --target aarch64-linux-android
          ndk="$ANDROID_SDK_ROOT/ndk/$ANDROID_NDK_VERSION"
          toolchain="$ndk/toolchains/llvm/prebuilt/linux-x86_64/bin"
          linker="$toolchain/aarch64-linux-android$ANDROID_API-clang"
          test -x "$linker"
          test -x "$toolchain/llvm-ar"
          export CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER="$linker"
          export CC_aarch64_linux_android="$linker"
          export AR_aarch64_linux_android="$toolchain/llvm-ar"
          cargo "+$RUST_VERSION" build --release --locked             --manifest-path product/Cargo.toml             --target aarch64-linux-android -p codex
          core="product/target/aarch64-linux-android/release/codex"
          test -x "$core"
          file "$core" | grep -F 'ARM aarch64'
          readelf -l "$core" | grep -F '/system/bin/linker64'
          mkdir -p "$RUNNER_TEMP/rald7-android-core"
          cp "$core" "$RUNNER_TEMP/rald7-android-core/codex"
          chmod 0755 "$RUNNER_TEMP/rald7-android-core/codex"

      - name: Transfer unsigned test-only Core artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: rald7-accepted-android-core
          path: ${{ runner.temp }}/rald7-android-core/codex
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  workspace:
    name: Locked workspace check, test, clippy, and fmt
    needs: android-core
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 45
    steps:
      - name: Fetch exact acceptance source
        shell: bash
        run: |
          set -euo pipefail
          git init source
          git -C source remote add origin "https://github.com/$GITHUB_REPOSITORY.git"
          git -C source fetch --no-tags --depth=2 origin "$GITHUB_SHA"
          git -C source checkout --detach FETCH_HEAD
          test "$(git -C source rev-parse HEAD)" = "$GITHUB_SHA"

      - name: Download accepted Android Core proof artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: rald7-accepted-android-core
          path: ${{ runner.temp }}/rald7-android-core

      - name: Provision pinned Android bionic execution substrate
        shell: bash
        run: |
          set -euo pipefail
          core="$RUNNER_TEMP/rald7-android-core/codex"
          chmod 0755 "$core"
          test -x "$core"
          file "$core" | grep -F 'ARM aarch64'
          readelf -l "$core" | grep -F '/system/bin/linker64'
          printf 'RALD7_ANDROID_CORE=%s\n' "$core" >> "$GITHUB_ENV"

          for tool in curl base64 unzip debugfs file readelf sha256sum; do
            command -v "$tool" >/dev/null
          done
          sudo test ! -e /system
          root="$RUNNER_TEMP/rald7-bionic"
          mkdir -p "$root/bin" "$root/lib64/bionic"
          apex_url="https://android.googlesource.com/platform/prebuilts/runtime/+/$ANDROID_RUNTIME_APEX_COMMIT/mainline/runtime/apex/com.android.runtime-arm64.apex?format=TEXT"
          curl --fail --silent --show-error --location --proto '=https' --tlsv1.2             --connect-timeout 15 --max-time 120 --max-filesize 20971520             --output "$root/runtime.apex.b64" "$apex_url"
          base64 --decode "$root/runtime.apex.b64" > "$root/runtime.apex"
          test "$(wc -c < "$root/runtime.apex")" -eq 13881344
          test "$(sha256sum "$root/runtime.apex" | awk '{print $1}')" = "$ANDROID_RUNTIME_APEX_SHA256"
          unzip -p "$root/runtime.apex" apex_payload.img > "$root/apex_payload.img"
          test "$(wc -c < "$root/apex_payload.img")" -eq 13783040
          debugfs -R "dump -p /bin/linker64 $root/bin/linker64" "$root/apex_payload.img" >/dev/null 2>&1
          for library in libc.so libdl.so libm.so; do
            debugfs -R "dump -p /lib64/bionic/$library $root/lib64/bionic/$library"               "$root/apex_payload.img" >/dev/null 2>&1
          done
          sudo mkdir -p /system/bin /system/lib64
          sudo install -m 0755 "$root/bin/linker64" /system/bin/linker64
          for library in libc.so libdl.so libm.so; do
            sudo install -m 0644 "$root/lib64/bionic/$library" "/system/lib64/$library"
          done
          rm -f "$root/runtime.apex.b64" "$root/runtime.apex" "$root/apex_payload.img"
          "$core" update --help >/dev/null

      - name: Provision deterministic Termux test tools
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -m)" = aarch64
          sudo mkdir -p "$TERMUX_TEST_PREFIX/bin" "$TERMUX_TEST_TMPDIR"
          for tool in sh openssl curl script gzip cat chmod; do
            source_path="$(command -v "$tool")"
            test -f "$source_path" -o -L "$source_path"
            sudo install -m 0755 "$source_path" "$TERMUX_TEST_PREFIX/bin/$tool"
          done
          clang_path="$(command -v clang)"
          test -f "$clang_path" -o -L "$clang_path"
          sudo ln -s "$clang_path" "$TERMUX_TEST_PREFIX/bin/clang"
          sudo chown -R "$(id -u):$(id -g)" /data/data/com.termux
          printf 'PREFIX=%s\n' "$TERMUX_TEST_PREFIX" >> "$GITHUB_ENV"
          printf 'TMPDIR=%s\n' "$TERMUX_TEST_TMPDIR" >> "$GITHUB_ENV"
          for tool in sh openssl curl script gzip clang cat chmod; do
            test -x "$TERMUX_TEST_PREFIX/bin/$tool"
          done
          test ! -L "$TERMUX_TEST_PREFIX/bin/gzip"
          test ! -L "$TERMUX_TEST_PREFIX/bin/openssl"

      - name: Cargo check
        shell: bash
        run: |
          set -euo pipefail
          cd source
          cargo check --workspace --locked

      - name: Python migration and hosted contracts
        shell: bash
        run: |
          set -euo pipefail
          cd source
          python3 -m unittest -v scripts/test_shared_state_migrate.py scripts/test_shared_visibility_transition.py
          python3 -m unittest discover -s .github/scripts -p 'test_*.py'

      - name: Full workspace and Android focused proofs in private proc
        shell: bash
        run: |
          set -euo pipefail
          cd source
          # Record only native visibility metadata, never executable paths/argv.
          python3 - <<'PYPROC'
          from pathlib import Path
          import os
          uid = os.getuid()
          denied = 0
          for proc in Path('/proc').iterdir():
              if not proc.name.isdigit():
                  continue
              operation = 'status'
              owner = None
              try:
                  owner = proc.stat().st_uid
                  status = (proc / 'status').read_text()
                  ids = next(line.split()[1:] for line in status.splitlines() if line.startswith('Uid:'))
                  if str(uid) not in ids:
                      continue
                  stat = (proc / 'stat').read_text().rsplit(')', 1)[1].split()
                  if stat[0] in {'Z', 'X'} and stat[17] == '1':
                      continue
                  operation = 'exe'
                  (proc / 'exe').readlink()
                  operation = 'fd'
                  for fd in (proc / 'fd').iterdir():
                      try:
                          fd.readlink()
                      except FileNotFoundError:
                          pass
              except PermissionError as error:
                  denied += 1
                  print(f'host-proc incomplete metadata_uid={owner} local_uid={uid} op={operation} errno={error.errno}')
              except (FileNotFoundError, ProcessLookupError, StopIteration):
                  pass
          print(f'host-proc denied reads={denied}; positive proofs require a private proc view')
          PYPROC
          # /proc belongs to the proof, while access checks use the real runner UID.
          # Dropping root preserves the deliberately unreadable live-child test.
          test "$(id -u)" -ne 0
          sudo unshare --mount --pid --fork --mount-proc --propagation private \
            setpriv --reuid="$(id -u)" --regid="$(id -g)" --init-groups \
              --bounding-set=-all --inh-caps=-all --ambient-caps=-all \
            env PATH="$PATH" HOME="$HOME" \
              RUSTUP_HOME="${RUSTUP_HOME:-$HOME/.rustup}" CARGO_HOME="${CARGO_HOME:-$HOME/.cargo}" \
              PREFIX="$PREFIX" TMPDIR="$TMPDIR" RALD7_ANDROID_CORE="$RALD7_ANDROID_CORE" \
            bash --noprofile --norc -e -o pipefail -c '
              test "$(id -u)" -ne 0
              cargo test --workspace --locked -- --test-threads=1 \
                --skip test_r6_builder_publish_output_enters_existing_signed_release_admission \
                --skip test_rald1_local_derived_fallback_and_explicit_build_preserve_public_authority \
                --skip test_manager_tui_public_local_build_preserves_pair_and_refuses_unpaired_update
              CODEX_B10_RELEASE_CORE="$RALD7_ANDROID_CORE" cargo test --locked -p codex tests::test_r6_builder_publish_output_enters_existing_signed_release_admission -- --exact --nocapture --test-threads=1
              CODEX_B10_RELEASE_CORE="$RALD7_ANDROID_CORE" cargo test --locked -p codex tests::test_rald1_local_derived_fallback_and_explicit_build_preserve_public_authority -- --exact --nocapture --test-threads=1
              CODEX_B10_RELEASE_CORE="$RALD7_ANDROID_CORE" cargo test --locked -p codex tests::test_manager_tui_public_local_build_preserves_pair_and_refuses_unpaired_update -- --exact --nocapture --test-threads=1
            '

      - name: Clippy warnings are errors
        shell: bash
        run: |
          set -euo pipefail
          cd source
          cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Rust formatting
        shell: bash
        run: |
          set -euo pipefail
          cd source
          cargo fmt --all -- --check

  public-audit:
    name: Authenticated public-stable snapshot audit
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Fetch event audit source
        shell: bash
        run: |
          set -euo pipefail
          git init source
          git -C source remote add origin "https://github.com/$GITHUB_REPOSITORY.git"
          git -C source fetch --no-tags --depth=2 origin "$GITHUB_SHA"
          git -C source checkout --detach FETCH_HEAD
          test "$(git -C source rev-parse HEAD)" = "$GITHUB_SHA"

      - name: Verify authenticated stable snapshot and every published byte
        shell: bash
        run: |
          set -euo pipefail
          cd source
          main_sha="$(git ls-remote --exit-code "https://github.com/$GITHUB_REPOSITORY.git" refs/heads/main | awk '{print $1}')"
          [[ "$main_sha" =~ ^[0-9a-f]{40}$ ]]
          root="$RUNNER_TEMP/rald7-public"
          mkdir -p "$root"
          fetch() {
            curl --fail --silent --show-error --location --proto '=https' --tlsv1.2 --connect-timeout 15 --max-time "$3" --max-filesize "$4" --output "$2" "$1"
          }
          exact="https://raw.githubusercontent.com/$GITHUB_REPOSITORY/$main_sha"
          fetch "$exact/update-index-v1" "$root/update-index-v1" 60 16384
          fetch "$exact/update-index-v1.sig" "$root/update-index-v1.sig" 60 1024
          fetch "$PUBLIC_KEY_URL" "$root/update-public-key.pem" 60 16384
          test "$(sha256sum "$root/update-public-key.pem" | awk '{print $1}')" = "$PUBLIC_KEY_SHA256"
          test "$(wc -c < "$root/update-index-v1.sig")" -eq 64
          openssl pkeyutl -verify -rawin -pubin -inkey "$root/update-public-key.pem" -in "$root/update-index-v1" -sigfile "$root/update-index-v1.sig" >/dev/null
          python3 - "$root" <<'PY'
          from pathlib import Path
          import sys
          sys.path.insert(0, '.github/scripts')
          from rald5_publication import parse_index
          root = Path(sys.argv[1])
          index = parse_index(root / 'update-index-v1')
          (root / 'locator').write_text(index['generation_id'] + '\n' + index['release_base'] + '\n')
          PY
          generation="$(sed -n '1p' "$root/locator")"
          release_base="$(sed -n '2p' "$root/locator")"
          release="$root/$generation"
          mkdir -p "$release"
          cp "$root/update-index-v1" "$root/update-index-v1.sig" "$release/"
          fetch "${release_base}release.manifest" "$release/release.manifest" 60 131072
          fetch "${release_base}release.sig" "$release/release.sig" 60 1024
          test "$(wc -c < "$release/release.sig")" -eq 64
          openssl pkeyutl -verify -rawin -pubin -inkey "$root/update-public-key.pem" -in "$release/release.manifest" -sigfile "$release/release.sig" >/dev/null
          python3 - "$release" "$generation" <<'PY'
          from pathlib import Path
          import sys
          sys.path.insert(0, '.github/scripts')
          from rald5_publication import parse_manifest
          release = Path(sys.argv[1])
          manifest, files = parse_manifest(release / 'release.manifest')
          assert manifest['generation_id'] == sys.argv[2], 'snapshot generation mismatch'
          (release.parent / 'sequence').write_text(manifest['release_sequence'] + '\n')
          (release.parent / 'inventory').write_text(''.join('\t'.join(row) + '\n' for row in files))
          PY
          sequence="$(cat "$root/sequence")"
          total=0
          tab="$(printf '\t')"
          while IFS="$tab" read -r rel digest mode; do
            target="$release/$rel"
            mkdir -p "$(dirname "$target")"
            fetch "${release_base}$rel" "$target" 300 536870912
            test "$(sha256sum "$target" | awk '{print $1}')" = "$digest"
            chmod "$mode" "$target"
            total=$((total + $(wc -c < "$target")))
            test "$total" -le 1073741824
          done < "$root/inventory"
          mkdir "$release/compat"
          fetch "${release_base}compat/download-size-v1" "$release/compat/download-size-v1" 60 131072
          fetch "${release_base}compat/download-size-v1.sig" "$release/compat/download-size-v1.sig" 60 1024
          python3 .github/scripts/rald5_publication.py verify-public --root "$root" --generation "$generation" --release-sequence "$sequence" --release-base "$release_base" --public-key "$root/update-public-key.pem" --require-download-size
          test "$(git ls-remote --exit-code "https://github.com/$GITHUB_REPOSITORY.git" refs/heads/main | awk '{print $1}')" = "$main_sha"
          printf 'Authenticated public snapshot %s, sequence %s, main %s\n' "$generation" "$sequence" "$main_sha"

  accepted:
    name: Rust Core source acceptance
    needs: [contract, workspace, public-audit]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - name: Require every source gate
        shell: bash
        run: |
          set -euo pipefail
          test '${{ needs.contract.result }}' = success
          test '${{ needs.workspace.result }}' = success
          test '${{ needs.public-audit.result }}' = success
          printf 'Event-revision source acceptance gates are green\n'
