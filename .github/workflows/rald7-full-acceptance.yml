name: UX-1 full source acceptance

on:
  push:
    branches:
      - rewrite/rust-core
    paths:
      - .github/workflows/auto-release-termux.yml
      - .github/workflows/publish-termux-update-pages.yml
      - .github/workflows/rald7-full-acceptance.yml
      - .github/scripts/test_rald7_acceptance.py
      - crates/core/src/main.rs
      - SPEC.md
      - GOAL.md
      - WORKBOARD.md
      - RELEASE_AUTOMATION_PLAN.md

permissions:
  contents: read

concurrency:
  group: rald7-full-source-acceptance
  cancel-in-progress: false

env:
  EXPECTED_PARENT: 'd50ce013daa6b27cab8075761d8a1b234f3cdb81'
  RUST_VERSION: '1.98.0'
  ANDROID_API: '24'
  ANDROID_NDK_VERSION: '27.3.13750724'
  ANDROID_RUNTIME_APEX_COMMIT: '8aeb37cca394ce39c1311744c60960cbd466aa77'
  ANDROID_RUNTIME_APEX_SHA256: '83bf0dce249728dae48149b80d28b48115c54adad95a352120d58a6ac669d1fc'
  TERMUX_TEST_PREFIX: '/data/data/com.termux/files/usr'
  TERMUX_TEST_TMPDIR: '/data/data/com.termux/files/usr/tmp'
  EXPECTED_MAIN: '56ba28e1baee87721767ba34b505cc2bc1303c44'
  ACCEPTED_SOURCE: 'd50ce013daa6b27cab8075761d8a1b234f3cdb81'
  PUBLIC_GENERATION: 'local-hosted-0-155-1-7817b939c81c-exact-current-fastpath'
  PUBLIC_SEQUENCE: '17'
  PUBLIC_KEY_SHA256: '62ab1640b6b4e63afbd5952d11a0bd0a9f1cb78ddde2472e003a42c4db2b832c'

jobs:
  contract:
    name: Workflow, credential, and diff gate
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Fetch exact acceptance source
        shell: bash
        run: |
          set -euo pipefail
          git init source
          git -C source remote add origin "https://github.com/$GITHUB_REPOSITORY.git"
          git -C source fetch --no-tags --depth=64 origin "$GITHUB_SHA"
          git -C source checkout --detach FETCH_HEAD
          test "$(git -C source rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git -C source rev-parse HEAD^)" = "$EXPECTED_PARENT"

      - name: Validate workflow syntax and action pins
        shell: bash
        run: |
          set -euo pipefail
          cd source
          for workflow in .github/workflows/*.yml; do
            ruby -e 'require "psych"; Psych.parse_file(ARGV.fetch(0))' "$workflow"
          done
          python3 -m py_compile .github/scripts/test_rald7_acceptance.py
          python3 .github/scripts/test_rald7_acceptance.py
          git diff --check "$EXPECTED_PARENT..HEAD"

  android-core:
    name: Build accepted Android/AArch64 Core proof artifact
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Fetch exact accepted product source
        shell: bash
        run: |
          set -euo pipefail
          git init product
          git -C product remote add origin "https://github.com/$GITHUB_REPOSITORY.git"
          git -C product fetch --no-tags --depth=1 origin "$ACCEPTED_SOURCE"
          git -C product checkout --detach FETCH_HEAD
          test "$(git -C product rev-parse HEAD)" = "$ACCEPTED_SOURCE"

      - name: Cross-build Android/AArch64 Core
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install "$RUST_VERSION" --profile minimal --target aarch64-linux-android
          ndk="$ANDROID_SDK_ROOT/ndk/$ANDROID_NDK_VERSION"
          toolchain="$ndk/toolchains/llvm/prebuilt/linux-x86_64/bin"
          linker="$toolchain/aarch64-linux-android$ANDROID_API-clang"
          test -x "$linker"
          test -x "$toolchain/llvm-ar"
          export CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER="$linker"
          export CC_aarch64_linux_android="$linker"
          export AR_aarch64_linux_android="$toolchain/llvm-ar"
          cargo "+$RUST_VERSION" build --release --locked             --manifest-path product/Cargo.toml             --target aarch64-linux-android -p codex
          core="product/target/aarch64-linux-android/release/codex"
          test -x "$core"
          file "$core" | grep -F 'ARM aarch64'
          readelf -l "$core" | grep -F '/system/bin/linker64'
          mkdir -p "$RUNNER_TEMP/rald7-android-core"
          cp "$core" "$RUNNER_TEMP/rald7-android-core/codex"
          chmod 0755 "$RUNNER_TEMP/rald7-android-core/codex"

      - name: Transfer unsigned test-only Core artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: rald7-accepted-android-core
          path: ${{ runner.temp }}/rald7-android-core/codex
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  packages:
    name: Package full tests
    needs: android-core
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 45
    steps:
      - name: Fetch exact acceptance source
        shell: bash
        run: |
          set -euo pipefail
          git init source
          git -C source remote add origin "https://github.com/$GITHUB_REPOSITORY.git"
          git -C source fetch --no-tags --depth=1 origin "$GITHUB_SHA"
          git -C source checkout --detach FETCH_HEAD
          test "$(git -C source rev-parse HEAD)" = "$GITHUB_SHA"

      - name: Download accepted Android Core proof artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: rald7-accepted-android-core
          path: ${{ runner.temp }}/rald7-android-core

      - name: Provision pinned Android bionic execution substrate
        shell: bash
        run: |
          set -euo pipefail
          core="$RUNNER_TEMP/rald7-android-core/codex"
          chmod 0755 "$core"
          test -x "$core"
          file "$core" | grep -F 'ARM aarch64'
          readelf -l "$core" | grep -F '/system/bin/linker64'
          printf 'RALD7_ANDROID_CORE=%s\n' "$core" >> "$GITHUB_ENV"

          for tool in curl base64 unzip debugfs file readelf sha256sum; do
            command -v "$tool" >/dev/null
          done
          sudo test ! -e /system
          root="$RUNNER_TEMP/rald7-bionic"
          mkdir -p "$root/bin" "$root/lib64/bionic"
          apex_url="https://android.googlesource.com/platform/prebuilts/runtime/+/$ANDROID_RUNTIME_APEX_COMMIT/mainline/runtime/apex/com.android.runtime-arm64.apex?format=TEXT"
          curl --fail --silent --show-error --location --proto '=https' --tlsv1.2             --connect-timeout 15 --max-time 120 --max-filesize 20971520             --output "$root/runtime.apex.b64" "$apex_url"
          base64 --decode "$root/runtime.apex.b64" > "$root/runtime.apex"
          test "$(wc -c < "$root/runtime.apex")" -eq 13881344
          test "$(sha256sum "$root/runtime.apex" | awk '{print $1}')" = "$ANDROID_RUNTIME_APEX_SHA256"
          unzip -p "$root/runtime.apex" apex_payload.img > "$root/apex_payload.img"
          test "$(wc -c < "$root/apex_payload.img")" -eq 13783040
          debugfs -R "dump -p /bin/linker64 $root/bin/linker64" "$root/apex_payload.img" >/dev/null 2>&1
          for library in libc.so libdl.so libm.so; do
            debugfs -R "dump -p /lib64/bionic/$library $root/lib64/bionic/$library"               "$root/apex_payload.img" >/dev/null 2>&1
          done
          sudo mkdir -p /system/bin /system/lib64
          sudo install -m 0755 "$root/bin/linker64" /system/bin/linker64
          for library in libc.so libdl.so libm.so; do
            sudo install -m 0644 "$root/lib64/bionic/$library" "/system/lib64/$library"
          done
          rm -f "$root/runtime.apex.b64" "$root/runtime.apex" "$root/apex_payload.img"
          "$core" update --help >/dev/null

      - name: Provision deterministic Termux test tools
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -m)" = aarch64
          sudo mkdir -p "$TERMUX_TEST_PREFIX/bin" "$TERMUX_TEST_TMPDIR"
          for tool in sh openssl curl script gzip cat chmod; do
            source_path="$(command -v "$tool")"
            test -f "$source_path" -o -L "$source_path"
            sudo install -m 0755 "$source_path" "$TERMUX_TEST_PREFIX/bin/$tool"
          done
          clang_path="$(command -v clang)"
          test -f "$clang_path" -o -L "$clang_path"
          sudo ln -s "$clang_path" "$TERMUX_TEST_PREFIX/bin/clang"
          sudo chown -R "$(id -u):$(id -g)" /data/data/com.termux
          printf 'PREFIX=%s\n' "$TERMUX_TEST_PREFIX" >> "$GITHUB_ENV"
          printf 'TMPDIR=%s\n' "$TERMUX_TEST_TMPDIR" >> "$GITHUB_ENV"
          for tool in sh openssl curl script gzip clang cat chmod; do
            test -x "$TERMUX_TEST_PREFIX/bin/$tool"
          done
          test ! -L "$TERMUX_TEST_PREFIX/bin/gzip"
          test ! -L "$TERMUX_TEST_PREFIX/bin/openssl"

      - name: Release-builder full tests
        shell: bash
        run: |
          set -euo pipefail
          cd source
          cargo test --locked -p codex-release-builder

      - name: Core full tests including process E2E
        shell: bash
        run: |
          set -euo pipefail
          cd source
          cargo test --locked -p codex --             --skip test_r6_builder_publish_output_enters_existing_signed_release_admission             --skip test_rald1_local_derived_fallback_and_explicit_build_preserve_public_authority

      - name: Android Core admission and local-derived focused proofs
        shell: bash
        run: |
          set -euo pipefail
          cd source
          CODEX_B10_RELEASE_CORE="$RALD7_ANDROID_CORE"             cargo test --locked -p codex               tests::test_r6_builder_publish_output_enters_existing_signed_release_admission               -- --exact --nocapture
          CODEX_B10_RELEASE_CORE="$RALD7_ANDROID_CORE"             cargo test --locked -p codex               tests::test_rald1_local_derived_fallback_and_explicit_build_preserve_public_authority               -- --exact --nocapture

      - name: Manager integration tests
        shell: bash
        run: |
          set -euo pipefail
          cd source
          cargo test --locked -p codex-manager

  workspace:
    name: Locked workspace check, test, clippy, and fmt
    needs: android-core
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 45
    steps:
      - name: Fetch exact acceptance source
        shell: bash
        run: |
          set -euo pipefail
          git init source
          git -C source remote add origin "https://github.com/$GITHUB_REPOSITORY.git"
          git -C source fetch --no-tags --depth=1 origin "$GITHUB_SHA"
          git -C source checkout --detach FETCH_HEAD
          test "$(git -C source rev-parse HEAD)" = "$GITHUB_SHA"

      - name: Download accepted Android Core proof artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: rald7-accepted-android-core
          path: ${{ runner.temp }}/rald7-android-core

      - name: Provision pinned Android bionic execution substrate
        shell: bash
        run: |
          set -euo pipefail
          core="$RUNNER_TEMP/rald7-android-core/codex"
          chmod 0755 "$core"
          test -x "$core"
          file "$core" | grep -F 'ARM aarch64'
          readelf -l "$core" | grep -F '/system/bin/linker64'
          printf 'RALD7_ANDROID_CORE=%s\n' "$core" >> "$GITHUB_ENV"

          for tool in curl base64 unzip debugfs file readelf sha256sum; do
            command -v "$tool" >/dev/null
          done
          sudo test ! -e /system
          root="$RUNNER_TEMP/rald7-bionic"
          mkdir -p "$root/bin" "$root/lib64/bionic"
          apex_url="https://android.googlesource.com/platform/prebuilts/runtime/+/$ANDROID_RUNTIME_APEX_COMMIT/mainline/runtime/apex/com.android.runtime-arm64.apex?format=TEXT"
          curl --fail --silent --show-error --location --proto '=https' --tlsv1.2             --connect-timeout 15 --max-time 120 --max-filesize 20971520             --output "$root/runtime.apex.b64" "$apex_url"
          base64 --decode "$root/runtime.apex.b64" > "$root/runtime.apex"
          test "$(wc -c < "$root/runtime.apex")" -eq 13881344
          test "$(sha256sum "$root/runtime.apex" | awk '{print $1}')" = "$ANDROID_RUNTIME_APEX_SHA256"
          unzip -p "$root/runtime.apex" apex_payload.img > "$root/apex_payload.img"
          test "$(wc -c < "$root/apex_payload.img")" -eq 13783040
          debugfs -R "dump -p /bin/linker64 $root/bin/linker64" "$root/apex_payload.img" >/dev/null 2>&1
          for library in libc.so libdl.so libm.so; do
            debugfs -R "dump -p /lib64/bionic/$library $root/lib64/bionic/$library"               "$root/apex_payload.img" >/dev/null 2>&1
          done
          sudo mkdir -p /system/bin /system/lib64
          sudo install -m 0755 "$root/bin/linker64" /system/bin/linker64
          for library in libc.so libdl.so libm.so; do
            sudo install -m 0644 "$root/lib64/bionic/$library" "/system/lib64/$library"
          done
          rm -f "$root/runtime.apex.b64" "$root/runtime.apex" "$root/apex_payload.img"
          "$core" update --help >/dev/null

      - name: Provision deterministic Termux test tools
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -m)" = aarch64
          sudo mkdir -p "$TERMUX_TEST_PREFIX/bin" "$TERMUX_TEST_TMPDIR"
          for tool in sh openssl curl script gzip cat chmod; do
            source_path="$(command -v "$tool")"
            test -f "$source_path" -o -L "$source_path"
            sudo install -m 0755 "$source_path" "$TERMUX_TEST_PREFIX/bin/$tool"
          done
          clang_path="$(command -v clang)"
          test -f "$clang_path" -o -L "$clang_path"
          sudo ln -s "$clang_path" "$TERMUX_TEST_PREFIX/bin/clang"
          sudo chown -R "$(id -u):$(id -g)" /data/data/com.termux
          printf 'PREFIX=%s\n' "$TERMUX_TEST_PREFIX" >> "$GITHUB_ENV"
          printf 'TMPDIR=%s\n' "$TERMUX_TEST_TMPDIR" >> "$GITHUB_ENV"
          for tool in sh openssl curl script gzip clang cat chmod; do
            test -x "$TERMUX_TEST_PREFIX/bin/$tool"
          done
          test ! -L "$TERMUX_TEST_PREFIX/bin/gzip"
          test ! -L "$TERMUX_TEST_PREFIX/bin/openssl"

      - name: Cargo check
        shell: bash
        run: |
          set -euo pipefail
          cd source
          cargo check --workspace --locked

      - name: Full workspace tests
        shell: bash
        run: |
          set -euo pipefail
          cd source
          cargo test --workspace --locked --             --skip test_r6_builder_publish_output_enters_existing_signed_release_admission             --skip test_rald1_local_derived_fallback_and_explicit_build_preserve_public_authority

      - name: Clippy warnings are errors
        shell: bash
        run: |
          set -euo pipefail
          cd source
          cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Rust formatting
        shell: bash
        run: |
          set -euo pipefail
          cd source
          cargo fmt --all -- --check

  public-audit:
    name: Protected state and signed public-stable audit
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Verify main, stable index, signature, and public release bytes
        shell: bash
        run: |
          set -euo pipefail
          main_sha="$(git ls-remote --exit-code "https://github.com/$GITHUB_REPOSITORY.git" refs/heads/main | awk '{print $1}')"
          test "$main_sha" = "$EXPECTED_MAIN"

          root="$RUNNER_TEMP/rald7-public"
          mkdir -p "$root/release"
          exact="https://raw.githubusercontent.com/$GITHUB_REPOSITORY/$EXPECTED_MAIN"
          curl --fail --silent --show-error --location --proto '=https' --tlsv1.2             --connect-timeout 15 --max-time 60 --max-filesize 16384             --output "$root/update-index-v1" "$exact/update-index-v1"
          curl --fail --silent --show-error --location --proto '=https' --tlsv1.2             --connect-timeout 15 --max-time 60 --max-filesize 1024             --output "$root/update-index-v1.sig" "$exact/update-index-v1.sig"
          curl --fail --silent --show-error --location --proto '=https' --tlsv1.2             --connect-timeout 15 --max-time 60 --max-filesize 16384             --output "$root/update-public-key.pem"             "https://github.com/$GITHUB_REPOSITORY/releases/download/$PUBLIC_GENERATION/update-public-key.pem"

          test "$(sha256sum "$root/update-public-key.pem" | awk '{print $1}')" = "$PUBLIC_KEY_SHA256"
          test "$(wc -c < "$root/update-index-v1.sig")" -eq 64
          openssl pkeyutl -verify -rawin -pubin             -inkey "$root/update-public-key.pem"             -in "$root/update-index-v1" -sigfile "$root/update-index-v1.sig" >/dev/null
          test "$(sed -n '1p' "$root/update-index-v1")" = codex-update-index-v1
          test "$(awk -F '\t' '$1=="channel"{print $2}' "$root/update-index-v1")" = stable
          test "$(awk -F '\t' '$1=="generation_id"{print $2}' "$root/update-index-v1")" = "$PUBLIC_GENERATION"
          release_base="$(awk -F '\t' '$1=="release_base"{print $2}' "$root/update-index-v1")"
          test "$release_base" = "https://humtr.github.io/codex/$PUBLIC_GENERATION/"

          curl --fail --silent --show-error --location --proto '=https' --tlsv1.2             --connect-timeout 15 --max-time 60 --max-filesize 131072             --output "$root/release/release.manifest" "${release_base}release.manifest"
          curl --fail --silent --show-error --location --proto '=https' --tlsv1.2             --connect-timeout 15 --max-time 60 --max-filesize 1024             --output "$root/release/release.sig" "${release_base}release.sig"
          test "$(wc -c < "$root/release/release.sig")" -eq 64
          openssl pkeyutl -verify -rawin -pubin             -inkey "$root/update-public-key.pem"             -in "$root/release/release.manifest" -sigfile "$root/release/release.sig" >/dev/null
          test "$(sed -n '1p' "$root/release/release.manifest")" = codex-release-v4
          test "$(awk -F '\t' '$1=="generation_id"{print $2}' "$root/release/release.manifest")" = "$PUBLIC_GENERATION"
          test "$(awk -F '\t' '$1=="release_sequence"{print $2}' "$root/release/release.manifest")" = "$PUBLIC_SEQUENCE"

          total=0
          tab="$(printf '\t')"
          while IFS="$tab" read -r kind rel digest mode extra; do
            test "$kind" = file || continue
            test -z "$extra"
            target="$root/release/$rel"
            mkdir -p "$(dirname "$target")"
            curl --fail --silent --show-error --location --proto '=https' --tlsv1.2               --connect-timeout 15 --max-time 300 --max-filesize 536870912               --output "$target" "${release_base}$rel"
            test "$(sha256sum "$target" | awk '{print $1}')" = "$digest"
            size="$(wc -c < "$target")"
            total=$((total + size))
            test "$total" -le 1073741824
          done < "$root/release/release.manifest"

          test "$(git ls-remote --exit-code "https://github.com/$GITHUB_REPOSITORY.git" refs/heads/main | awk '{print $1}')" = "$EXPECTED_MAIN"

  accepted:
    name: UX-1 source acceptance
    needs: [contract, packages, workspace, public-audit]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - name: Require every source gate
        shell: bash
        run: |
          set -euo pipefail
          test '${{ needs.contract.result }}' = success
          test '${{ needs.packages.result }}' = success
          test '${{ needs.workspace.result }}' = success
          test '${{ needs.public-audit.result }}' = success
          test "$(git ls-remote --exit-code "https://github.com/$GITHUB_REPOSITORY.git" refs/heads/main | awk '{print $1}')" = "$EXPECTED_MAIN"
          printf 'RALD-7 source acceptance gates are green\n'
