name: Publish Termux update Pages
run-name: Publish Termux update Pages ${{ inputs.generation_id }}

on:
  workflow_call:
    inputs:
      generation_id:
        description: Signed generation ID and staging Release tag
        required: true
        type: string
      release_sequence:
        description: Expected signed release sequence
        required: true
        type: string
      current_generation:
        description: Authenticated LKG generation that must remain deployed
        required: true
        type: string
      publication_source_sha:
        description: Exact source of the signed publication validator
        required: true
        type: string
      expected_main_sha:
        description: Exact pre-promotion main SHA that owns the LKG index
        required: true
        type: string

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: termux-update-pages
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-24.04
    steps:
      - name: Fetch exact signed publication validator
        shell: bash
        env:
          PUBLICATION_SOURCE_SHA: ${{ inputs.publication_source_sha }}
        run: |
          set -euo pipefail
          [[ "$PUBLICATION_SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          git init publication-source
          git -C publication-source remote add origin https://github.com/humtr/codex.git
          git -C publication-source fetch --no-tags --depth=1 origin "$PUBLICATION_SOURCE_SHA"
          git -C publication-source checkout --detach FETCH_HEAD
          test "$(git -C publication-source rev-parse HEAD)" = "$PUBLICATION_SOURCE_SHA"
      - name: Reconstruct and verify signed generation
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GENERATION_ID: ${{ inputs.generation_id }}
          RELEASE_SEQUENCE: ${{ inputs.release_sequence }}
          CURRENT_GENERATION: ${{ inputs.current_generation }}
          EXPECTED_MAIN_SHA: ${{ inputs.expected_main_sha }}
        run: |
          set -euo pipefail
          [[ "$GENERATION_ID" =~ ^local-[a-z0-9][a-z0-9._-]{0,126}$ ]]
          [[ "$CURRENT_GENERATION" =~ ^local-[a-z0-9][a-z0-9._-]{0,126}$ ]]
          [[ "$EXPECTED_MAIN_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$RELEASE_SEQUENCE" =~ ^[0-9]+$ ]]
          rm -rf stage site
          mkdir -p stage site
          gh release download "$GENERATION_ID" --repo "$GITHUB_REPOSITORY" --dir stage

          test "$(sha256sum stage/update-public-key.pem | awk '{print $1}')" = \
            '62ab1640b6b4e63afbd5952d11a0bd0a9f1cb78ddde2472e003a42c4db2b832c'
          python3 publication-source/.github/scripts/rald5_publication.py restore-assets \
            --assets stage --root site --public-key stage/update-public-key.pem \
            --generation "$GENERATION_ID" --release-sequence "$RELEASE_SEQUENCE" \
            --release-base "https://humtr.github.io/codex/$GENERATION_ID/"

          # Preserve the currently authoritative stable generation while the
          # candidate is deployed for pre-promotion readback. Pages deployment
          # is whole-site replacement, so omitting current stable here would
          # break the still-authoritative signed index before promotion.
          test "$(git ls-remote --exit-code https://github.com/humtr/codex.git refs/heads/main | awk '{print $1}')" = \
            "$EXPECTED_MAIN_SHA"
          curl --fail --silent --show-error --location --proto '=https' --tlsv1.2 \
            --connect-timeout 15 --max-time 60 \
            -o current-index "https://raw.githubusercontent.com/humtr/codex/$EXPECTED_MAIN_SHA/update-index-v1"
          curl --fail --silent --show-error --location --proto '=https' --tlsv1.2 \
            --connect-timeout 15 --max-time 60 \
            -o current-index.sig "https://raw.githubusercontent.com/humtr/codex/$EXPECTED_MAIN_SHA/update-index-v1.sig"
          openssl pkeyutl -verify -pubin -inkey stage/update-public-key.pem -rawin \
            -in current-index -sigfile current-index.sig
          read -r CURRENT_ID CURRENT_BASE < <(python3 - <<'PYTHON'
          import sys
          from pathlib import Path
          sys.path.insert(0, 'publication-source/.github/scripts')
          from rald5_publication import parse_index
          values = parse_index(Path('current-index'))
          print(values['generation_id'], values['release_base'])
          PYTHON
          )
          test "$CURRENT_ID" = "$CURRENT_GENERATION"
          test "$CURRENT_ID" != "$GENERATION_ID"
          mkdir -p "site/$CURRENT_ID"
          for rel in release.manifest release.sig; do
            curl --fail --silent --show-error --location --proto '=https' --tlsv1.2 \
              --connect-timeout 15 --max-time 120 --max-filesize 131072 \
              --output "site/$CURRENT_ID/$rel" "${CURRENT_BASE}${rel}"
          done
          openssl pkeyutl -verify -pubin -inkey stage/update-public-key.pem -rawin \
            -in "site/$CURRENT_ID/release.manifest" -sigfile "site/$CURRENT_ID/release.sig"
          python3 - "$CURRENT_ID" <<'PYTHON' > current-signed-paths
          import sys
          from pathlib import Path
          sys.path.insert(0, 'publication-source/.github/scripts')
          from rald5_publication import parse_manifest
          values, files = parse_manifest(Path('site') / sys.argv[1] / 'release.manifest')
          assert values['generation_id'] == sys.argv[1]
          print(values['release_sequence'])
          for record in files:
              print('\t'.join(record))
          PYTHON
          CURRENT_SEQUENCE="$(head -n 1 current-signed-paths)"
          current_download_size_code="$(curl --silent --show-error --location --proto '=https' --tlsv1.2 \
            --connect-timeout 15 --max-time 120 --max-filesize 131072 --write-out '%{http_code}' \
            --output current-download-size "${CURRENT_BASE}compat/download-size-v1")"
          case "$current_download_size_code" in
            200)
              curl --fail --silent --show-error --location --proto '=https' --tlsv1.2 \
                --connect-timeout 15 --max-time 120 --max-filesize 1024 \
                --output current-download-size.sig "${CURRENT_BASE}compat/download-size-v1.sig"
              mkdir -p "site/$CURRENT_ID/compat"
              cp current-download-size "site/$CURRENT_ID/compat/download-size-v1"
              cp current-download-size.sig "site/$CURRENT_ID/compat/download-size-v1.sig"
              ;;
            404)
              rm -f current-download-size current-download-size.sig
              ;;
            *)
              printf 'unexpected current download-size response: %s\n' "$current_download_size_code" >&2
              exit 1
              ;;
          esac
          while IFS=$'\t' read -r rel digest mode; do
            mkdir -p "$(dirname "site/$CURRENT_ID/$rel")"
            curl --fail --silent --show-error --location --proto '=https' --tlsv1.2 \
              --connect-timeout 15 --max-time 600 --max-filesize 1073741824 \
              --output "site/$CURRENT_ID/$rel" "${CURRENT_BASE}${rel}"
            chmod "$mode" "site/$CURRENT_ID/$rel"
          done < <(tail -n +2 current-signed-paths)
          cp current-index "site/$CURRENT_ID/update-index-v1"
          cp current-index.sig "site/$CURRENT_ID/update-index-v1.sig"
          python3 publication-source/.github/scripts/rald5_publication.py verify-public \
            --root site --public-key stage/update-public-key.pem \
            --generation "$CURRENT_ID" --release-sequence "$CURRENT_SEQUENCE" \
            --release-base "$CURRENT_BASE"
          test "$(git ls-remote --exit-code https://github.com/humtr/codex.git refs/heads/main | awk '{print $1}')" = \
            "$EXPECTED_MAIN_SHA"

          candidate_bytes=$(du -sb "site/$GENERATION_ID" | awk '{print $1}')
          current_bytes=$(du -sb "site/$CURRENT_ID" | awk '{print $1}')
          total=$(du -sb site | awk '{print $1}')
          test "$total" -lt 1073741824
          printf 'verified_generation=%s\nverified_sequence=%s\ncurrent_generation=%s\ncandidate_bytes=%s\ncurrent_bytes=%s\nsite_bytes=%s\n' \
            "$GENERATION_ID" "$RELEASE_SEQUENCE" "$CURRENT_ID" \
            "$candidate_bytes" "$current_bytes" "$total"

      - name: Configure Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b
        with:
          path: site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-24.04
    needs: prepare
    steps:
      - name: Deploy Pages artifact
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e
