name: Publish Termux update Pages
run-name: Publish Termux update Pages ${{ inputs.generation_id }}

on:
  workflow_call:
    inputs:
      generation_id:
        description: Signed generation ID and staging Release tag
        required: true
        type: string
      release_sequence:
        description: Expected signed release sequence
        required: true
        type: string
      current_generation:
        description: Authenticated LKG generation that must remain deployed
        required: true
        type: string
      expected_main_sha:
        description: Exact pre-promotion main SHA that owns the LKG index
        required: true
        type: string

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: termux-update-pages
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-24.04
    steps:
      - name: Reconstruct and verify signed generation
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GENERATION_ID: ${{ inputs.generation_id }}
          RELEASE_SEQUENCE: ${{ inputs.release_sequence }}
          CURRENT_GENERATION: ${{ inputs.current_generation }}
          EXPECTED_MAIN_SHA: ${{ inputs.expected_main_sha }}
        run: |
          set -euo pipefail
          [[ "$GENERATION_ID" =~ ^local-[a-z0-9][a-z0-9._-]{0,126}$ ]]
          [[ "$CURRENT_GENERATION" =~ ^local-[a-z0-9][a-z0-9._-]{0,126}$ ]]
          [[ "$EXPECTED_MAIN_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$RELEASE_SEQUENCE" =~ ^[0-9]+$ ]]
          rm -rf stage site
          mkdir -p stage "site/$GENERATION_ID/helpers"
          gh release download "$GENERATION_ID" --repo "$GITHUB_REPOSITORY" --dir stage

          cat > expected-assets <<'EOF'
          candidate-update-index-v1
          candidate-update-index-v1.sig
          codex-code-mode-host
          core
          generation.meta
          helper-0
          helper-1
          manager
          release.manifest
          release.sig
          runtime
          update-public-key.pem
          EOF
          find stage -maxdepth 1 -type f -printf '%f\n' | LC_ALL=C sort > actual-assets
          LC_ALL=C sort -o expected-assets expected-assets
          diff -u expected-assets actual-assets

          test "$(sha256sum stage/update-public-key.pem | awk '{print $1}')" = \
            '62ab1640b6b4e63afbd5952d11a0bd0a9f1cb78ddde2472e003a42c4db2b832c'
          openssl pkeyutl -verify -pubin -inkey stage/update-public-key.pem -rawin \
            -in stage/release.manifest -sigfile stage/release.sig
          openssl pkeyutl -verify -pubin -inkey stage/update-public-key.pem -rawin \
            -in stage/candidate-update-index-v1 -sigfile stage/candidate-update-index-v1.sig
          test "$(sed -n '1p' stage/candidate-update-index-v1)" = 'codex-update-index-v1'
          test "$(awk -F '\t' '$1=="channel"{print $2}' stage/candidate-update-index-v1)" = 'stable'
          test "$(awk -F '\t' '$1=="generation_id"{print $2}' stage/candidate-update-index-v1)" = "$GENERATION_ID"
          test "$(awk -F '\t' '$1=="release_base"{print $2}' stage/candidate-update-index-v1)" = \
            "https://humtr.github.io/codex/$GENERATION_ID/"

          test "$(sed -n '1p' stage/release.manifest)" = 'codex-release-v4'
          test "$(awk -F '\t' '$1=="generation_id"{print $2}' stage/release.manifest)" = "$GENERATION_ID"
          test "$(awk -F '\t' '$1=="release_sequence"{print $2}' stage/release.manifest)" = "$RELEASE_SEQUENCE"
          test "$(awk -F '\t' '$1=="channel"{print $2}' stage/release.manifest)" = 'stable'
          test "$(awk -F '\t' '$1=="release_public_key"{print $2}' stage/release.manifest)" = \
            '82d2e4a5038a439601e6efc02d3b631b7da689fbacaa0435ec1600daa3a29bf2'
          test "$(awk -F '\t' '$1=="file_count"{print $2}' stage/release.manifest)" = '7'

          test "$(awk -F '\t' '$1=="generation_id"{print $2}' stage/generation.meta)" = "$GENERATION_ID"
          UPSTREAM_VERSION="$(awk -F '\t' '$1=="upstream_package_version"{print $2}' stage/generation.meta)"
          [[ "$UPSTREAM_VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          test "$(awk -F '\t' '$1=="creation_metadata"{print $2}' stage/generation.meta)" = \
            'r10-browser-helper-bridge-v1'
          test "$(awk -F '\t' '$1=="helper_count"{print $2}' stage/generation.meta)" = '2'
          test "$(awk -F '\t' '$1=="helper" && $2=="termux-browser-open-v1"{print $3}' stage/generation.meta)" = \
            '2c49fe962f2e2588573ef75177dce32c6c8b1ee3c37fd106bd18c36b20f7bba9'
          test "$(awk -F '\t' '$1=="helper" && $2=="termux-browser-manual-v1"{print $3}' stage/generation.meta)" = \
            '90f6e634ef0039c78b8fbefc52aed0bdc4dd4a421c5991886c5387dcd3c46685'

          awk -F '\t' '$1=="file"{print $2}' stage/release.manifest > signed-paths
          cat > expected-paths <<'EOF'
          codex-code-mode-host
          core
          generation.meta
          helpers/0
          helpers/1
          manager
          runtime
          EOF
          diff -u expected-paths signed-paths

          # Preserve the currently authoritative stable generation while the
          # candidate is deployed for pre-promotion readback. Pages deployment
          # is whole-site replacement, so omitting current stable here would
          # break the still-authoritative signed index before promotion.
          test "$(git ls-remote --exit-code https://github.com/humtr/codex.git refs/heads/main | awk '{print $1}')" = \
            "$EXPECTED_MAIN_SHA"
          curl --fail --silent --show-error --location --proto '=https' --tlsv1.2 \
            --connect-timeout 15 --max-time 60 \
            -o current-index "https://raw.githubusercontent.com/humtr/codex/$EXPECTED_MAIN_SHA/update-index-v1"
          curl --fail --silent --show-error --location --proto '=https' --tlsv1.2 \
            --connect-timeout 15 --max-time 60 \
            -o current-index.sig "https://raw.githubusercontent.com/humtr/codex/$EXPECTED_MAIN_SHA/update-index-v1.sig"
          openssl pkeyutl -verify -pubin -inkey stage/update-public-key.pem -rawin \
            -in current-index -sigfile current-index.sig
          test "$(sed -n '1p' current-index)" = 'codex-update-index-v1'
          test "$(awk -F '\t' '$1=="channel"{print $2}' current-index)" = 'stable'
          CURRENT_ID="$(awk -F '\t' '$1=="generation_id"{print $2}' current-index)"
          CURRENT_BASE="$(awk -F '\t' '$1=="release_base"{print $2}' current-index)"
          [[ "$CURRENT_ID" =~ ^local-[a-z0-9][a-z0-9._-]{0,126}$ ]]
          test "$CURRENT_ID" = "$CURRENT_GENERATION"
          test "$CURRENT_ID" != "$GENERATION_ID"
          test "$CURRENT_BASE" = "https://humtr.github.io/codex/$CURRENT_ID/"
          mkdir -p "site/$CURRENT_ID/helpers"
          curl --fail --silent --show-error --location --connect-timeout 15 --max-time 120 \
            -o "site/$CURRENT_ID/release.manifest" "${CURRENT_BASE}release.manifest"
          curl --fail --silent --show-error --location --connect-timeout 15 --max-time 120 \
            -o "site/$CURRENT_ID/release.sig" "${CURRENT_BASE}release.sig"
          openssl pkeyutl -verify -pubin -inkey stage/update-public-key.pem -rawin \
            -in "site/$CURRENT_ID/release.manifest" -sigfile "site/$CURRENT_ID/release.sig"
          test "$(sed -n '1p' "site/$CURRENT_ID/release.manifest")" = 'codex-release-v4'
          test "$(awk -F '\t' '$1=="generation_id"{print $2}' "site/$CURRENT_ID/release.manifest")" = "$CURRENT_ID"
          test "$(awk -F '\t' '$1=="channel"{print $2}' "site/$CURRENT_ID/release.manifest")" = 'stable'
          test "$(awk -F '\t' '$1=="release_public_key"{print $2}' "site/$CURRENT_ID/release.manifest")" = \
            '82d2e4a5038a439601e6efc02d3b631b7da689fbacaa0435ec1600daa3a29bf2'
          awk -F '\t' '$1=="file"{print $2}' "site/$CURRENT_ID/release.manifest" > current-signed-paths
          diff -u expected-paths current-signed-paths
          while IFS=$'\t' read -r kind rel digest mode; do
            [[ "$kind" == file ]] || continue
            mkdir -p "$(dirname "site/$CURRENT_ID/$rel")"
            curl --fail --silent --show-error --location \
              --connect-timeout 15 --max-time 600 \
              -o "site/$CURRENT_ID/$rel" "${CURRENT_BASE}${rel}"
            test "$(sha256sum "site/$CURRENT_ID/$rel" | awk '{print $1}')" = "$digest"
          done < "site/$CURRENT_ID/release.manifest"

          cp stage/codex-code-mode-host "site/$GENERATION_ID/codex-code-mode-host"
          cp stage/core "site/$GENERATION_ID/core"
          cp stage/generation.meta "site/$GENERATION_ID/generation.meta"
          cp stage/helper-0 "site/$GENERATION_ID/helpers/0"
          cp stage/helper-1 "site/$GENERATION_ID/helpers/1"
          cp stage/manager "site/$GENERATION_ID/manager"
          cp stage/runtime "site/$GENERATION_ID/runtime"
          cp stage/release.manifest "site/$GENERATION_ID/release.manifest"
          cp stage/release.sig "site/$GENERATION_ID/release.sig"
          cp stage/candidate-update-index-v1 "site/$GENERATION_ID/update-index-v1"
          cp stage/candidate-update-index-v1.sig "site/$GENERATION_ID/update-index-v1.sig"

          while IFS=$'\t' read -r kind rel digest mode; do
            [[ "$kind" == file ]] || continue
            test "$(sha256sum "site/$GENERATION_ID/$rel" | awk '{print $1}')" = "$digest"
          done < stage/release.manifest

          candidate_bytes=$(du -sb "site/$GENERATION_ID" | awk '{print $1}')
          current_bytes=$(du -sb "site/$CURRENT_ID" | awk '{print $1}')
          total=$(du -sb site | awk '{print $1}')
          test "$total" -lt 1073741824
          printf 'verified_generation=%s\nverified_sequence=%s\ncurrent_generation=%s\ncandidate_bytes=%s\ncurrent_bytes=%s\nsite_bytes=%s\n' \
            "$GENERATION_ID" "$RELEASE_SEQUENCE" "$CURRENT_ID" \
            "$candidate_bytes" "$current_bytes" "$total"

      - name: Configure Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b
        with:
          path: site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-24.04
    needs: prepare
    steps:
      - name: Deploy Pages artifact
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e
