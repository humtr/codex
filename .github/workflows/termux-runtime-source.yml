name: Build adapted official runtime source
on:
  workflow_call:
    inputs:
      source_sha:
        required: true
        type: string
    outputs:
      base_generation:
        description: Authenticated runtime-equivalent Base, empty for a source build
        value: ${{ jobs.runtime.outputs.base_generation }}
permissions:
  contents: read
  actions: read
jobs:
  runtime:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 90
    outputs:
      base_generation: ${{ steps.base.outputs.base_generation }}
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/upstream/codex-rs/target
      CARGO_BUILD_JOBS: '3'
    steps:
      - name: Fetch exact wrapper recipe
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          set -euo pipefail
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          git init source
          git -C source remote add origin https://github.com/humtr/codex.git
          git -C source fetch --no-tags --depth=1 origin "$SOURCE_SHA"
          git -C source checkout --detach FETCH_HEAD
          test "$(git -C source rev-parse HEAD)" = "$SOURCE_SHA"
          python3 source/.github/scripts/upstream_release.py source/release/upstream.json --component frontend >> "$GITHUB_ENV"
      - name: Reuse an admitted runtime when only wrapper components changed
        id: base
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          main="$(gh api repos/humtr/codex/git/ref/heads/main --jq '.object.sha')"
          python3 source/.github/scripts/release_components.py acquire-published-runtime-base \
            --source source --main "$main" --output "$RUNNER_TEMP/runtime-base" >> "$GITHUB_OUTPUT"
      - name: Retain runtime subset from signed Base
        if: steps.base.outputs.reuse_runtime == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: termux-runtime-base
          path: ${{ runner.temp }}/runtime-base
          if-no-files-found: error
          retention-days: 7
      - name: Resolve production-equivalent raw runtime artifact
        if: steps.base.outputs.reuse_runtime != 'true'
        id: qualified
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          set -euo pipefail
          # Production reuse is not source qualification. The current consumer
          # still verifies and qualifies its own exact source and component bytes.
          python3 source/.github/scripts/runtime_production.py resolve \
            --source source --selection "$RUNNER_TEMP/runtime-selection.json" >> "$GITHUB_OUTPUT"
      - name: Download original raw runtime production
        if: steps.qualified.outputs.run_id != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 source/.github/scripts/runtime_production.py download --source source \
            --selection "$RUNNER_TEMP/runtime-selection.json" --transfer "$RUNNER_TEMP/runtime-transfer"
      - name: Provision exact official build toolchain
        if: steps.base.outputs.reuse_runtime != 'true'
        run: |
          set -euo pipefail
          test "$(uname -m)" = aarch64
          rustup toolchain install "$RUST_VERSION" --profile minimal --target aarch64-unknown-linux-musl
      - name: Resolve portable runtime recipe
        if: steps.base.outputs.reuse_runtime != 'true'
        id: recipe
        run: echo "fingerprint=$(python3 source/.github/scripts/runtime_inputs.py --production)" >> "$GITHUB_OUTPUT"
      - name: Build shared Rust source preparation
        if: steps.base.outputs.reuse_runtime != 'true'
        run: |
          set -euo pipefail
          CARGO_TARGET_DIR="$RUNNER_TEMP/source-tools" cargo "+$RUST_VERSION" build \
            --manifest-path source/Cargo.toml --release --locked -p codex-release-builder
          echo "CODEX_RELEASE_BUILDER=$RUNNER_TEMP/source-tools/release/codex-release-builder" >> "$GITHUB_ENV"
      - name: Verify reusable raw runtime before qualification
        if: steps.base.outputs.reuse_runtime != 'true'
        id: raw
        env:
          PRODUCTION_RUN: ${{ steps.qualified.outputs.run_id }}
        run: |
          set -euo pipefail
          if test -n "$PRODUCTION_RUN"; then
            python3 source/.github/scripts/runtime_artifact.py unpack \
              --transfer "$RUNNER_TEMP/runtime-transfer" --artifact "$RUNNER_TEMP/runtime-artifact" \
              --builder "$CODEX_RELEASE_BUILDER" \
              --recipe "$GITHUB_WORKSPACE/source/release/upstream.json" --openssl /usr/bin/openssl
            echo 'reuse=true' >> "$GITHUB_OUTPUT"
          fi
      - name: Fetch exact official source
        if: steps.base.outputs.reuse_runtime != 'true' && steps.raw.outputs.reuse != 'true'
        run: |
          set -euo pipefail
          git init upstream
          git -C upstream remote add origin https://github.com/openai/codex.git
          git -C upstream fetch --no-tags --depth=1 origin "$UPSTREAM_SHA"
          git -C upstream checkout --detach FETCH_HEAD
          test "$(git -C upstream rev-parse HEAD)" = "$UPSTREAM_SHA"
      - name: Install official musl dependency tooling
        if: steps.base.outputs.reuse_runtime != 'true' && steps.raw.outputs.reuse != 'true'
        env:
          TARGET: aarch64-unknown-linux-musl
          APT_UPDATE_ARGS: -qq
          APT_INSTALL_ARGS: --no-install-recommends
          OPENSSL_BUILD_JOBS: '3'
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/zig-linux-aarch64-0.14.0.tar.xz"
          curl --fail --silent --show-error https://ziglang.org/download/0.14.0/zig-linux-aarch64-0.14.0.tar.xz -o "$archive"
          echo "ab64e3ea277f6fc5f3d723dcd95d9ce1ab282c8ed0f431b4de880d30df891e4f  $archive" | sha256sum -c -
          tar -xJf "$archive" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/zig-linux-aarch64-0.14.0" >> "$GITHUB_PATH"
          export PATH="$RUNNER_TEMP/zig-linux-aarch64-0.14.0:$PATH"
          bash upstream/.github/scripts/install-musl-build-tools.sh
          echo 'AWS_LC_SYS_NO_JITTER_ENTROPY=1' >> "$GITHUB_ENV"
          echo 'AWS_LC_SYS_NO_JITTER_ENTROPY_aarch64_unknown_linux_musl=1' >> "$GITHUB_ENV"
      - name: Restore reusable compile cache
        if: steps.base.outputs.reuse_runtime != 'true' && steps.raw.outputs.reuse != 'true'
        id: cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            upstream/codex-rs/target
          key: termux-source-musl-${{ env.RUST_VERSION }}-${{ env.UPSTREAM_SHA }}-${{ steps.recipe.outputs.fingerprint }}
          restore-keys: |
            termux-source-musl-${{ env.RUST_VERSION }}-${{ env.UPSTREAM_SHA }}-
            termux-source-musl-${{ env.RUST_VERSION }}-
      - name: Build and verify through the shared runtime producer
        id: build
        if: steps.base.outputs.reuse_runtime != 'true' && steps.raw.outputs.reuse != 'true'
        run: |
          set -euo pipefail
          patch_base="$("$CODEX_RELEASE_BUILDER" patch-base --patch "$GITHUB_WORKSPACE/source/crates/release-builder/src/native_route.patch")"
          if ! git -C upstream cat-file -e "$patch_base^{commit}"; then
            git -C upstream fetch --no-tags --depth=1 origin "$patch_base"
          fi
          "$CODEX_RELEASE_BUILDER" build-runtime \
            --source "$GITHUB_WORKSPACE/upstream" \
            --recipe "$GITHUB_WORKSPACE/source/release/upstream.json" \
            --target-dir "$CARGO_TARGET_DIR" \
            --rustc "$(command -v rustc)" --cargo "$(command -v cargo)" --openssl /usr/bin/openssl \
            --output "$RUNNER_TEMP/runtime-artifact"
      - name: Package runtime and preparation evidence with original modes
        if: ${{ !cancelled() && (steps.build.outcome == 'success' || steps.raw.outputs.reuse == 'true') }}
        id: transfer
        run: |
          set -euo pipefail
          python3 source/.github/scripts/runtime_artifact.py pack \
            --artifact "$RUNNER_TEMP/runtime-artifact" --transfer "$RUNNER_TEMP/runtime-upload" \
            --builder "$CODEX_RELEASE_BUILDER" \
            --recipe "$GITHUB_WORKSPACE/source/release/upstream.json" --openssl /usr/bin/openssl
      - name: Retain runtime and preparation evidence
        id: raw-upload
        if: ${{ !cancelled() && steps.transfer.outcome == 'success' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: termux-runtime-source
          path: ${{ runner.temp }}/runtime-upload/runtime.tar
          if-no-files-found: error
          retention-days: 7
      - name: Record original raw runtime production identity
        id: production
        if: steps.raw-upload.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          PRODUCTION_RUN: ${{ steps.qualified.outputs.run_id }}
        run: |
          set -euo pipefail
          # The current Rust verifier and immutable archive upload have succeeded.
          # Approved publication callers and explicit noncanonical branch proofs
          # keep their existing candidate provenance without a new Core label.
          eligible="$(python3 source/.github/scripts/runtime_production.py eligible-origin \
            --source source --run-id "$GITHUB_RUN_ID")"
          if test -n "$PRODUCTION_RUN"; then
            python3 source/.github/scripts/runtime_production.py record --source source \
              --artifact "$RUNNER_TEMP/runtime-artifact" --selection "$RUNNER_TEMP/runtime-selection.json" \
              --receipt "$RUNNER_TEMP/runtime-production.json" --consumer "$RUNNER_TEMP/runtime-consumer.json"
            echo 'recorded=true' >> "$GITHUB_OUTPUT"
          elif test "$eligible" = true; then
            python3 source/.github/scripts/runtime_production.py record --source source \
              --artifact "$RUNNER_TEMP/runtime-artifact" --run-id "$GITHUB_RUN_ID" \
              --artifact-id '${{ steps.raw-upload.outputs.artifact-id }}' \
              --receipt "$RUNNER_TEMP/runtime-production.json" --consumer "$RUNNER_TEMP/runtime-consumer.json"
            echo 'recorded=true' >> "$GITHUB_OUTPUT"
          fi
      - name: Retain original raw runtime production receipt
        if: ${{ !cancelled() && steps.production.outputs.recorded == 'true' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: termux-runtime-production
          path: |
            ${{ runner.temp }}/runtime-production.json
            ${{ runner.temp }}/runtime-consumer.json
          if-no-files-found: error
          retention-days: 7
      - name: Retain reusable compile cache
        if: ${{ !cancelled() && steps.cache.outcome == 'success' && steps.cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            upstream/codex-rs/target
          key: termux-source-musl-${{ env.RUST_VERSION }}-${{ env.UPSTREAM_SHA }}-${{ steps.recipe.outputs.fingerprint }}
