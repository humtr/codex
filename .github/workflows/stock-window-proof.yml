name: Official APK window fallback proof
on:
  push:
    branches: [rewrite/rust-core]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      STOCK_SOURCE: 8629e632fcb95da272221be327db653fb24befe9
      PRODUCT_SOURCE: ${{ github.sha }}
      ANDROID_NDK_VERSION: '27.3.13750724'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          path: proof
          persist-credentials: false
      - name: Fetch unmodified official app and accepted Manager
        shell: bash
        run: |
          set -euo pipefail
          test "$PRODUCT_SOURCE" = "$GITHUB_SHA"
          [[ "$PRODUCT_SOURCE" =~ ^[0-9a-f]{40}$ ]]
          git init stock
          git -C stock remote add origin https://github.com/termux/termux-app.git
          git -C stock fetch --depth=1 origin "$STOCK_SOURCE"
          git -C stock checkout --detach FETCH_HEAD
          test "$(git -C stock rev-parse HEAD)" = "$STOCK_SOURCE"
          git init product
          git -C product remote add origin https://github.com/humtr/codex.git
          git -C product fetch --depth=1 origin "$PRODUCT_SOURCE"
          git -C product checkout --detach FETCH_HEAD
          test "$(git -C product rev-parse HEAD)" = "$PRODUCT_SOURCE"
          mkdir -p stock/app/src/androidTest/java/com/termux/app
          cp proof/.github/stock-window/StockWindowTest.java stock/app/src/androidTest/java/com/termux/app/
          python3 - <<'PY'
          from pathlib import Path
          p=Path('stock/app/build.gradle');s=p.read_text()
          s=s.replace('    defaultConfig {','    defaultConfig {\n        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"',1)
          s+='\ndependencies {\n androidTestImplementation "androidx.test:runner:1.6.2"\n androidTestImplementation "androidx.test.ext:junit:1.2.1"\n}\n'
          p.write_text(s)
          PY
          # Only test compilation changes; all production Java/native inputs are stock.
          test "$(git -C stock diff --name-only)" = app/build.gradle
      - name: Build stock APK and native executable fixtures
        shell: bash
        env:
          TERMUX_PACKAGE_VARIANT: apt-android-7
        run: |
          set -euo pipefail
          export JAVA_HOME="$JAVA_HOME_17_X64"
          export PATH="$JAVA_HOME/bin:$PATH"
          (cd stock; ./gradlew --no-daemon :app:assembleDebug :app:assembleDebugAndroidTest)
          ndk="$ANDROID_SDK_ROOT/ndk/$ANDROID_NDK_VERSION"
          rust_version=$(python3 -c 'import json;print(json.load(open("product/release/upstream.json"))["toolchains"]["core_rust"])')
          rustup toolchain install "$rust_version" --profile minimal --target x86_64-linux-android
          export CARGO_TARGET_DIR="$RUNNER_TEMP/cargo-target"
          export CARGO_TARGET_X86_64_LINUX_ANDROID_LINKER="$ndk/toolchains/llvm/prebuilt/linux-x86_64/bin/x86_64-linux-android24-clang"
          "$CARGO_TARGET_X86_64_LINUX_ANDROID_LINKER" -O2 -Wall -Wextra -Werror -c proof/.github/stock-window/rename.c -o "$RUNNER_TEMP/rename.o"
          export RUSTFLAGS="-C link-arg=$RUNNER_TEMP/rename.o"
          cargo "+$rust_version" build --release --locked --manifest-path product/Cargo.toml --target x86_64-linux-android -p codex-manager
          mkdir fixture
          cp "$CARGO_TARGET_DIR/x86_64-linux-android/release/codex-manager" fixture/manager
          "$CARGO_TARGET_X86_64_LINUX_ANDROID_LINKER" -O2 -Wall -Wextra -Werror proof/.github/stock-window/workload.c -o fixture/core
          curl --fail --silent --show-error --location https://github.com/termux/termux-am-socket/archive/refs/tags/1.5.0.tar.gz -o am.tar.gz
          echo '5175023c7fd675492451a72d06b75c772f257685b69fe117227bae5a5e6f5494  am.tar.gz' | sha256sum -c -
          tar -xzf am.tar.gz
          cmake -S termux-am-socket-1.5.0 -B "$RUNNER_TEMP/am-build" \
            -DCMAKE_TOOLCHAIN_FILE="$ndk/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=x86_64 -DANDROID_PLATFORM=24 -DANDROID_STL=c++_static \
            -DCMAKE_INSTALL_PREFIX=/data/data/com.termux/files/usr \
            -DTERMUX_APPS_DIR=/data/data/com.termux/files/apps -DTERMUX_APP_PACKAGE=com.termux
          cmake --build "$RUNNER_TEMP/am-build"
          cp "$RUNNER_TEMP/am-build/termux-am-socket" fixture/
      - name: Execute on disposable Android emulator
        shell: bash
        run: |
          set -euo pipefail
          export JAVA_HOME="$JAVA_HOME_17_X64"
          export PATH="$JAVA_HOME/bin:$ANDROID_SDK_ROOT/cmdline-tools/latest/bin:$ANDROID_SDK_ROOT/platform-tools:$PATH"
          export ANDROID_USER_HOME="$RUNNER_TEMP/android-user"
          export ANDROID_EMULATOR_HOME="$ANDROID_USER_HOME"
          export ANDROID_AVD_HOME="$ANDROID_USER_HOME/avd"
          mkdir -p "$ANDROID_AVD_HOME"
          sudo chmod a+rw /dev/kvm
          timeout 300 sdkmanager 'system-images;android-30;google_apis;x86_64'
          echo no | timeout 120 avdmanager create avd --force --name stock-proof --package 'system-images;android-30;google_apis;x86_64' --device pixel --path "$ANDROID_AVD_HOME/stock-proof.avd"
          "$ANDROID_SDK_ROOT/emulator/emulator" -list-avds | grep -Fx stock-proof
          "$ANDROID_SDK_ROOT/emulator/emulator" -avd stock-proof -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect > "$RUNNER_TEMP/emulator.log" 2>&1 &
          timeout 120 adb wait-for-device || { tail -80 "$RUNNER_TEMP/emulator.log"; exit 1; }
          for attempt in $(seq 1 180); do
            test "$(adb shell getprop sys.boot_completed | tr -d '\r')" != 1 || break
            sleep 1
          done
          test "$(adb shell getprop sys.boot_completed | tr -d '\r')" = 1
          stock_apk=stock/app/build/outputs/apk/debug/termux-app_apt-android-7-debug_x86_64.apk
          test -f "$stock_apk"
          adb install "$stock_apk"
          adb install stock/app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
          adb shell appops set com.termux SYSTEM_ALERT_WINDOW allow
          adb shell am start -n com.termux/com.termux.app.TermuxActivity
          for attempt in $(seq 1 120); do
            adb shell run-as com.termux test -x /data/data/com.termux/files/usr/bin/env && break
            sleep 1
          done
          adb shell run-as com.termux test -x /data/data/com.termux/files/usr/bin/env
          for file in core manager termux-am-socket; do adb push "fixture/$file" "/data/local/tmp/stock-$file"; done
          adb shell "run-as com.termux sh -c 'mkdir -p files/home/.stock-proof files/home/.termux files/home/.local/lib/codex/core/generations/stock-proof/helpers; chmod 700 files/home/.stock-proof; cp /data/local/tmp/stock-core files/home/.stock-proof/core; cp /data/local/tmp/stock-manager files/home/.stock-proof/manager; cp /data/local/tmp/stock-core files/home/.local/lib/codex/core/generations/stock-proof/helpers/2; cp /data/local/tmp/stock-termux-am-socket files/usr/bin/termux-am-socket; chmod 755 files/home/.stock-proof/core files/home/.stock-proof/manager files/home/.local/lib/codex/core/generations/stock-proof/helpers/2 files/usr/bin/termux-am-socket; echo allow-external-apps=true > files/home/.termux/termux.properties'"
          timeout 25 adb shell "run-as com.termux /data/data/com.termux/files/usr/bin/termux-am-socket 'termux-terminal-v1 capabilities'" > "$RUNNER_TEMP/stock-capability.txt" 2>&1 || true
          grep -F "Error: unknown command 'termux-terminal-v1'" "$RUNNER_TEMP/stock-capability.txt"
          timeout 240 adb shell am instrument -w -r -e class com.termux.app.StockWindowTest com.termux.test/androidx.test.runner.AndroidJUnitRunner > "$RUNNER_TEMP/stock-proof.txt" 2>&1
          cat "$RUNNER_TEMP/stock-proof.txt"
          grep -F 'OK (1 test)' "$RUNNER_TEMP/stock-proof.txt"
          adb logcat -d -s StockWindowProof:I > "$RUNNER_TEMP/stock-proof-marker.txt"
          grep -F 'STOCK_WINDOW_PROOF real-stock-apk real-manager real-am-client' "$RUNNER_TEMP/stock-proof-marker.txt"
          grep -F 'HEADLESS_DISPLAY_PROOF owner-free-synthetic-thread real-manager real-android-activity' "$RUNNER_TEMP/stock-proof-marker.txt"
          python3 - <<'PYTHON'
          import json, os
          from pathlib import Path
          root=Path(os.environ['RUNNER_TEMP'])
          proof={'schema':'codex-android-window-qualification-v1','source_sha':os.environ['GITHUB_SHA'],
                 'run_id':os.environ['GITHUB_RUN_ID'],'stock_source':os.environ['STOCK_SOURCE'],
                 'android_api':30,'physical_device':False,'synthetic_frontend':True,
                 'synthetic_core_transport':True,
                 'native_owner_inference':False,'activity_session_pid_observed':True,
                 'foreground_uuid_observed':True,'auto_on_off':True,'repeated_and_concurrent_display':True}
          (root/'stock-proof.json').write_text(json.dumps(proof,sort_keys=True)+'\n')
          PYTHON
      - name: Collect failed disposable-emulator diagnostics
        if: failure()
        shell: bash
        run: |
          set -u
          export PATH="$ANDROID_SDK_ROOT/platform-tools:$PATH"
          # Fixed fixture files only. No production account or environment dump.
          timeout 15 adb shell run-as com.termux cat /data/data/com.termux/files/home/.stock-proof/failure.txt > "$RUNNER_TEMP/stock-failure.txt" 2>&1 || true
          timeout 15 adb shell run-as com.termux cat /data/data/com.termux/files/home/.stock-proof/stages.log > "$RUNNER_TEMP/stock-stages.txt" 2>&1 || true
          timeout 15 adb logcat -d -t 1000 -s StockWindowProof:V TermuxService:V RunCommandService:V ActivityManager:I AndroidRuntime:E > "$RUNNER_TEMP/stock-logcat.txt" 2>&1 || true
          timeout 15 adb shell dumpsys activity activities > "$RUNNER_TEMP/stock-activity.txt" 2>&1 || true
          python3 - <<'PYTHON'
          import os
          from pathlib import Path
          root=Path(os.environ['RUNNER_TEMP'])
          for name in ('stock-failure.txt','stock-stages.txt','stock-logcat.txt','stock-activity.txt'):
              path=root/name
              if path.exists():
                  with path.open('r+b') as stream: stream.truncate(min(path.stat().st_size,262144))
          PYTHON
      - name: Preserve bounded proof and diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: stock-window-proof
          path: |
            ${{ runner.temp }}/stock-proof.txt
            ${{ runner.temp }}/stock-proof-marker.txt
            ${{ runner.temp }}/stock-proof.json
            ${{ runner.temp }}/stock-capability.txt
            ${{ runner.temp }}/stock-failure.txt
            ${{ runner.temp }}/stock-stages.txt
            ${{ runner.temp }}/stock-logcat.txt
            ${{ runner.temp }}/stock-activity.txt
            ${{ runner.temp }}/emulator.log
          retention-days: 7
