name: Optional ChatGPT provider source qualification
on:
  workflow_dispatch:
  push:
    branches: [rewrite/rust-core]
    paths:
      - providers/chatgpt/**
      - crates/runtime-binding/**
      - scripts/qualify_provider_operator.py
      - scripts/qualify_provider_*.py
      - scripts/provider_qualification.py
      - scripts/clean_development.py
      - scripts/test_provider_qualification.py
      - scripts/chat_entry_client.mjs
      - scripts/d3_*
      - scripts/test_d3_notify.py
      - scripts/test_provider_f.py
      - scripts/test_provider_f_agents.py
      - scripts/qualification_diagnostics.py
      - scripts/test_qualification_diagnostics.py
      - scripts/qualify_managed_native_lifecycle.py
      - scripts/release_g_observer.py
      - scripts/f_cdp_relay*
      - scripts/fixtures/d3/**
      - scripts/check.sh
      - .github/workflows/provider-qualification.yml
permissions:
  contents: read
concurrency:
  group: provider-source-${{ github.ref }}
  cancel-in-progress: false
jobs:
  provider:
    name: Offline provider runtime and package regressions
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Fetch exact product source
        shell: bash
        run: |
          set -euo pipefail
          git init source
          git -C source remote add origin "https://github.com/$GITHUB_REPOSITORY.git"
          git -C source fetch --no-tags --depth=1 origin "$GITHUB_SHA"
          git -C source checkout --detach FETCH_HEAD
          test "$(git -C source rev-parse HEAD)" = "$GITHUB_SHA"
      - name: Provision pinned optional-provider test runtime
        id: bun
        shell: bash
        run: |
          set -euo pipefail
          tool="$RUNNER_TEMP/provider-bun"
          mkdir -m 0700 "$tool"
          curl --fail --silent --show-error --location --proto '=https' --tlsv1.2 \
            --connect-timeout 15 --max-time 180 --max-filesize 67108864 \
            https://github.com/oven-sh/bun/releases/download/bun-v1.4.0/bun-linux-x64-baseline.zip \
            --output "$tool/bun.zip"
          echo "184fb4595f0d401a217cf7c78c1bc430ba83314dab7a8b94805babbf7fa7097f  $tool/bun.zip" | sha256sum -c -
          unzip -p "$tool/bun.zip" bun-linux-x64-baseline/bun > "$tool/bun"
          chmod 0700 "$tool/bun"
          test "$("$tool/bun" --version)" = 1.4.0
          echo "binary_path=$tool/bun" >> "$GITHUB_OUTPUT"
      - name: Provision provider Rust toolchain
        shell: bash
        run: |
          set -euo pipefail
          version=$(python3 -c 'import tomllib; print(tomllib.load(open("source/providers/chatgpt/Cargo.toml", "rb"))["package"]["rust-version"])')
          rustup toolchain install "$version" --profile minimal --component rustfmt,clippy
          echo "RUSTUP_TOOLCHAIN=$version" >> "$GITHUB_ENV"
      - name: Run provider tests without real Chat or device state
        shell: bash
        env:
          BUN: ${{ steps.bun.outputs.binary_path }}
          TMPDIR: ${{ runner.temp }}
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          set -euo pipefail
          cd source
          test "$("$BUN" --version)" = 1.4.0
          scripts/check.sh provider 2>&1 | tee "$RUNNER_TEMP/provider-check.log"
      - name: Retain exact-input qualification
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: provider-source-proof
          path: ${{ runner.temp }}/provider-check.log
          if-no-files-found: error
          retention-days: 3

  android:
    name: Build independent Android Provider candidate
    needs: provider
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      ANDROID_API: '24'
      ANDROID_NDK_VERSION: '27.3.13750724'
    steps:
      - name: Fetch exact Provider source
        shell: bash
        run: |
          set -euo pipefail
          git init source
          git -C source remote add origin "https://github.com/$GITHUB_REPOSITORY.git"
          git -C source fetch --no-tags --depth=1 origin "$GITHUB_SHA"
          git -C source checkout --detach FETCH_HEAD
          test "$(git -C source rev-parse HEAD)" = "$GITHUB_SHA"
      - name: Build only the optional Rust executable
        shell: bash
        run: |
          set -euo pipefail
          cd source
          version=$(python3 -c 'import tomllib; print(tomllib.load(open("providers/chatgpt/Cargo.toml", "rb"))["package"]["rust-version"])')
          rustup toolchain install "$version" --profile minimal --target aarch64-linux-android
          toolchain="$ANDROID_SDK_ROOT/ndk/$ANDROID_NDK_VERSION/toolchains/llvm/prebuilt/linux-x86_64/bin"
          export CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER="$toolchain/aarch64-linux-android${ANDROID_API}-clang"
          export CC_aarch64_linux_android="$CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER"
          export AR_aarch64_linux_android="$toolchain/llvm-ar"
          test -x "$CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER"
          test -x "$AR_aarch64_linux_android"
          export CARGO_TARGET_DIR="${XDG_CACHE_HOME:-$HOME/.cache}/codex/provider-android-target"
          cargo "+$version" build --manifest-path providers/chatgpt/Cargo.toml --release --locked --target aarch64-linux-android
          artifact="$RUNNER_TEMP/provider-android"
          python3 -B providers/chatgpt/candidate.py package \
            --source . --source-sha "$GITHUB_SHA" --artifact "$artifact" \
            --binary "$CARGO_TARGET_DIR/aarch64-linux-android/release/codex-chatgpt-provider" \
            --run-id "$GITHUB_RUN_ID" --ndk "$ANDROID_NDK_VERSION" --rust "$version"
          python3 -B providers/chatgpt/candidate.py verify \
            --source . --source-sha "$GITHUB_SHA" --artifact "$artifact"
          git diff --exit-code
      - name: Retain unsigned optional candidate for Android qualification
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: provider-android-candidate
          path: ${{ runner.temp }}/provider-android
          if-no-files-found: error
          retention-days: 30
