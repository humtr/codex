[workspace]
members = ["."]
resolver = "2"

[package]
name = "codex-ext"
version = "0.1.0"
edition = "2021"
publish = false

[[bin]]
name = "codex-ext"
path = "src/main.rs"

[dependencies]
codex-daemon-client = { path = "../codex-daemon-client" }
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml_edit = "0.22"
