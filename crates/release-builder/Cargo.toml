[package]
name = "codex-release-builder"
version = "0.1.0"
edition = "2021"

[dependencies]
glob = "=0.3.3"
libc = "=0.2.186"
proc-macro2 = { version = "=1.0.107", features = ["span-locations"] }
quote = "=1.0.47"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.149"
toml = "=0.8.23"
syn = { version = "=2.0.119", features = ["full", "visit"] }
